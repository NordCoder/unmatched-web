name: Phase 4 YAML Syntax Correction

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/phase4-yaml-syntax-correction.yml"

permissions:
  contents: write

jobs:
  apply-syntax-correction:
    if: github.event.pull_request.head.ref == 'phase-4-final-integration'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: phase-4-final-integration
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install migration dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Apply and validate syntax-only corrections
        run: python scripts/apply_phase4_yaml_syntax_corrections.py

      - name: Commit corrected manifests
        run: |
          # This commit is syntax-only; the migration validates every card YAML first.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/cards/phase-4a docs/cards/phase-4b
          if git diff --cached --quiet; then
            echo "No syntax corrections required."
            exit 0
          fi
          git commit -m "fix: make integrated Phase 4 card YAML parseable"
          git push origin HEAD:phase-4-final-integration
