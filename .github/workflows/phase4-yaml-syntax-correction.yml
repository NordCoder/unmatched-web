name: Phase 4 YAML Correction Finalizer

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/phase4-yaml-syntax-correction.yml"

permissions:
  contents: write

jobs:
  finalize-correction:
    if: github.event.pull_request.head.ref == 'phase-4-final-integration'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: phase-4-final-integration
          fetch-depth: 0

      - name: Broaden requirement-definition parser and remove one-time tooling
        run: |
          python - <<'PY'
          from pathlib import Path

          validator = Path("scripts/validate_phase4_corpus.py")
          text = validator.read_text(encoding="utf-8")
          old = 'REQ_PATTERN = re.compile(r"^[ \\t]*- id: ([ABCD]-REQ-\\d+)\\s*$", re.MULTILINE)'
          new = 'REQ_PATTERN = re.compile(r"^(?:[ \\t]*- id:[ \\t]*`?|###[ \\t]+)([ABCD]-REQ-\\d+)(?:`|\\b)", re.MULTILINE)'
          if text.count(old) != 1:
              raise SystemExit(f"expected one legacy requirement pattern, found {text.count(old)}")
          validator.write_text(text.replace(old, new), encoding="utf-8")

          Path("scripts/apply_phase4_yaml_syntax_corrections.py").unlink()
          Path(".github/workflows/phase4-yaml-syntax-correction.yml").unlink()
          PY

      - name: Commit finalizer changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: finalize Phase 4 corpus validation tooling"
          git push origin HEAD:phase-4-final-integration
