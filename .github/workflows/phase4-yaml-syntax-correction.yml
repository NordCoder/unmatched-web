name: Phase 4 YAML Syntax Correction

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/phase4-yaml-syntax-correction.yml"

permissions:
  contents: write

jobs:
  apply-syntax-correction:
    if: github.event.pull_request.head.ref == 'phase-4-final-integration'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: phase-4-final-integration
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install migration dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Apply and validate syntax-only corrections
        shell: bash
        run: |
          mkdir -p artifacts
          python - <<'PY'
          from pathlib import Path
          path = Path("docs/cards/phase-4a/geralt-of-rivia.yaml")
          text = path.read_text(encoding="utf-8")
          old = "    name: GEAR: Sword of Silver"
          if text.count(old) != 1:
              raise SystemExit(f"expected one Silver Sword scalar, found {text.count(old)}")
          path.write_text(text.replace(old, '    name: "GEAR: Sword of Silver"'), encoding="utf-8")
          PY
          set -o pipefail
          python scripts/apply_phase4_yaml_syntax_corrections.py 2>&1 | tee artifacts/phase4-yaml-correction.log

      - name: Upload correction diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-yaml-correction-diagnostics
          path: artifacts/phase4-yaml-correction.log
          if-no-files-found: error

      - name: Commit corrected manifests
        run: |
          # This commit is syntax-only; the migration validates every card YAML first.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/cards/phase-4a docs/cards/phase-4b
          if git diff --cached --quiet; then
            echo "No syntax corrections required."
            exit 0
          fi
          git commit -m "fix: make integrated Phase 4 card YAML parseable"
          git push origin HEAD:phase-4-final-integration
