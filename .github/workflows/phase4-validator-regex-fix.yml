name: Phase 4 Validator Regex Fix

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/phase4-validator-regex-fix.yml"

permissions:
  contents: write

jobs:
  fix-validator-pattern:
    if: github.event.pull_request.head.ref == 'phase-4-final-integration'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: phase-4-final-integration
          fetch-depth: 0

      - name: Select one canonical definition occurrence per report format
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/validate_phase4_corpus.py")
          text = path.read_text(encoding="utf-8")
          old = 'REQ_PATTERN = re.compile(r"^(?:[ \\t]*- id:[ \\t]*`?|###[ \\t]+)([ABCD]-REQ-\\d+)(?:`|\\b)", re.MULTILINE)'
          new = 'REQ_PATTERN = re.compile(r"^(?:(?=[ \\t]*- id:[ \\t]*`?[ACD]-REQ-\\d+)|(?=###[ \\t]+B-REQ-\\d+))(?:[ \\t]*- id:[ \\t]*`?|###[ \\t]+)([ABCD]-REQ-\\d+)(?:`|\\b)", re.MULTILINE)'
          if text.count(old) != 1:
              raise SystemExit(f"expected one current requirement parser pattern, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          Path(".github/workflows/phase4-validator-regex-fix.yml").unlink()
          PY

      - name: Commit validator correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: parse owner requirement definitions once"
          git push origin HEAD:phase-4-final-integration
