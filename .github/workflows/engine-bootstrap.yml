name: Engine bootstrap

on:
  push:
    branches:
      - engine-bootstrap
  pull_request:
    paths:
      - ".github/workflows/engine-bootstrap.yml"
      - "apps/**"
      - "internal/**"
      - "packages/**"
      - "scripts/**"
      - "tests/architecture/**"
      - "tests/fixtures/**"
      - "go.mod"
      - "package.json"
      - "package-lock.json"
      - "compose.yaml"
      - "docs/engine/bootstrap-development.md"

permissions:
  contents: read

concurrency:
  group: engine-bootstrap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Validator regression tests
        run: python -m unittest discover -s tests/architecture -p "test_*.py"
      - name: Validate bootstrap architecture
        run: |
          set -o pipefail
          python scripts/validate_engine_bootstrap.py 2>&1 | tee architecture-validation.log
      - name: Upload architecture validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-validation-${{ github.sha }}
          path: architecture-validation.log
          if-no-files-found: error
          retention-days: 7

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify formatting
        run: test -z "$(gofmt -l apps internal)"
      - run: go vet ./...
      - run: go test ./...

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Verify health and named-volume persistence
        run: bash scripts/verify_postgres_persistence.sh
