name: Engine bootstrap

on:
  push:
    branches:
      - engine-bootstrap
  pull_request:
    paths:
      - ".github/workflows/engine-bootstrap.yml"
      - "apps/**"
      - "internal/**"
      - "packages/**"
      - "scripts/validate_engine_bootstrap.py"
      - "tests/fixtures/**"
      - "go.mod"
      - "package.json"
      - "package-lock.json"
      - "compose.yaml"

permissions:
  contents: read

concurrency:
  group: engine-bootstrap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python scripts/validate_engine_bootstrap.py

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify formatting
        run: test -z "$(gofmt -l apps internal)"
      - run: go vet ./...
      - run: go test ./...

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build
