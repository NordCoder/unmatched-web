name: Phase 4 Roadmap Finalizer

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/phase4-roadmap-finalizer.yml"

permissions:
  contents: write

jobs:
  finalize-roadmap:
    if: github.event.pull_request.head.ref == 'phase-4-final-integration'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: phase-4-final-integration
          fetch-depth: 0

      - name: Update roadmap and documentation map
        run: |
          # The workflow self-deletes after applying the documentation-only update.
          python - <<'PY'
          from pathlib import Path

          plan_path = Path("docs/research-plan.md")
          plan = plan_path.read_text(encoding="utf-8")
          start = plan.index("## Phase 4B — Complete fighter and deck corpus")
          end = plan.index("## Phase 5 — Battlefield corpus")
          phase4 = """## Phase 4B — Complete fighter and deck corpus

**Status:** **complete — final Phase 4 gate passed 2026-07-28.**

### Completed work

1. Integrated the ten Phase 4A representatives and all four reconciled Phase 4B ownership groups into one canonical corpus.
2. Established exactly **74 unique competitive fighter identities**, including one canonical Bruce Lee lineage and no evidence-alias duplicates.
3. Integrated **74 fighter manifests** and **74 paired card manifests**.
4. Completed fresh independent QA for all five physical-card correction scopes before integration.
5. Reconciled fixed and constructed decks, including Daredevil 22, Elektra 20, Black Widow 31, Geralt 36→30 and Buffy 35→30.
6. Preserved action cards, auxiliary decks, external definitions, positioned components and non-card components as distinct data categories.
7. Preserved four-axis verification status rather than inflating every fighter to `verified`.
8. Added a reproducible machine validator and persisted its result in [`fighters/phase-4-final-validation.json`](fighters/phase-4-final-validation.json).

### Final validation

```text
canonical fighter identities: 74
fighter manifests: 74
card manifests: 74
unique action-card definitions: 926
available action-card copies: 2214
owner requirements defined/referenced: 52/52
unresolved requirement references: 0
validation errors: 0
validation warnings: 0
status totals: 28 verified / 45 partial / 1 blocked
```

Deadpool remains the single blocked fighter because the digital-adaptation policy is intentionally unresolved. Partial fighters have deterministic published behavior but still require shared runtime capabilities or retain explicit source qualifications.

### Gate

- all 74 competitive fighters present: **PASS**;
- all deck constructions reconciled: **PASS**;
- all card-image P1/P2 corrections closed: **PASS**;
- all owner requirements resolvable by ID: **PASS**;
- evidence-only aliases separated from canonical IDs: **PASS**;
- physical-evidence qualifications preserved: **PASS**.

**Gate result:** PASS. See [`fighters/phase-4-final-validation.md`](fighters/phase-4-final-validation.md) and [`qa/phase-4-card-image/correction-integration-qa.md`](qa/phase-4-card-image/correction-integration-qa.md).

Passing Phase 4 completes the canonical published fighter/card corpus. It does **not** make the whole project developer-ready because owner requirements still need consolidation into one generic runtime contract.

---

## Phase 4C — Shared runtime requirements consolidation

**Status:** next major phase.

### Goal

Consolidate the 52 corpus-proven `A/B/C/D-REQ-*` definitions into canonical generic runtime capabilities. Aliases may remain for provenance, but one gameplay mechanic must not acquire multiple engine implementations.

### Parallel workstreams

1. Resolution, choices, history, delayed obligations, reconnect and RNG persistence.
2. Fighter presence, occupancy, footprints and positioned battlefield objects.
3. Movement, targeting, attack legality and combat participant replacement.
4. Damage, health assignment and continuous/dynamic modifiers.
5. Card zones, auxiliary decks, resources and action permissions.

### Output

- canonical requirement registry with owner aliases;
- developer-facing state/command/event/choice implications;
- persistence and visibility requirements;
- deterministic test scenarios;
- migrated manifest references or a temporary complete alias map.

### Gate

- owner requirements deduplicated;
- launch-scope runtime behavior deterministic;
- no undocumented character-specific semantics;
- no separate implementation of the same generic capability;
- launch-roster requirements implementation-ready.

---

"""
          plan_path.write_text(plan[:start] + phase4 + plan[end:], encoding="utf-8")

          readme_path = Path("docs/README.md")
          readme = readme_path.read_text(encoding="utf-8")
          readme = readme.replace(
              "| Complete fighter/deck corpus | planned — Phase 4B | `fighters/`, `cards/` |\n| Battlefields | planned | `battlefields/` |",
              "| Complete fighter/deck corpus | **verified — final Phase 4 gate passed** | `fighters/`, `cards/`, Phase 4 validation |\n| Shared runtime requirements consolidation | next — Phase 4C | `mechanics/runtime-requirements/` |\n| Battlefields | planned — MVP graph may proceed in parallel | `battlefields/` |",
          )
          readme = readme.replace(
              "├── mechanics/              # Phase 2 complete; effect taxonomy extended by Phase 4A\n├── sets/                   # Phase 3 complete\n├── fighters/               # Phase 4A complete; Phase 4B pending",
              "├── mechanics/              # Phase 2 complete; Phase 4C runtime consolidation next\n├── sets/                   # Phase 3 complete\n├── fighters/               # complete 74-fighter Phase 4 corpus and final validation",
          )
          readme = readme.replace(
              "│   ├── phase-4a-validation.md\n│   └── phase-4a/",
              "│   ├── phase-4a-validation.md\n│   ├── phase-4-final-validation.md\n│   ├── phase-4-final-validation.json\n│   ├── phase-4a/",
          )
          readme = readme.replace(
              "│       └── black-panther.yaml\n│\n├── cards/\n│   ├── README.md\n│   └── phase-4a/           # full normalized card manifests for the same 10 fighters",
              "│       └── black-panther.yaml\n│   └── phase-4b/          # reconciled manifests for the remaining 64 identities\n│\n├── cards/\n│   ├── README.md\n│   ├── phase-4a/          # ten representative manifests\n│   └── phase-4b/          # remaining reconciled competitive card corpus",
          )
          boundary = readme.index("## Current boundary")
          readme = readme[:boundary] + """## Current boundary

Phases 1–4 now establish:

- competitive core rules and deterministic timing/choice semantics;
- the authoritative release/set work queue and source hierarchy;
- a canonical corpus of **74 competitive fighter identities**;
- **74 fighter manifests** and **74 paired card manifests**;
- **926 unique action-card definitions** representing **2214 available copies**;
- reconciled fixed and constructed deck rules;
- explicit auxiliary decks, external definitions and non-card component boundaries;
- 52 resolvable corpus-proven shared-runtime requirements;
- preserved evidence, semantics, integration and policy status distinctions;
- reproducible machine validation with zero errors and zero warnings.

This still does **not** make the project globally `developer-ready`. Phase 4C must consolidate owner requirements into canonical generic runtime capabilities. Phase 5 must provide independently verified battlefield graphs. Phases 6–7 must close launch-scope ambiguities and freeze the developer-facing state/command/event/choice/persistence contract.

Engine foundation and one vertical-slice battlefield may proceed in parallel where the relevant contracts are already stable. Full-roster implementation must not bypass Phase 4C by adding fighter-ID conditionals or character-specific core-engine branches.
"""
          readme_path.write_text(readme, encoding="utf-8")

          Path(".github/workflows/phase4-roadmap-finalizer.yml").unlink()
          PY

      - name: Commit roadmap finalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: close Phase 4 and define Phase 4C gate"
          git push origin HEAD:phase-4-final-integration
