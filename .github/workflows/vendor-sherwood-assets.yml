name: Vendor Sherwood Forest assets

on:
  workflow_dispatch:
  push:
    branches:
      - playable-slice-robin-bigfoot
    paths:
      - ".github/workflows/vendor-sherwood-assets.yml"

permissions:
  contents: write

concurrency:
  group: vendor-sherwood-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: playable-slice-robin-bigfoot
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install deterministic image tooling
        run: python -m pip install --disable-pip-version-check "Pillow==11.3.0"
      - name: Decode uploaded source and build density assets
        run: |
          set -euo pipefail
          root=apps/web/static/battlefields/sherwood-forest
          transport=.github/asset-transport/sherwood-forest
          mkdir -p "$root"
          cat "$transport"/part-*.b64 | base64 --decode > "$root/board-1x.webp"
          echo "24f84b2dc91eee28a942f568be8e24a14b479bdaac51c11a2fc3dc9382b51162  $root/board-1x.webp" | sha256sum --check --strict
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFilter

          root = Path("apps/web/static/battlefields/sherwood-forest")
          source_path = root / "board-1x.webp"
          high_path = root / "board-2x.webp"

          with Image.open(source_path) as source_image:
              source = source_image.convert("RGBA")
          if source.size != (1337, 742):
              raise SystemExit(f"unexpected source dimensions: {source.size}")

          high = source.resize((2674, 1484), Image.Resampling.LANCZOS)
          high = high.filter(ImageFilter.UnsharpMask(radius=1.0, percent=90, threshold=2))
          high.save(high_path, "WEBP", quality=82, method=6)

          with Image.open(high_path) as high_image:
              if high_image.size != (2674, 1484):
                  raise SystemExit(f"unexpected 2x dimensions: {high_image.size}")

          if source_path.stat().st_size < 300_000:
              raise SystemExit("1x asset is unexpectedly small")
          if high_path.stat().st_size < 500_000:
              raise SystemExit("2x asset is unexpectedly small")
          print(source_path, source_path.stat().st_size)
          print(high_path, high_path.stat().st_size)
          PY
      - name: Commit local assets and remove one-time transport
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/static/battlefields/sherwood-forest/board-1x.webp
          git add apps/web/static/battlefields/sherwood-forest/board-2x.webp
          git rm -r .github/asset-transport/sherwood-forest
          git commit -m "Vendor local Sherwood Forest assets"
          git push origin HEAD:playable-slice-robin-bigfoot
