name: Engine runtime

on:
  push:
    branches:
      - engine-runtime-integration
      - engine-core-runtime
      - engine-rules-mechanics
      - playable-slice-robin-bigfoot
    paths:
      - "go.mod"
      - "internal/**"
      - "apps/**"
      - "tests/**"
      - "docs/engine/**"
      - "docs/battlefields/**"
      - "docs/cards/phase-4b/**"
      - "docs/fighters/phase-4b/**"
      - "scripts/validate_playable_slice.py"
      - "scripts/validate_battlefield_presentations.mjs"
      - "scripts/build_playable_web.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/engine-runtime.yml"
  pull_request:
    paths:
      - "go.mod"
      - "internal/**"
      - "apps/**"
      - "tests/**"
      - "docs/engine/**"
      - "docs/battlefields/**"
      - "docs/cards/phase-4b/**"
      - "docs/fighters/phase-4b/**"
      - "scripts/validate_playable_slice.py"
      - "scripts/validate_battlefield_presentations.mjs"
      - "scripts/build_playable_web.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/engine-runtime.yml"

permissions:
  contents: write

concurrency:
  group: engine-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vendor-sherwood-assets:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: playable-slice-robin-bigfoot
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Vendor uploaded battlefield source through one-time image transport
        env:
          SOURCE_URL: https://www.unmatchedpicks.com/_next/image?url=%2Fmaps%2Fsherwoodforest.webp&w=2048&q=100
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "Pillow==11.3.0"
          destination=apps/web/static/battlefields/sherwood-forest
          mkdir -p "$destination"
          curl --fail --location --retry 4 --retry-delay 2 \
            --user-agent "unmatched-web-asset-vendor/1.0" \
            "$SOURCE_URL" \
            --output "$destination/source-download.webp"
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFilter

          root = Path("apps/web/static/battlefields/sherwood-forest")
          downloaded = root / "source-download.webp"
          if downloaded.stat().st_size < 250_000:
              raise SystemExit(f"Sherwood transport image is unexpectedly compressed: {downloaded.stat().st_size} bytes")
          source = Image.open(downloaded).convert("RGBA")
          expected_ratio = 1337 / 742
          if abs(source.width / source.height - expected_ratio) > 0.002:
              raise SystemExit(f"unexpected Sherwood transport aspect ratio: {source.size}")

          one_x = source.resize((1337, 742), Image.Resampling.LANCZOS)
          one_x.save(root / "board-1x.webp", "WEBP", quality=100, method=6)

          two_x = source.resize((2674, 1484), Image.Resampling.LANCZOS)
          two_x = two_x.filter(ImageFilter.UnsharpMask(radius=1.0, percent=90, threshold=2))
          two_x.save(root / "board-2x.webp", "WEBP", quality=92, method=6)
          downloaded.unlink()

          for name, dimensions, minimum in [
              ("board-1x.webp", (1337, 742), 300_000),
              ("board-2x.webp", (2674, 1484), 700_000),
          ]:
              path = root / name
              check = Image.open(path)
              if check.size != dimensions:
                  raise SystemExit(f"unexpected {name} dimensions: {check.size}")
              if path.stat().st_size < minimum:
                  raise SystemExit(f"{name} is unexpectedly compressed: {path.stat().st_size} bytes")
              print(f"{name}: {path.stat().st_size} bytes")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$destination/board-1x.webp" "$destination/board-2x.webp"
          if git diff --cached --quiet; then
            echo "Sherwood assets already match the local copies."
            exit 0
          fi
          git commit -m "Vendor local Sherwood Forest assets"
          git push origin HEAD:playable-slice-robin-bigfoot

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Verify playable-slice Go formatting
        run: |
          gofmt -w apps/server/main.go apps/web/embed.go internal/playableslice docs/cards/phase-4b/embed.go docs/fighters/phase-4b/embed.go tests/integration/playableslice
          git diff --exit-code
      - name: Validate playable content and battlefield
        run: |
          python scripts/validate_playable_slice.py
          python -m unittest tests/architecture/test_playable_slice.py
      - run: go vet ./...
      - run: go test -race ./...
      - name: Verify deterministic complete match
        run: go test ./internal/playableslice/game -run TestDeterministicCompleteMatch -count=1
      - name: Build runnable QA server
        run: |
          mkdir -p dist
          go build -trimpath -o dist/unmatched-web ./apps/server
          cat > dist/README.txt <<'EOF'
          Exact-Head runnable QA server for the Robin Hood vs Bigfoot playable slice.

          Run:
            chmod +x unmatched-web
            ./unmatched-web

          Then open http://localhost:8080 in two browser tabs.
          Override the port with PORT, for example PORT=8090 ./unmatched-web.
          EOF
      - name: Upload exact-Head runnable QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: unmatched-web-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Verify generated frontend is committed
        run: git diff --exit-code
