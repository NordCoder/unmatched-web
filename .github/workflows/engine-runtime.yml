name: Engine runtime

on:
  push:
    branches:
      - engine-runtime-integration
      - engine-core-runtime
      - engine-rules-mechanics
      - playable-slice-robin-bigfoot
    paths:
      - "go.mod"
      - "internal/**"
      - "apps/**"
      - "tests/**"
      - "docs/engine/**"
      - "docs/battlefields/**"
      - "docs/cards/phase-4b/**"
      - "docs/fighters/phase-4b/**"
      - "scripts/validate_playable_slice.py"
      - "scripts/validate_battlefield_presentations.mjs"
      - "scripts/build_playable_web.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/engine-runtime.yml"
  pull_request:
    paths:
      - "go.mod"
      - "internal/**"
      - "apps/**"
      - "tests/**"
      - "docs/engine/**"
      - "docs/battlefields/**"
      - "docs/cards/phase-4b/**"
      - "docs/fighters/phase-4b/**"
      - "scripts/validate_playable_slice.py"
      - "scripts/validate_battlefield_presentations.mjs"
      - "scripts/build_playable_web.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/engine-runtime.yml"

permissions:
  contents: write

concurrency:
  group: engine-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vendor-sherwood-assets:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: playable-slice-robin-bigfoot
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Vendor uploaded battlefield source through one-time image transport
        env:
          SOURCE_URL: https://wsrv.nl/?url=www.unmatchedpicks.com/maps/sherwoodforest.webp&output=webp&q=100
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "Pillow==11.3.0"
          destination=apps/web/static/battlefields/sherwood-forest
          mkdir -p "$destination"
          curl --fail --location --retry 4 --retry-delay 2 \
            --user-agent "unmatched-web-asset-vendor/1.0" \
            "$SOURCE_URL" \
            --output "$destination/board-1x.webp"
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFilter

          root = Path("apps/web/static/battlefields/sherwood-forest")
          source_path = root / "board-1x.webp"
          if source_path.stat().st_size < 300_000:
              raise SystemExit(f"Sherwood source is unexpectedly compressed: {source_path.stat().st_size} bytes")
          source = Image.open(source_path).convert("RGBA")
          if source.size != (1337, 742):
              raise SystemExit(f"unexpected Sherwood source dimensions: {source.size}")
          high_density = source.resize((2674, 1484), Image.Resampling.LANCZOS)
          high_density = high_density.filter(ImageFilter.UnsharpMask(radius=1.1, percent=105, threshold=2))
          high_density.save(root / "board-2x.webp", "WEBP", quality=82, method=6)
          check = Image.open(root / "board-2x.webp")
          if check.size != (2674, 1484):
              raise SystemExit(f"unexpected Sherwood 2x dimensions: {check.size}")
          print(f"1x bytes={source_path.stat().st_size}; 2x bytes={(root / 'board-2x.webp').stat().st_size}")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$destination/board-1x.webp" "$destination/board-2x.webp"
          if git diff --cached --quiet; then
            echo "Sherwood assets already match the local copies."
            exit 0
          fi
          git commit -m "Vendor local Sherwood Forest assets"
          git push origin HEAD:playable-slice-robin-bigfoot

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Verify playable-slice Go formatting
        run: |
          gofmt -w apps/server/main.go apps/web/embed.go internal/playableslice docs/cards/phase-4b/embed.go docs/fighters/phase-4b/embed.go tests/integration/playableslice
          git diff --exit-code
      - name: Validate playable content and battlefield
        run: |
          python scripts/validate_playable_slice.py
          python -m unittest tests/architecture/test_playable_slice.py
      - run: go vet ./...
      - run: go test -race ./...
      - name: Verify deterministic complete match
        run: go test ./internal/playableslice/game -run TestDeterministicCompleteMatch -count=1
      - name: Build runnable QA server
        run: |
          mkdir -p dist
          go build -trimpath -o dist/unmatched-web ./apps/server
          cat > dist/README.txt <<'EOF'
          Exact-Head runnable QA server for the Robin Hood vs Bigfoot playable slice.

          Run:
            chmod +x unmatched-web
            ./unmatched-web

          Then open http://localhost:8080 in two browser tabs.
          Override the port with PORT, for example PORT=8090 ./unmatched-web.
          EOF
      - name: Upload exact-Head runnable QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: unmatched-web-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Verify generated frontend is committed
        run: git diff --exit-code
