name: Engine runtime

on:
  push:
    branches:
      - engine-runtime-integration
      - engine-core-runtime
      - engine-rules-mechanics
    paths:
      - "go.mod"
      - "internal/**"
      - "tests/**"
      - "docs/engine/implementation-plan.md"
      - ".github/workflows/engine-runtime.yml"
  pull_request:
    paths:
      - "go.mod"
      - "internal/**"
      - "tests/**"
      - "docs/engine/implementation-plan.md"
      - ".github/workflows/engine-runtime.yml"

permissions:
  contents: read

concurrency:
  group: engine-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Normalize formatting for compile checks
        run: gofmt -w internal
      - run: go vet ./...
      - run: go test -race ./...
