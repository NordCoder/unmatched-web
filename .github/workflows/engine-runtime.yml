name: Engine runtime

on:
  push:
    branches:
      - engine-runtime-integration
      - engine-core-runtime
      - engine-rules-mechanics
      - playable-slice-robin-bigfoot
    paths:
      - "go.mod"
      - "internal/**"
      - "apps/**"
      - "tests/**"
      - "docs/engine/**"
      - "docs/battlefields/**"
      - "docs/cards/phase-4b/**"
      - "docs/fighters/phase-4b/**"
      - "scripts/validate_playable_slice.py"
      - "scripts/validate_battlefield_presentations.mjs"
      - "scripts/build_playable_web.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/engine-runtime.yml"
  pull_request:
    paths:
      - "go.mod"
      - "internal/**"
      - "apps/**"
      - "tests/**"
      - "docs/engine/**"
      - "docs/battlefields/**"
      - "docs/cards/phase-4b/**"
      - "docs/fighters/phase-4b/**"
      - "scripts/validate_playable_slice.py"
      - "scripts/validate_battlefield_presentations.mjs"
      - "scripts/build_playable_web.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/engine-runtime.yml"

permissions:
  contents: write

concurrency:
  group: engine-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vendor-sherwood-assets:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: playable-slice-robin-bigfoot
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install deterministic image tooling
        run: python -m pip install --disable-pip-version-check "Pillow==11.3.0"
      - name: Decode uploaded source and build density assets
        id: assets
        run: |
          set -euo pipefail
          root=apps/web/static/battlefields/sherwood-forest
          transport=.github/asset-transport/sherwood-forest
          if [ ! -d "$transport" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "One-time transport already consumed."
            exit 0
          fi
          mkdir -p "$root"
          cat "$transport"/part-*.b64 | base64 --decode > "$root/board-1x.webp"
          echo "24f84b2dc91eee28a942f568be8e24a14b479bdaac51c11a2fc3dc9382b51162  $root/board-1x.webp" | sha256sum --check --strict
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFilter

          root = Path("apps/web/static/battlefields/sherwood-forest")
          source_path = root / "board-1x.webp"
          high_path = root / "board-2x.webp"

          with Image.open(source_path) as source_image:
              source = source_image.convert("RGBA")
          if source.size != (1337, 742):
              raise SystemExit(f"unexpected source dimensions: {source.size}")

          high = source.resize((2674, 1484), Image.Resampling.LANCZOS)
          high = high.filter(ImageFilter.UnsharpMask(radius=1.0, percent=90, threshold=2))
          high.save(high_path, "WEBP", quality=82, method=6)

          with Image.open(high_path) as high_image:
              if high_image.size != (2674, 1484):
                  raise SystemExit(f"unexpected 2x dimensions: {high_image.size}")

          if source_path.stat().st_size < 300_000:
              raise SystemExit("1x asset is unexpectedly small")
          if high_path.stat().st_size < 500_000:
              raise SystemExit("2x asset is unexpectedly small")
          print(source_path, source_path.stat().st_size)
          print(high_path, high_path.stat().st_size)
          PY
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Commit local assets and remove one-time transport
        if: steps.assets.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/static/battlefields/sherwood-forest/board-1x.webp
          git add apps/web/static/battlefields/sherwood-forest/board-2x.webp
          git rm -r .github/asset-transport/sherwood-forest
          git commit -m "Vendor local Sherwood Forest assets"
          git push origin HEAD:playable-slice-robin-bigfoot

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Verify playable-slice Go formatting
        run: |
          gofmt -w apps/server/main.go apps/web/embed.go internal/playableslice docs/cards/phase-4b/embed.go docs/fighters/phase-4b/embed.go tests/integration/playableslice
          git diff --exit-code
      - name: Validate playable content and battlefield
        run: |
          python scripts/validate_playable_slice.py
          python -m unittest tests/architecture/test_playable_slice.py
      - run: go vet ./...
      - run: go test -race ./...
      - name: Verify deterministic complete match
        run: go test ./internal/playableslice/game -run TestDeterministicCompleteMatch -count=1
      - name: Build runnable QA server
        run: |
          mkdir -p dist
          go build -trimpath -o dist/unmatched-web ./apps/server
          cat > dist/README.txt <<'EOF'
          Exact-Head runnable QA server for the Robin Hood vs Bigfoot playable slice.

          Run:
            chmod +x unmatched-web
            ./unmatched-web

          Then open http://localhost:8080 in two browser tabs.
          Override the port with PORT, for example PORT=8090 ./unmatched-web.
          EOF
      - name: Upload exact-Head runnable QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: unmatched-web-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Verify generated frontend is committed
        run: git diff --exit-code
