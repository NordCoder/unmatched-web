name: Phase 4 Corpus Validation

on:
  push:
    branches:
      - phase-4-final-integration
    paths:
      - "docs/fighters/**"
      - "docs/cards/**"
      - "docs/phase-4b/**"
      - "scripts/validate_phase4_corpus.py"
      - ".github/workflows/phase4-corpus-validation.yml"
  pull_request:
    paths:
      - "docs/fighters/**"
      - "docs/cards/**"
      - "docs/phase-4b/**"
      - "scripts/validate_phase4_corpus.py"
      - ".github/workflows/phase4-corpus-validation.yml"

permissions:
  contents: read

jobs:
  validate-phase4-corpus:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Validate Phase 4 corpus
        run: python scripts/validate_phase4_corpus.py

      - name: Upload machine-readable validation result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-4-validation
          path: artifacts/phase-4-validation.json
          if-no-files-found: error
