<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#18251d">
  <title>Unmatched — Robin Hood vs Bigfoot</title>
  <link rel="preload" href="/battlefields/sherwood-forest/manifest.json" as="fetch" crossorigin="anonymous">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/stage5-battlefield.css">
</head>
<body>
  <div id="battlefield-loading" class="battlefield-loading" role="status" aria-live="polite" hidden>
    <div class="battlefield-loading-card">
      <span class="battlefield-spinner" aria-hidden="true"></span>
      <strong id="battlefield-loading-label">Preparing battlefield…</strong>
      <small>Loading map, geometry and fighter tokens</small>
    </div>
  </div>
  <header>
    <div><strong>UNMATCHED</strong><span>Robin Hood vs Bigfoot · Sherwood Forest</span></div>
    <button id="reset" class="ghost" hidden>Leave</button>
  </header>
  <main>
    <section id="lobby" class="panel lobby">
      <h1>Play in two browser tabs</h1>
      <p>Create the match in this tab, copy the code, then join from a second tab.</p>
      <button id="create">Create match as Robin Hood</button>
      <div class="join-row"><input id="join-code" autocomplete="off" placeholder="match code"><button id="join">Join as Bigfoot</button></div>
    </section>
    <section id="game" hidden>
      <div id="status" class="panel"></div>
      <div id="error" class="error" hidden></div>
      <div class="layout">
        <section class="panel board-panel">
          <div id="board-interaction" class="board-interaction" aria-live="polite"></div>
          <div class="board-frame">
            <svg id="board" viewBox="0 0 1337 742" preserveAspectRatio="xMidYMid meet" role="application" aria-label="Interactive battlefield" aria-describedby="board-interaction"></svg>
          </div>
        </section>
        <aside>
          <section id="players" class="panel"></section>
          <section id="pending" class="panel" hidden></section>
          <section id="actions" class="panel"></section>
        </aside>
      </div>
      <section id="combat" class="panel" hidden></section>
      <section class="panel"><h2>Your hand</h2><div id="hand" class="hand"></div></section>
      <section class="panel"><h2>Public event log</h2><ol id="events" class="events"></ol></section>
    </section>
  </main>
  <dialog id="action-dialog"><form method="dialog"><h2 id="dialog-title">Action</h2><div id="dialog-body"></div><menu><button value="cancel" class="ghost">Cancel</button><button id="dialog-submit" value="default">Submit</button></menu></form></dialog>
  <script src="/card-art.js"></script>
  <script src="/battlefield-renderer.js"></script>
  <script src="/app.js"></script>
  <script src="/stage4.js"></script>
  <script src="/stage5-battlefield.js"></script>
</body>
</html>
