services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-unmatched}
      POSTGRES_USER: ${POSTGRES_USER:-unmatched}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-unmatched-local-only}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - unmatched-postgres-data:/var/lib/postgresql/data

volumes:
  unmatched-postgres-data:
