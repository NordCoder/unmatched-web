services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-unmatched}
      POSTGRES_USER: ${POSTGRES_USER:-unmatched}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-unmatched-local-only}
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - unmatched-postgres-data:/var/lib/postgresql

volumes:
  unmatched-postgres-data:
