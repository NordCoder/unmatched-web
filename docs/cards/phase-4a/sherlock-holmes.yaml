schema_version: 1
fighter_id: sherlock-holmes
status: verified
construction: {kind: fixed, available_pool_count: 30, game_deck_count: 30}

cards:
  - id: feint
    name: Feint
    quantity: 3
    usable_by: any
    type: versatile
    printed_value: 2
    boost: 1
    effects:
      - trigger: immediately
        operations: [{op: CANCEL_EFFECTS, target_scope: opposing_combat_card}]
    cancellation: cancelable

  - id: education-never-ends
    name: Education Never Ends
    quantity: 2
    usable_by: any
    type: versatile
    printed_value: 3
    boost: 1
    effects:
      - trigger: after_combat
        branches:
          - condition: {combat_result: won}
            operations: [{op: DRAW, controller: opponent, count: 1}]
          - condition: {combat_result: lost}
            operations: [{op: DRAW, controller: controller, count: 2}]

  - id: study-methods
    name: Study Methods
    quantity: 2
    usable_by: any
    type: versatile
    printed_value: 3
    boost: 2
    effects:
      - trigger: after_combat
        condition: {combat_result: won}
        operations: [{op: LOOK_AT, source: opponent.hand, selector: all, viewer: controller}]

  - id: deduce-strategy
    name: Deduce Strategy
    quantity: 3
    usable_by: [sherlock-holmes]
    type: versatile
    printed_value: 3
    boost: 1
    cancellation: inherited_protected
    effects:
      - trigger: during_combat
        optional: true
        operations:
          - op: SET_PRINTED_VALUE
            target: opposing_combat_card
            value_from: opposing_combat_card.boost_or_0
            scope: current_combat

  - id: counterpunch
    name: Counterpunch
    quantity: 3
    usable_by: [sherlock-holmes]
    type: versatile
    printed_value: 3
    boost: 1
    cancellation: inherited_protected
    effects:
      - trigger: after_combat
        condition: {sherlock_holmes_adjacent_to_opposing_combat_fighter: true}
        operations: [{op: DEAL_EFFECT_DAMAGE, target: opposing_combat_fighter, amount: 2}]

  - id: fixed-point-in-a-changing-age
    name: Fixed Point in a Changing Age
    quantity: 2
    usable_by: [dr-watson]
    type: versatile
    printed_value: 3
    boost: 1
    cancellation: inherited_protected
    effects:
      - trigger: after_combat
        condition: {dr_watson_adjacent_to_sherlock_holmes: true}
        operations:
          - {op: RECOVER, target: dr-watson, amount: 1}
          - {op: RECOVER, target: sherlock-holmes, amount: 1}

  - id: the-game-is-afoot
    name: The Game is Afoot
    quantity: 2
    usable_by: [sherlock-holmes]
    type: attack
    printed_value: 5
    boost: 2
    cancellation: inherited_protected
    effects:
      - trigger: after_combat
        operations: [{op: MOVE, target: sherlock-holmes, max_distance: 3}]

  - id: service-revolver
    name: Service Revolver
    quantity: 2
    usable_by: [dr-watson]
    type: attack
    printed_value: 5
    boost: 3
    cancellation: inherited_protected
    effects: []

  - id: elementary
    name: Elementary
    quantity: 2
    usable_by: [sherlock-holmes]
    type: defense
    printed_value: 3
    boost: 3
    cancellation: inherited_protected
    play_visibility: face_up_on_commit
    pre_reveal_choices:
      - id: predict-opponent-printed-attack-value
        owner: controller
        visibility: public_after_lock
        choose: integer_attack_value
        lock_before: reveal_combat_cards
    effects:
      - trigger: during_combat
        condition: {prediction_equals: opposing_combat_card.printed_attack_value}
        operations:
          - {op: CANCEL_EFFECTS, target_scope: opposing_combat_card}
          - {op: IGNORE_VALUE, target: opposing_attack_value}

  - id: confirm-suspicion
    name: Confirm Suspicion
    quantity: 3
    usable_by: [sherlock-holmes]
    type: scheme
    printed_value: null
    boost: 1
    cancellation: inherited_protected
    effects:
      - trigger: scheme
        choices:
          - {owner: controller, choose: opponent}
          - {owner: controller, choose: attack_or_defense_printed_value}
        branches:
          - condition: {chosen_opponent_has_matching_attack_or_defense_card: true}
            choices:
              - {owner: chosen_opponent, choose: matching_card_from_hand}
            operations:
              - {op: DISCARD, controller: chosen_opponent, from: hand, selector: chosen_card, count: 1, capture: discarded_card}
              - {op: DEAL_EFFECT_DAMAGE, target: chosen_opponent.hero, amount_from: captured.discarded_card.boost_or_0}
          - condition: {chosen_opponent_has_matching_attack_or_defense_card: false}
            operations: [{op: REVEAL, source: chosen_opponent.hand, selector: all}]

  - id: eliminate-the-impossible
    name: Eliminate the Impossible
    quantity: 2
    usable_by: [sherlock-holmes]
    type: scheme
    printed_value: null
    boost: 2
    cancellation: inherited_protected
    effects:
      - trigger: scheme
        choices: [{owner: controller, choose: opponent}]
        operations: [{op: LOOK_AT, source: chosen_opponent.hand, selector: all, viewer: controller}]
        nested_choice:
          owner: controller
          choose: one_card_from_viewed_hand
          then: [{op: DISCARD, controller: chosen_opponent, from: hand, selector: chosen_card, count: 1}]

  - id: master-of-disguise
    name: Master of Disguise
    quantity: 2
    usable_by: [sherlock-holmes]
    type: scheme
    printed_value: null
    boost: 2
    cancellation: inherited_protected
    effects:
      - trigger: scheme
        choices:
          - owner: controller
            choose: opponent_with_on_board_hero_and_valid_swap_geometry
        operations:
          - {op: SWAP, a: sherlock-holmes, b: chosen_opponent.hero}
          - {op: DEAL_EFFECT_DAMAGE, target: chosen_opponent.hero, amount: 1}

  - id: administer-aid
    name: Administer Aid
    quantity: 2
    usable_by: [dr-watson]
    type: scheme
    printed_value: null
    boost: 2
    cancellation: inherited_protected
    effects:
      - trigger: scheme
        choices: [{owner: controller, choose: space_adjacent_to_sherlock_holmes}]
        operations:
          - {op: PLACE, target: dr-watson, destination: chosen_space}
          - {op: RECOVER, target: sherlock-holmes, amount: 1}
          - {op: DRAW, count: 1}

external_definitions: []

validation:
  available_pool_count: 30
  game_deck_count: 30
  quantity_sum: 30
  unique_card_definitions: 13

sources:
  - https://unmatched.cards/umdb/decks/sherlock-holmes
  - https://restorationgames.com/wp-content/uploads/2020/05/UM-Cobble_and_Fog-rules-two-page.pdf
  - https://www.the-unmatched.club/rules/sherlock-holmes

normalization_notes:
  - SET_PRINTED_VALUE is a Phase 4A primitive extension distinct from SET_VALUE/current combat value.
  - Elementary proves that combat-card commitment can have source-defined face-up visibility plus a separate locked pre-reveal prediction.
  - Cancellation protection is inherited only by HOLMES/DR. WATSON card definitions; ANY cards remain normally cancelable.