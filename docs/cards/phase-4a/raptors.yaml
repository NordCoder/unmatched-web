schema_version: 1
fighter_id: raptors
status: verified
construction: {kind: fixed, available_pool_count: 30, game_deck_count: 30}

cards:
  - id: disengage
    name: Disengage
    quantity: 2
    usable_by: any
    type: attack
    printed_value: 4
    boost: 2
    effects:
      - trigger: after_combat
        choices: [{owner: controller, choose: empty_space_in_own_combat_fighter_zone}]
        operations: [{op: PLACE, target: own_combat_fighter, destination: chosen_space}]

  - id: clever-girl
    name: Clever Girl
    quantity: 3
    usable_by: any
    type: attack
    printed_value: 3
    boost: 3
    effects:
      - trigger: after_combat
        condition: {one_or_more_friendly_raptors_adjacent_to_opposing_combat_fighter: true}
        operations: [{op: GAIN_ACTION, count: 1}]

  - id: pack-hunters
    name: Pack Hunters
    quantity: 2
    usable_by: any
    type: attack
    printed_value: 4
    boost: 2
    effects:
      - trigger: after_combat
        condition: {combat_result: won}
        operations: [{op: DEAL_EFFECT_DAMAGE, target: opposing_combat_fighter, amount_rule: count_friendly_raptors_adjacent_to_target}]

  - id: eaten-alive
    name: Eaten Alive
    quantity: 3
    usable_by: any
    type: versatile
    printed_value: 4
    boost: 2
    effects:
      - trigger: after_combat
        condition: {combat_result: won}
        choices: [{owner: controller, choose: adjacent_opposing_fighter}]
        operations: [{op: DEAL_EFFECT_DAMAGE, target: chosen_fighter, amount: 1}]

  - id: they-remember
    name: They Remember
    quantity: 4
    usable_by: any
    type: attack
    printed_value: 2
    boost: 2
    effects:
      - trigger: after_combat
        operations: [{op: GAIN_ACTION, count: 1}]

  - id: eviscerate
    name: Eviscerate
    quantity: 2
    usable_by: any
    type: attack
    printed_value: 5
    boost: 3
    effects: []

  - id: ambush
    name: Ambush
    quantity: 3
    usable_by: any
    type: attack
    printed_value: 2
    boost: 3
    effects:
      - trigger: during_combat
        operations:
          - {op: DISCARD, controller: opponent, from: hand, selector: random, count: 1, capture: discarded_card}
          - {op: ADD_VALUE, target: this_card, amount: captured.discarded_card.boost_or_0}

  - id: feint
    name: Feint
    quantity: 3
    usable_by: any
    type: versatile
    printed_value: 2
    boost: 1
    effects:
      - trigger: immediately
        operations: [{op: CANCEL_EFFECTS, target_scope: opposing_combat_card}]

  - id: decoy
    name: Decoy
    quantity: 4
    usable_by: any
    type: defense
    printed_value: 3
    boost: 1
    effects:
      - trigger: immediately
        choices:
          - owner: controller
            choose: other_undefeated_raptor
        optional_followup:
          choices: [{owner: controller, choose: space_adjacent_to_opposing_combat_fighter}]
          operations: [{op: PLACE, target: chosen_raptor, destination: chosen_space}]

  - id: coordinated-attack-pattern
    name: Coordinated Attack Pattern
    quantity: 2
    usable_by: any
    type: scheme
    printed_value: null
    boost: 2
    effects:
      - trigger: scheme
        choices: [{owner: controller, choose: friendly_undefeated_raptor, capture: anchor_raptor}]
        operations:
          - op: PLACE
            target: each_other_undefeated_raptor
            optional_each: true
            destination_rule: any_space_in_anchor_raptor_zone

  - id: working-things-out
    name: Working Things Out
    quantity: 2
    usable_by: any
    type: scheme
    printed_value: null
    boost: 2
    effects:
      - trigger: scheme
        operations:
          - op: MOVE
            target: each_undefeated_raptor
            max_distance: 3
            overrides: [may_move_through_opposing_fighters]
          - {op: GAIN_ACTION, count: 1}

external_definitions: []

validation:
  available_pool_count: 30
  game_deck_count: 30
  quantity_sum: 30
  unique_card_definitions: 11

sources:
  - https://unmatched.cards/umdb/decks/raptors
  - https://restorationgames.com/wp-content/uploads/2020/05/UM-JP-Ingen_v_Raptors-rules-two-page.pdf
  - https://www.the-unmatched.club/rules/raptors

normalization_notes:
  - `any` means any surviving Raptor instance in this shared multi-hero deck.
  - Placement effects filter defeated Raptors out of candidate fighters and therefore cannot act as resurrection.
  - The deck needs no multi-hero-specific card primitive; ordinary MOVE/PLACE target selectors operate over multiple hero instances.
