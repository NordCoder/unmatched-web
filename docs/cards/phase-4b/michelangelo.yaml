- id: shell-insertion
  name: Shell Insertion
  quantity: 2
  inclusion: fixed
  usable_by: [april-oneil]
  type: scheme
  printed_value: null
  boost: 3
  tags: []
  effects:
  - id: shell-insertion
    trigger: scheme
    requires: [D-REQ-001]
    stages:
    - id: choose-two
      choices:
      - id: effects
        owner: controller
        visibility: public
        optional: false
        domain: {choose_distinct: {from: [each_opponent_discards, move_friendly, bottom_card_for_action, recycle_random], count: 2}}
        bind: selected_effects
    - id: resolve-selected-in-printed-order
      repeat_for_each: [each_opponent_discards, move_friendly, bottom_card_for_action, recycle_random]
      condition: {current_repeat_item_in: bound.selected_effects}
      branches:
      - condition: {current_repeat_item: each_opponent_discards}
        operations: [{op: DISCARD, from: each_opponent_hand, selector: opponent_chosen, count: 1, controller: each_opponent}]
      - condition: {current_repeat_item: move_friendly}
        choices: [{id: fighter, owner: controller, visibility: public, optional: false, domain: friendly_fighters, bind: fighter}]
        operations: [{op: MOVE, target: bound.fighter, max_distance: 2}]
      - condition: {current_repeat_item: bottom_card_for_action}
        choices: [{id: hand-card, owner: controller, visibility: private, optional: false, domain: own_hand_cards, bind: card}]
        costs: [{op: MOVE_CARD, from_zone: hand, to_zone: deck, selector: bound.card, position: bottom}]
        operations: [{op: GAIN_ACTION, count: 1}]
        dependency: gain_action_only_if_bottom_card_cost_paid
      - condition: {current_repeat_item: recycle_random}
        operations: [{op: MOVE_CARD, from_zone: discard, to_zone: deck, selector: random, count: 2}, {op: SHUFFLE, zone: deck}]
