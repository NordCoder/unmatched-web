normalization_notes:
- All 12 definitions reconcile to 30 physical cards.
- Back for Seconds and Shell Insertion recycling use explicit SHUFFLE after cards enter the deck; RNG is not encoded as a MOVE_CARD position shortcut.
- Shell Insertion is a choose-two-distinct multi-effect composite pending generic choice-fanout integration.
- Cowabunga requires authoritative per-turn card-play history; that history model remains an orchestrator integration item rather than an implicit current-state reconstruction.
- Adventures enemy/scenario behavior is excluded.
