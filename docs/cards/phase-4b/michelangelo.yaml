normalization_notes:
- All 12 definitions reconcile to 30 cards.
- Cowabunga reads canonical PLAY events, not discard/move/reveal events, under D-REQ-014.
- Shell Insertion chooses two distinct effects, resolves selected effects in printed order, and treats bottoming a hand card as the prerequisite cost for gaining an action.
- Starting/max hand-size dependency remains D-REQ-013 at the fighter/pair level.
