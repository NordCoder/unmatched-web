normalization_notes:
  - Regroup uses mutually exclusive won/not-won branches so its published "draw 2 instead" replacement is not represented as two independent draw effects.
  - Current UmDb aggregate statistics require 5 unique Attack definitions / 12 attack cards and 5 unique Versatile definitions / 13 versatile cards. Wisdom of Ages is therefore Attack; The Rogue Slayer remains Versatile.
  - Current official Disengage errata requires an empty destination space.