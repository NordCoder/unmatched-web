normalization_notes:
  - Published pool is 35 cards, but every game deck is exactly 30: 25 base plus the selected sidekick's five-card package.
  - Current allowed sources identify Right-hand Man as a Xander card, value 2, BOOST 3, whose combat value becomes 6 when Xander is adjacent to Buffy.
  - A community/fan transcription additionally claims Buffy may play Right-hand Man while adjacent to Xander. Because the current official rulebook, Reference and published UmDb checked do not substantiate that parenthetical permission, it is deliberately not encoded as canonical gameplay semantics; this remains a source blocker.