    name: Skirmish
    quantity: 3
    inclusion: base
    usable_by: any
    type: versatile
    printed_value: 4
    boost: 3
    effects:
      - id: skirmish-move
        trigger: after_combat
        controller: owner
        cancellation: cancelable
        stages:
          - id: choose-fighter
            when: {combat: {result: won}}
            choices:
              - {id: choose-combat-fighter, owner: controller, visibility: public, optional: false, domain: {kind: fighter, relation: in_current_combat}, bind: chosen_fighter}
            costs: []
            operations: [{op: MOVE, target: {ref: choice.chosen_fighter}, max_distance: 2}]
  - id: daring-strike
    name: Daring Strike
    quantity: 3
    inclusion: base
    usable_by: any
    type: versatile
    printed_value: 4
    boost: 3
    effects:
      - id: daring-strike-effect
        trigger: after_combat
        controller: owner
        cancellation: cancelable
        stages:
          - {id: won, when: {combat: {result: won}}, choices: [], costs: [], operations: [{op: DRAW, count: 2}]}
          - {id: not-won, when: {combat: {result: not_won}}, choices: [], costs: [], operations: [{op: DEAL_EFFECT_DAMAGE, target: {ref: combat.own_fighter}, amount: 1}]}
  - id: cartwheel-kick
    name: Cartwheel Kick
    quantity: 2
    inclusion: base
    usable_by: [buffy]
    type: defense
    printed_value: 2
    boost: 2
