        trigger: after_combat
        controller: owner
        cancellation: cancelable
        stages:
          - {id: move-buffy, when: always, choices: [], costs: [], operations: [{op: MOVE, target: buffy, max_distance: 3}]}
          - {id: damage-adjacent, when: always, choices: [], costs: [], operations: [{op: DEAL_EFFECT_DAMAGE, target: {selector: {kind: fighter, relation: opposing, adjacent_to: buffy}}, amount: 1}]}
  - {id: rapid-recovery, name: Rapid Recovery, quantity: 3, inclusion: base, usable_by: [buffy], type: versatile, printed_value: 3, boost: 3, effects: [{id: rapid-recovery-effect, trigger: after_combat, controller: owner, cancellation: cancelable, stages: [{id: recover, when: always, choices: [], costs: [], operations: [{op: RECOVER, target: buffy, amount: 1}]}]}]}
  - {id: regroup, name: Regroup, quantity: 3, inclusion: base, usable_by: any, type: versatile, printed_value: 1, boost: 1, effects: [{id: regroup-draw, trigger: after_combat, controller: owner, cancellation: cancelable, stages: [{id: won, when: {combat: {result: won}}, choices: [], costs: [], operations: [{op: DRAW, count: 2}]}, {id: not-won, when: {combat: {result: not_won}}, choices: [], costs: [], operations: [{op: DRAW, count: 1}]}]}]}
  - {id: mr-pointy, name: Mr. Pointy, quantity: 2, inclusion: base, usable_by: [buffy], type: attack, printed_value: 5, boost: 4, effects: []}
