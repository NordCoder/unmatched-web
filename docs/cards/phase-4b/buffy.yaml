    quantity: 3
    inclusion: base
    usable_by: [buffy]
    type: attack
    printed_value: 4
    boost: 3
    effects:
      - id: slayers-strength-effect
        trigger: after_combat
        controller: owner
        cancellation: cancelable
        stages:
          - id: choose-use-effect
            when: always
            choices:
              - {id: use-slayers-strength, owner: controller, visibility: public, optional: true, domain: [move_all_adjacent_fighters], bind: use_effect}
            costs: []
            operations: []
          - id: move-all-adjacent
            when: {choice_bound: use_effect}
            choices: []
            costs: []
            operations:
              - {op: MOVE, target: {selector: {kind: fighter, adjacent_to: buffy}}, destination_rule: another_space_in_that_fighters_zone, bind_result: moved_fighters}
          - id: damage-moved
            when: {result_exists: {ref: result.moved_fighters}}
            choices: []
            costs: []
            operations: [{op: DEAL_EFFECT_DAMAGE, target: {ref: result.moved_fighters.successfully_moved}, amount: 1}]
  - {id: feint, name: Feint, quantity: 3, inclusion: base, usable_by: any, type: versatile, printed_value: 2, boost: 2, effects: [{id: feint-cancel, trigger: immediately, controller: owner, cancellation: cancelable, stages: [{id: cancel, when: always, choices: [], costs: [], operations: [{op: CANCEL_EFFECTS, target_scope: opposing_combat_card}]}]}]}
  - {id: swift-strike, name: Swift Strike, quantity: 3, inclusion: base, usable_by: any, type: attack, printed_value: 3, boost: 2, effects: [{id: swift-strike-move, trigger: after_combat, controller: owner, cancellation: cancelable, stages: [{id: move, when: always, choices: [], costs: [], operations: [{op: MOVE, target: {ref: combat.own_fighter}, max_distance: 4}]}]}]}
