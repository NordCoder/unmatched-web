            when: always
            choices:
              - {id: choose-opponent, owner: controller, visibility: public, optional: false, domain: {kind: player, relation: opponent}, bind: chosen_opponent}
            costs: []
            operations: [{op: LOOK_AT, source: {zone: hand, owner: {ref: choice.chosen_opponent}}, viewer: controller}]
          - id: choose-discard
            when: always
            choices:
              - {id: choose-card, owner: controller, visibility: private, optional: false, domain: {zone: hand, owner: {ref: choice.chosen_opponent}}, bind: chosen_card}
            costs: []
            operations: [{op: DISCARD, from_zone: {zone: hand, owner: {ref: choice.chosen_opponent}}, selector: {ref: choice.chosen_card}, count: 1}]
  - {id: training, name: Training, quantity: 2, inclusion: choose_group, tags: [sidekick:giles], usable_by: [giles], type: scheme, printed_value: null, boost: 3, effects: [{id: training-draw, trigger: scheme, controller: owner, cancellation: cancelable, stages: [{id: draw, when: always, choices: [], costs: [], operations: [{op: DRAW, count: 3}]}]}]}
  - {id: right-hand-man, name: Right-hand Man, quantity: 2, inclusion: choose_group, tags: [sidekick:xander], usable_by: [xander], type: versatile, printed_value: 2, boost: 3, effects: [{id: right-hand-man-value, trigger: during_combat, controller: owner, cancellation: cancelable, stages: [{id: set-value, when: {relation: {adjacent: [xander, buffy]}}, choices: [], costs: [], operations: [{op: SET_VALUE, target: this_card, value: 6}]}]}]}
  - {id: military-knowledge, name: Military Knowledge, quantity: 3, inclusion: choose_group, tags: [sidekick:xander], usable_by: [xander], type: attack, printed_value: 4, boost: 3, effects: [{id: military-knowledge-draw, trigger: after_combat, controller: owner, cancellation: cancelable, stages: [{id: draw, when: always, choices: [], costs: [], operations: [{op: DRAW, count: 1}]}]}]}

