normalization_notes:
- Seven Misery definitions are external definitions and do not count toward the 30-card action deck.
- Hindsight chooses a card already in discard after a win; it does not return itself from the resolution zone.
- Guided by the Fates always recovers Pandora, even when Kakodaemon played the card.
- Forged by Hephaestus is limited to a fighter owned by the card controller; friendly allied fighters are not eligible.
- Spite damages every fighter adjacent to the Kakodaemon that played it, including friendly fighters; Spite and Malice have current BOOST 2.
- Hindsight and Celestial Raiments use physical/current spellings after cross-checking transcript variants.
- No unmatched.cards/decks fan namespace is used.