normalization_notes:
- All 11 definitions reconcile to 30 cards.
- Upgrade cards use only D-REQ-012 transitions/queries: activate_next, deactivate_next, activate_all, count_active and all_active.
- D-Day snapshots the printed all-upgrades-active condition before activate_all, then applies fixed 1 damage and fixed 1 recovery when it was true.
- Restricted free attacks use D-REQ-003; no source_defined upgrade/action/capture constructs remain.
