  - https://restorationgames.com/wp-content/uploads/2024/10/UM-W-RF-Set-Rules.pdf
  - https://www.the-unmatched.club/rules/philippa
normalization_notes:
  - Backup Plan's health branch is exact assignment, not RECOVER; set_health_exact is proposed as a generic composite in the Worker C report.
  - Do My Bidding now follows the established Phase 4A Dracula replacement-combat pattern: return the attack, inspect the resulting hand, then choose and replace inside the same combat.
  - Spymaster's Ruse requires ordered dependent choices: the chosen opponent selects the 4 cards they reveal (or all if fewer), then Philippa's controller selects exactly 2 of the revealed cards when possible, then the opponent draws 2. This uses C-EXT-013.
  - Polymorphy's move value 5 is a continuous source-lifetime modifier and must disappear when the ongoing scheme leaves play; it uses C-EXT-011 rather than permanent SET_STATE mutation.
