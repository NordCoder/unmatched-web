normalization_notes:
- All 13 unique definitions reconcile to 30 physical cards.
- Butterfly-only clauses are represented by ali_stance=float conditions; Bee's +2 attack remains fighter-level continuous state.
- Stronger Than the Skill looks at the opponent hand unconditionally; only the shuffle branch requires a combat win.
- Deck insertion followed by randomization is represented as MOVE_CARD plus explicit SHUFFLE so RNG is a first-class replay event.
- No fan-deck namespace is used.
