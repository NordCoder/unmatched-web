normalization_notes:
  - Voyage is a card-definition tag; current discard-zone membership determines both Sinbad's movement bonus and Voyage value scaling.
  - Regroup uses mutually exclusive won/not-won branches so its published "draw 2 instead" replacement is not represented as two independent draw effects.