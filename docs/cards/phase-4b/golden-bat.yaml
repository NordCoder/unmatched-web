    printed_value: null
    boost: 3
    tags: []
    effects:
      - id: alpine-scheme
        trigger: scheme
        controller: owner
        cancellation: cancelable
        stages:
          - id: choose-card
            choices: [{id: discard-card, owner: controller, visibility: public, optional: false, domain: {selector: {zone: discard, owner: self}}, bind: selected_card}]
          - id: resolve
            operations:
              - {op: MOVE_CARD, from_zone: discard, to_zone: deck, selector: {ref: selected_card}}
