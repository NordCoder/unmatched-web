    quantity: 3
    usable_by: [golden-bat]
    type: versatile
    printed_value: 2
    boost: 2
    tags: []
    effects:
      - {id: flash-during, trigger: during_combat, controller: owner, cancellation: cancelable, stages: [{id: resolve, when: {expr: {op: no_shared_zone, left: {ref: own_combat_fighter.current_space}, right: {ref: own_combat_fighter.turn_start_space}}}, operations: [{op: SET_VALUE, target: this_card, value: 4}]}]}
