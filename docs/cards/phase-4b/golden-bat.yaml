  - id: sight-beyond-sight
    name: Sight Beyond Sight
    quantity: 3
    usable_by: [golden-bat]
    type: versatile
    printed_value: 2
    boost: 1
    tags: [staged_resolution]
    effects:
      - id: sight-after
        trigger: after_combat
        controller: owner
        cancellation: cancelable
        stages:
          - id: inspect
            operations: [{op: LOOK_AT, source: opponent.deck_top, selector: {max_count: 3}, viewer: controller, bind_result: viewed_cards}]
          - id: order
            choices: [{id: order, owner: controller, visibility: private, optional: false, domain: {ref: viewed_cards}, bind: chosen_order}]
          - id: apply
            operations: [{op: REORDER, zone: opponent.deck_top, selector: {ref: viewed_cards}, order: {ref: chosen_order}}]
