  - id: skirmish
    name: Skirmish
    quantity: 2
    usable_by: [golden-bat]
    type: versatile
    printed_value: 4
    boost: 1
    tags: []
    effects:
      - id: skirmish-after
        trigger: after_combat
        controller: owner
        cancellation: cancelable
        stages:
          - id: choose
            when: {combat_result: won}
            choices: [{id: fighter, owner: controller, visibility: public, optional: false, domain: {selector: {fighters: combat_fighters}}, bind: selected_fighter}]
          - id: move
            when: {ref: selected_fighter, exists: true}
            operations: [{op: MOVE, target: {ref: selected_fighter}, max_distance: 2}]
  - {id: insight-of-the-ancients, name: Insight of the Ancients, quantity: 2, usable_by: [golden-bat], type: versatile, printed_value: 3, boost: 2, tags: [], effects: [{id: insight-after, trigger: after_combat, controller: owner, cancellation: cancelable, stages: [{id: resolve, when: {combat_result: won}, operations: [{op: MOVE_CARD, from_zone: discard, to_zone: hand, selector: random_card}]}]}]}

