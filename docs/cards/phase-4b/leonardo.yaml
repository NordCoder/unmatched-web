normalization_notes:
- Official IELLO rules establish exactly 30 Leonardo action cards; quantities reconcile 30/30.
- For Sensei moves both combat fighters up to 1 space each. The project resolves those two optional movements sequentially in an order chosen by the effect controller; this is deterministic engine normalization and is not retained as an evidence blocker.
- Adventures enemy/scenario behavior is excluded.
- Eat, Sleep, and Breathe Ninjutsu remains an explicit source-defined positioning composite; the orchestrator can decide whether it merits a generic sequential-placement primitive.
- No unmatched.cards/decks fan namespace is used.