normalization_notes:
  - Fully funded discharge tiers and the published 30-card corpus are verified.
  - "C-EXT-004 governs underfunded tiered discharge: tier 2 may be declared with 0/1 charged coils, remains tier 2, and may fizzle without tier-1 fallback."
  - "Recommended integration behavior (high confidence): discharge available charged coils up to the declared amount; therefore 1 charged + declare 2 -> 0 charged. No exact-case publisher ruling for this transition was found."
  - tiered_resource_discharge remains a proposed generic composite, not Tesla-only code.
