  - {id: tesla-intense-ruling, authority: official_ruling, url: https://www.the-unmatched.club/tools/disputes/85231bd9-8d62-41b3-ab4c-b821d63e72cc, checked_at: 2026-07-27, supports: [Intense Experimentation information order]}
validation:
  quantity: {result: pass, available_pool_count: 30, game_deck_count: 30, quantity_sum: 30}
  usable_by: pass
  references: pass
  source_coverage: qualified
  semantic_structure: pass
  integration: requires_shared_extension
  fan_content: pass
normalization_notes:
  - Coil choices use one declared amount; underfunded declaration never falls back to a lower branch.
  - Intense Experimentation resolves the printed base draw before the single discharge choice; a declared one/two-coil result then supplies the additional draw needed to reach the printed total.
  - X-Ray Radiation reveals before the discharge choice; Repulsion Blast moves the opposing fighter before that choice.
