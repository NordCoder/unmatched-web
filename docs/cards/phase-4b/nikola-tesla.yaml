        trigger: after_combat
        controller: owner
        cancellation: cancelable
        stages:
          - {id: choose-discharge, choices: [{id: coils, owner: controller, visibility: public, optional: true, domain: [1, 2], bind: declared_coils}]}
          - id: apply
            when: {ref: declared_coils, exists: true}
            operations: [{op: TRIGGER_COMPOSITE, kind: declared_resource_discharge, resource: charged-coils, declared: {ref: declared_coils}, consume_available: true, outcomes: [{when: {ref: declared_coils, equals: 1}, effects: [{op: DEAL_EFFECT_DAMAGE, target: each_opposing_fighter_in_tesla_zone, amount: 1}]}, {when: {ref: declared_coils, equals: 2}, effects: [{op: DEAL_EFFECT_DAMAGE, target: each_opposing_fighter_in_tesla_zone, amount: 2}]}]}]
  - id: polyphase-coils
    name: Polyphase Coils
    quantity: 3
    usable_by: [nikola-tesla]
    type: versatile
    printed_value: 3
    boost: 1
    tags: [coil_discharge]
    effects:
      - id: polyphase-immediately
        trigger: immediately
        controller: owner
        cancellation: cancelable
        stages:
          - {id: choose-discharge, choices: [{id: coils, owner: controller, visibility: public, optional: true, domain: [1, 2], bind: declared_coils}]}
          - id: apply
            when: {ref: declared_coils, exists: true}
            operations: [{op: TRIGGER_COMPOSITE, kind: declared_resource_discharge, resource: charged-coils, declared: {ref: declared_coils}, consume_available: true, outcomes: [{when: {ref: declared_coils, equals: 1}, effects: [{op: CANCEL_EFFECTS, target_scope: opposing_combat_card}]}, {when: {ref: declared_coils, equals: 2}, effects: [{op: CANCEL_EFFECTS, target_scope: opposing_combat_card}, {op: IGNORE_VALUE, target: opposing_combat_card}]}]}]
  - {id: remote-control, name: Remote Control, quantity: 2, usable_by: [nikola-tesla], type: scheme, printed_value: null, boost: 3, tags: [], effects: [{id: remote-scheme, trigger: scheme, controller: owner, cancellation: cancelable, stages: [{id: resolve, operations: [{op: MOVE, target: all_opposing_fighters, max_distance: 2}, {op: GAIN_ACTION, count: 1}]}]}]}
  - id: repulsion-blast
    name: Repulsion Blast
    quantity: 3
    usable_by: [nikola-tesla]
    type: versatile
    printed_value: 2
    boost: 2
    tags: [coil_discharge, staged_resolution]
    effects:
      - id: repulsion-after
        trigger: after_combat
        controller: owner
        cancellation: cancelable
        stages:
          - {id: move-opponent, operations: [{op: MOVE, target: opposing_combat_fighter, max_distance: 2}]}
          - {id: choose-discharge, choices: [{id: coils, owner: controller, visibility: public, optional: true, domain: [1, 2], bind: declared_coils}]}
          - id: apply
            when: {ref: declared_coils, exists: true}
            operations: [{op: TRIGGER_COMPOSITE, kind: declared_resource_discharge, resource: charged-coils, declared: {ref: declared_coils}, consume_available: true, outcomes: [{when: {ref: declared_coils, equals: 1}, effects: [{op: MOVE, target: nikola-tesla, max_distance: 2}]}, {when: {ref: declared_coils, equals: 2}, effects: [{op: MOVE, target: nikola-tesla, max_distance: 2}, {op: DISCARD, controller: opponent, from: hand, selector: random, count: 1}]}]}]
  - id: x-ray-radiation
    name: X-Ray Radiation
    quantity: 3
    usable_by: [nikola-tesla]
    type: versatile
    printed_value: 4
    boost: 1
    tags: [coil_discharge, staged_resolution]
    effects:
      - id: xray-during
        trigger: during_combat
        controller: owner
        cancellation: cancelable
        stages:
          - {id: reveal, operations: [{op: REVEAL, source: opponent.deck_top, selector: {count: 1}, bind_result: revealed_card}]}
          - {id: choose-discharge, choices: [{id: coils, owner: controller, visibility: public, optional: true, domain: [1, 2], bind: declared_coils}]}
          - id: apply
            when: {ref: declared_coils, exists: true}
            operations: [{op: TRIGGER_COMPOSITE, kind: declared_resource_discharge, resource: charged-coils, declared: {ref: declared_coils}, consume_available: true, outcomes: [{when: {ref: declared_coils, equals: 1}, effects: [{op: DISCARD, controller: opponent, from: deck_top, selector: {ref: revealed_card}, count: 1}]}, {when: {ref: declared_coils, equals: 2}, effects: [{op: DISCARD, controller: opponent, from: deck_top, selector: {ref: revealed_card}, count: 1}, {op: ADD_VALUE, target: this_card, amount: {ref: revealed_card.boost_or_0}}]}]}]

