schema_version: 1
fighter_id: nikola-tesla
status: partial
verification:
  evidence: qualified
  semantics: qualified
  integration: requires_shared_extension
  policy: ready
requires: [C-REQ-004, C-REQ-013]
interpretation_refs: [tesla-underfunded-two-coil-resource-transition]
construction: {kind: fixed, available_pool_count: 30, game_deck_count: 30}

cards:
  - id: seven-hertz
    name: 7 Hertz
    quantity: 3
    usable_by: [nikola-tesla]
    type: attack
    printed_value: 4
    boost: 3
    tags: [coil_discharge]
    effects:
      - id: seven-hertz-after
        trigger: after_combat
        controller: owner
        cancellation: cancelable
        stages:
          - id: choose-discharge
            choices: [{id: coils, owner: controller, visibility: public, optional: true, domain: [1, 2], bind: declared_coils}]
          - id: apply
            when: {ref: declared_coils, exists: true}
            operations:
              - op: TRIGGER_COMPOSITE
                kind: declared_resource_discharge
                resource: charged-coils
                declared: {ref: declared_coils}
                consume_available: true
                outcomes:
                  - {when: {ref: declared_coils, equals: 1}, effects: [{op: GAIN_ACTION, count: 1}]}
                  - {when: {ref: declared_coils, equals: 2}, effects: [{op: GAIN_ACTION, count: 1}, {op: DRAW, count: 1}]}
  - id: the-alternating-current
    name: The Alternating Current
    quantity: 2
    usable_by: [nikola-tesla]
    type: attack
    printed_value: 5
    boost: 3
    tags: [coil_discharge]
    effects:
      - id: alternating-current-after
        trigger: after_combat
        controller: owner
        cancellation: cancelable
        stages:
          - id: choose-mode
            choices: [{id: mode, owner: controller, visibility: public, optional: false, domain: [charge_both, discharge_both], bind: mode}]
          - {id: charge, when: {ref: mode, equals: charge_both}, operations: [{op: GAIN_RESOURCE, resource: charged-coils, amount_rule: fill_to_2}]}
          - id: discharge
            when: {ref: mode, equals: discharge_both}
            operations:
              - {op: TRIGGER_COMPOSITE, kind: declared_resource_discharge, resource: charged-coils, declared: 2, consume_available: true, dependent_requires_full_declared: true, dependent_effects: [{op: RECOVER, target: nikola-tesla, amount: 2}]}
  - id: death-ray
    name: Death Ray
    quantity: 3
    usable_by: [nikola-tesla]
    type: attack
    printed_value: 3
    boost: 4
    tags: [coil_discharge]
    effects:
      - id: death-ray-during
        trigger: during_combat
        controller: owner
        cancellation: cancelable
        stages:
          - id: choose-discharge
            choices: [{id: coils, owner: controller, visibility: public, optional: true, domain: [1, 2], bind: declared_coils}]
          - id: apply
            when: {ref: declared_coils, exists: true}
            operations:
              - {op: TRIGGER_COMPOSITE, kind: declared_resource_discharge, resource: charged-coils, declared: {ref: declared_coils}, consume_available: true, outcomes: [{when: {ref: declared_coils, equals: 1}, effects: [{op: SET_VALUE, target: this_card, value: 5}]}, {when: {ref: declared_coils, equals: 2}, effects: [{op: SET_VALUE, target: this_card, value: 7}]}]}
  - {id: fully-charged, name: Fully Charged, quantity: 2, usable_by: [nikola-tesla], type: scheme, printed_value: null, boost: 1, tags: [coil], effects: [{id: fully-charged-scheme, trigger: scheme, controller: owner, cancellation: cancelable, stages: [{id: resolve, operations: [{op: GAIN_RESOURCE, resource: charged-coils, amount_rule: fill_to_2}, {op: GAIN_ACTION, count: 1}]}]}]}
  - id: intense-experimentation
    name: Intense Experimentation
    quantity: 3
    usable_by: [nikola-tesla]
    type: defense
    printed_value: 3
    boost: 2
    tags: [coil_discharge, staged_resolution]
    effects:
      - id: intense-experimentation-after
        trigger: after_combat
        controller: owner
        cancellation: cancelable
        stages:
          - id: base-draw
            operations: [{op: DRAW, count: 1}]
          - id: choose-discharge
            choices: [{id: coils, owner: controller, visibility: public, optional: true, domain: [1, 2], bind: declared_coils}]
          - id: apply-discharge
            when: {ref: declared_coils, exists: true}
            operations:
              - op: TRIGGER_COMPOSITE
                kind: declared_resource_discharge
                resource: charged-coils
                declared: {ref: declared_coils}
                consume_available: true
                outcomes:
                  - {when: {ref: declared_coils, equals: 1}, effects: [{op: DRAW, count: 1}]}
                  - {when: {ref: declared_coils, equals: 2}, effects: [{op: DRAW, count: 2}, {op: RECOVER, target: nikola-tesla, amount: 1}]}
  - {id: kinetic-induction, name: Kinetic Induction, quantity: 3, usable_by: [nikola-tesla], type: versatile, printed_value: 2, boost: 1, tags: [coil], effects: [{id: kinetic-after, trigger: after_combat, controller: owner, cancellation: cancelable, stages: [{id: charge-one, operations: [{op: GAIN_RESOURCE, resource: charged-coils, amount: 1, cap: 2}]}, {id: charge-both-if-won, when: {combat_result: won}, operations: [{op: GAIN_RESOURCE, resource: charged-coils, amount_rule: fill_to_2}]}]}]}
  - id: lightning-storm
    name: Lightning Storm
    quantity: 3
