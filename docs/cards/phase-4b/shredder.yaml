normalization_notes:
- All 13 competitive Hero Deck definitions reconcile to 30 physical cards.
- Bebop & Rocksteady are one sidekick fighter definition; their exclusive cards therefore use the single bebop-and-rocksteady piece id.
- Back to Work targets that one combined sidekick rather than synthesizing two independent recoveries/revivals.
- Foot Soldiers remain path/edge resources rather than fighters.
- Adventures villain cards and scenario logic are excluded.