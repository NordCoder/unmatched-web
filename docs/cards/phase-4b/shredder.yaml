normalization_notes:
- All 13 competitive Hero Deck definitions reconcile to 30 cards.
- Gruff Escort uses explicit path choices and resource transitions under D-REQ-007; dormant Foot Soldiers are excluded from adjacency counts but remain deployed for Perplexing Tactics.
- All According to Plan creates a persisted cross-player obligation under D-REQ-015.
- Disrupting Strike uses generic locked SET_VALUE; Back to Work preserves closest-to-Shredder placement in both undefeated and defeated branches.
- No Adventures villain/scenario behavior or source_defined constructs remain.
