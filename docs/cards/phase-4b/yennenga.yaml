schema_version: 1
fighter_id: yennenga
status: blocked
construction: {kind: fixed, available_pool_count: 30, game_deck_count: 30}

cards:
  - {id: rain-of-arrows, name: Rain of Arrows, quantity: 3, usable_by: [yennenga], type: attack, printed_value: 3, boost: 3, effects: [{trigger: after_combat, operations: [{op: TRIGGER_COMPOSITE, definition: volley, value: 3}]}]}
  - id: surprise-volley
    name: Surprise Volley
    quantity: 3
    usable_by: [yennenga]
    type: attack
    printed_value: 3
    boost: 3
    effects:
      - trigger: immediately
        operations:
          - {op: REQUEST_CHOICE, definition: surprise_volley_resolution}
  - id: shield-formation
    name: Shield Formation
    quantity: 2
    usable_by: [yennenga]
    type: defense
    printed_value: 3
    boost: 3
    effects:
      - trigger: immediately
        operations:
          - {op: REQUEST_CHOICE, definition: shield_formation_resolution}
  - {id: master-of-the-hunt, name: Master of the Hunt, quantity: 2, usable_by: [yennenga], type: scheme, printed_value: null, boost: 3, effects: [{trigger: scheme, operations: [{op: GAIN_ACTION, count: 2}]}]}
  - {id: one-with-the-land, name: One With the Land, quantity: 2, usable_by: [yennenga], type: scheme, printed_value: null, boost: 2, effects: [{trigger: scheme, operations: [{op: MOVE, target: each_friendly_fighter, max_distance: 2}, {op: RECOVER, target: each_friendly_fighter, amount: 1}, {op: DRAW, count: 1}]}]}
  - {id: stallion-charge, name: Stallion Charge, quantity: 3, usable_by: [yennenga], type: versatile, printed_value: 3, boost: 3, effects: [{trigger: after_combat, operations: [{op: MOVE, target: yennenga, max_distance: 5, overrides: [may_move_through_opposing_fighters]}]}], normalization_blocker: deal_1_to_each_opposing_fighter_yennenga_moved_through_requires_path_capture}
  - {id: jaws-of-the-beast, name: Jaws of the Beast, quantity: 3, usable_by: [yennenga], type: versatile, printed_value: 3, boost: 3, effects: [{trigger: during_combat, operations: [{op: ADD_VALUE, target: this_card, amount: count_zones_opposing_combat_fighter_is_in}]}]}
  - {id: point-blank, name: Point Blank, quantity: 3, usable_by: [yennenga], type: versatile, printed_value: 2, boost: 2, effects: [{trigger: after_combat, condition: {opposing_combat_fighter_adjacent_to_yennenga: true}, operations: [{op: DEAL_EFFECT_DAMAGE, target: opposing_combat_fighter, amount: 2}]}]}
  - {id: momentous-shift, name: Momentous Shift, quantity: 3, usable_by: any, type: versatile, printed_value: 3, boost: 2, effects: [{trigger: during_combat, condition: {fighter_started_turn_in_different_space: true}, operations: [{op: SET_VALUE, target: this_card, value: 5}]}]}
  - {id: divide-and-conquer, name: Divide and Conquer, quantity: 2, usable_by: any, type: versatile, printed_value: 2, boost: 1, effects: [{trigger: during_combat, condition: {own_combat_fighter_not_in_yennenga_zone: true}, operations: [{op: SET_VALUE, target: this_card, value: 4}]}]}
  - {id: pin-the-prey, name: Pin the Prey, quantity: 2, usable_by: any, type: versatile, printed_value: 1, boost: 2, effects: [{trigger: after_combat, operations: [{op: MOVE, target: opposing_combat_fighter, max_distance: 4, controller: owner}, {op: DISCARD, from: combat_opponent_hand, selector: combat_opponent_choice, count: 1}]}]}
  - {id: skirmish, name: Skirmish, quantity: 2, usable_by: any, type: versatile, printed_value: 4, boost: 2, effects: [{trigger: after_combat, condition: {combat_result: won}, choices: [{choose: fighter_in_combat}], operations: [{op: MOVE, target: chosen_fighter, max_distance: 2}]}]}

external_definitions:
  - {id: volley, kind: bonus_attack, semantics: same_attacker_targets_same_defender_with_fixed_source_value_without_spending_action, skip_if_attacker_or_defender_defeated_during_parent_attack: true, cancellation_of_parent_after_combat_effect_prevents_volley: true}
  - id: surprise_volley_resolution
    kind: sequential_choice_dependency
    if_defeated_archer_available:
      choice: {controller: owner, optional: true, choose: defeated_archer, bind: chosen_archer}
      if_chosen:
        operations:
          - {op: RETURN_FIGHTER, target: chosen_archer, destination: any_space_in_opposing_combat_fighter_zone, health_rule: source_defined_full_sidekick_health}
          - {op: CHANGE_STATE, key: combat.attacker, value: chosen_archer}
      if_declined: {op: GAIN_ACTION, count: 1}
    if_no_defeated_archer: {op: GAIN_ACTION, count: 1}
  - id: shield_formation_resolution
    kind: sequential_choice_dependency
    steps:
      - {controller: combat_opponent, optional: true, choose: one_card_from_own_hand_to_discard, bind: discarded_card}
      - if_no_card_discarded:
          choice: {controller: owner, choose: defeated_archer_if_any, bind: chosen_archer}
          operation_if_chosen: {op: RETURN_FIGHTER, target: chosen_archer, destination: any_space_in_yennenga_zone, health_rule: source_defined_full_sidekick_health}
  - {id: movement-path-capture, kind: proposed_generic_selector, affected_card: stallion-charge, semantics: collect_fighters_whose_spaces_were_traversed_during_this_specific_move_then_apply_post_move_effect_once_each}
validation: {available_pool_count: 30, game_deck_count: 30, quantity_sum: 30, unique_card_definitions: 12}
sources:
  - https://unmatched.cards/umdb/decks/yennenga
  - https://restorationgames.com/wp-content/uploads/2021/11/UM-Battle_of_Legends_vol2_Rules-two-page.pdf
  - https://how-to-play.s3.us-east-2.amazonaws.com/295564/rules/295564_rules.pdf
  - https://docs.google.com/document/d/13b-FbPq_vuqcc3IokeHvQ2ctJaDNZZuUaZmt4uft5h0/
normalization_notes:
  - VOLLEY is represented as a reusable composite bonus attack, not a new Attack action.
  - Current ruling prevents the bonus attack if either the attacker or defender was defeated during the parent attack.
  - Surprise Volley is an IMMEDIATELY combat-participant replacement, not a VOLLEY bonus attack. If no Archer is returned, gaining 1 action is mandatory.
  - Shield Formation is IMMEDIATELY. The combat opponent may discard one card; only if they do not discard does Yennenga's owner attempt to return a defeated Archer.
  - Pin the Prey discards from the current combat opponent, not an arbitrary opponent in multiplayer.
  - Stallion Charge remains blocked because the current shared model cannot select fighters crossed by a specific movement path.