schema_version: 1
fighter_id: hamlet
status: partial
verification:
  evidence: qualified
  semantics: qualified
  integration: requires_shared_extension
  policy: not_applicable
requires: [C-REQ-013]
construction: {kind: fixed, available_pool_count: 30, game_deck_count: 30}

cards:
  - id: to-sleep-perchance-to-dream
    name: "To Sleep, Perchance To Dream"
    quantity: 3
    usable_by: any
    type: attack
    printed_value: 3
    boost: 2
    tags: []
    effects:
      - id: sleep-after
        trigger: after_combat
        controller: owner
        cancellation: cancelable
        stages:
          - {id: won, when: {combat_result: won}, operations: [{op: MOVE, target: opposing_combat_fighter, max_distance: {ref: combat.damage_dealt_to_opposing_fighter}}]}
          - {id: lost, when: {combat_result: lost}, operations: [{op: RECOVER, target: hamlet, amount: 1}]}
  - id: cruel-to-be-kind
    name: Cruel To Be Kind
    quantity: 2
    usable_by: [hamlet]
    type: attack
    printed_value: 2
    boost: 4
    tags: []
    effects:
      - id: cruel-during
        trigger: during_combat
        controller: owner
        cancellation: cancelable
        stages:
          - id: optional-boost
            choices: [{id: boost-card, owner: controller, visibility: private, optional: true, domain: {selector: {zone: hand, owner: self}}, bind: boost_card}]
          - {id: boost, when: {ref: boost_card, exists: true}, operations: [{op: BOOST, target: this_card, source: {ref: boost_card}, count: 1}]}
  - {id: uncertain-doom, name: Uncertain Doom, quantity: 3, usable_by: any, type: attack, printed_value: 2, boost: 3, tags: [], effects: [{id: doom-during, trigger: during_combat, controller: owner, cancellation: cancelable, stages: [{id: resolve, when: {opposing_card_type: versatile}, operations: [{op: IGNORE_VALUE, target: opposing_combat_card}]}]}]}
  - id: the-plays-the-thing
    name: "The Play's The Thing"
    quantity: 3
    usable_by: any
    type: versatile
    printed_value: 3
    boost: 2
    tags: [staged_resolution]
    effects:
      - id: plays-after
        trigger: after_combat
        controller: owner
        cancellation: cancelable
        stages:
          - id: discard
            operations: [{op: DISCARD, controller: opponent, from: hand, selector: random, count: 1, bind_result: discarded_card}]
          - id: recover
            when: {combat_result: won}
            operations: [{op: RECOVER, target: hamlet, amount: {ref: discarded_card.boost_or_0}}]
  - id: the-readiness-is-all
    name: The Readiness Is All
    quantity: 2
    usable_by: any
    type: versatile
    printed_value: 2
    boost: 2
    tags: [placement_dependency, evidence_qualified]
    effects:
      - id: readiness-after
        trigger: after_combat
        controller: owner
        cancellation: cancelable
        stages:
          - id: choose-fighter
            choices: [{id: fighter, owner: controller, visibility: public, optional: false, domain: {selector: {fighters: combat_fighters}}, bind: readiness_fighter}]
          - id: choose-space
            choices: [{id: space, owner: controller, visibility: public, optional: false, domain: {selector: {spaces: any}}, bind: readiness_space}]
          - id: place
            operations: [{op: PLACE, target: {ref: readiness_fighter}, destination: {ref: readiness_space}, bind_result: readiness_placement}]
          - id: restrict
            when: {ref: readiness_placement.succeeded, equals: true}
            operations: [{op: SET_STATE, target: {ref: readiness_fighter}, key: cannot_leave_current_space, value: true, expires: turn_end}]
  - {id: blood-will-have-blood, name: Blood Will Have Blood, quantity: 3, usable_by: [hamlet], type: versatile, printed_value: 2, boost: 1, tags: [], effects: [{id: blood-after, trigger: after_combat, controller: owner, cancellation: cancelable, stages: [{id: resolve, when: {hamlet_took_damage_this_turn: true}, operations: [{op: DEAL_EFFECT_DAMAGE, target: opposing_combat_fighter, amount: 1}]}]}]}
  - id: outrageous-fortune
    name: Outrageous Fortune
    quantity: 2
    usable_by: [hamlet]
    type: versatile
    printed_value: 1
    boost: 2
    tags: [combat_context]
    effects:
      - id: fortune-during
        trigger: during_combat
        controller: owner
        cancellation: cancelable
        stages:
          - id: discard
            operations: [{op: DISCARD, controller: controller, from: deck_top, selector: top, count: 1, bind_result: outrageous_discarded_card, bind_scope: current_combat}]
          - id: add-value
            operations: [{op: ADD_VALUE, target: this_card, amount: {ref: outrageous_discarded_card.boost_or_0}}]
      - id: fortune-after
        trigger: after_combat
        controller: owner
        cancellation: cancelable
        stages:
          - id: return
            when: {combat_result: lost}
            operations: [{op: MOVE_CARD, from_zone: discard, to_zone: hand, selector: {ref: outrageous_discarded_card}}]
  - id: maddening-insight
    name: Maddening Insight
    quantity: 2
    usable_by: any
    type: defense
    printed_value: 0
    boost: 1
    tags: []
    effects:
      - {id: insight-during, trigger: during_combat, controller: owner, cancellation: cancelable, stages: [{id: set-value, operations: [{op: SET_VALUE, target: this_card, value: {ref: controller.hand_size}}]}]}
      - {id: insight-after, trigger: after_combat, controller: owner, cancellation: cancelable, stages: [{id: discard, when: {combat_result: won}, operations: [{op: DISCARD, controller: opponent, from: hand, selector: chosen_by_opponent, count: 1, partial_resolution: true}]}]}
  - {id: the-rest-is-silence, name: The Rest Is Silence, quantity: 2, usable_by: [hamlet], type: defense, printed_value: 2, boost: 3, tags: [], effects: [{id: silence-after, trigger: after_combat, controller: owner, cancellation: cancelable, stages: [{id: resolve, operations: [{op: END_TURN}]}]}]}
  - {id: nothing-either-good-or-bad, name: Nothing Either Good Or Bad, quantity: 3, usable_by: any, type: defense, printed_value: 2, boost: 1, tags: [], effects: [{id: nothing-after, trigger: after_combat, controller: owner, cancellation: cancelable, stages: [{id: resolve, when: {opposing_card_type: versatile}, operations: [{op: DEAL_EFFECT_DAMAGE, target: opposing_combat_fighter, amount: 2}]}]}]}
  - id: method-in-the-madness
    name: Method In The Madness
    quantity: 3
    usable_by: [hamlet]
    type: scheme
    printed_value: null
    boost: 3
    tags: [staged_resolution]
    effects:
      - id: method-scheme
        trigger: scheme
        controller: owner
        cancellation: cancelable
        stages:
          - id: choose-bottom
            choices:
              - {id: cards, owner: controller, visibility: private, optional: false, domain: {selector: {zone: hand, owner: self}, cardinality: any}, bind: bottomed_cards}
          - id: bottom
            operations: [{op: MOVE_CARD, from_zone: hand, to_zone: deck_bottom, selector: {ref: bottomed_cards}}]
          - id: choose-draw-count
            choices:
              - {id: draw-count, owner: controller, visibility: private, optional: false, domain: {integer: {min: 0, max: {expr: {op: count, value: {ref: bottomed_cards}}}}}, bind: draw_count}
          - id: draw-and-action
            operations: [{op: DRAW, count: {ref: draw_count}}, {op: GAIN_ACTION, count: 1}]
  - id: the-ghost
    name: The Ghost
    quantity: 2
    usable_by: [hamlet]
    type: scheme
    printed_value: null
    boost: 1
    tags: []
    effects:
      - id: ghost-scheme
        trigger: scheme
        controller: owner
        cancellation: cancelable
        stages:
          - id: choose-mode
            choices: [{id: mode, owner: controller, visibility: public, optional: false, domain: [recover, place_and_action], bind: mode}]
          - {id: recover, when: {ref: mode, equals: recover}, operations: [{op: RECOVER, target: hamlet, amount: 2}]}
          - {id: place, when: {ref: mode, equals: place_and_action}, operations: [{op: PLACE, target: hamlet, destination: any_space_in_hamlet_zone}, {op: GAIN_ACTION, count: 1}]}

interpretations:
  - id: hamlet-readiness-failed-placement
    affects: [hamlet, the-readiness-is-all]
    status: project_normalization
    confidence: medium-high
    behavior: The cannot-leave restriction depends on a successful PLACE into the selected destination. If placement legally targets an occupied space and fails, the fighter stays in its prior space and no cannot-leave restriction is attached to that prior space.
    source_refs: [hamlet-deck-index, placement-rule-changes, worker-c-normalization-hamlet]
    replacement_condition: Replace if an exact publisher/designer ruling explicitly states that the restriction attaches after failed placement or defines another dependency.

external_definitions: []
sources:
  - {id: slings-rules-hamlet, authority: official_set_rules, url: https://restorationgames.com/wp-content/uploads/2024/03/UM-SaA-Set-Rules.pdf, checked_at: 2026-07-27, supports: [Hamlet fighter and set rules]}
  - {id: hamlet-deck-index, authority: published_deck_index, url: https://unmatched.cards/umdb/decks/hamlet, checked_at: 2026-07-27, supports: [published card metadata and effects]}
  - {id: placement-rule-changes, authority: official_ruling, url: https://www.the-unmatched.club/rules/rule-changes, checked_at: 2026-07-27, supports: [legal occupied-space selection and failed placement semantics]}
  - {id: worker-c-normalization-hamlet, authority: project_normalization, url: https://github.com/NordCoder/unmatched-web/blob/phase-4b-worker-c-modern/docs/phase-4b/worker-c-report.md, checked_at: 2026-07-27, supports: [selected failed-placement dependency]}
validation:
  quantity: {result: pass, available_pool_count: 30, game_deck_count: 30, quantity_sum: 30}
  usable_by: pass
  references: pass
  source_coverage: qualified
  semantic_structure: pass
  integration: requires_shared_extension
  fan_content: pass
normalization_notes:
  - The Readiness Is All uses PLACE.bind_result and a later stage rather than an implicit continuation.
  - Outrageous Fortune binds the discarded card in current-combat context for its After Combat return.
