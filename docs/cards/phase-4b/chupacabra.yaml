normalization_notes:
- All 11 definitions reconcile to 30 cards.
- Tooth and Tail uses explicit choose-distinct and operation-result bindings under D-REQ-001.
- Natural Toughness returns during the printed AFTER COMBAT window when Chupacabra lost the combat.
- Unsettle is staged so the target player and amplification choice are bound before discard count resolves.
