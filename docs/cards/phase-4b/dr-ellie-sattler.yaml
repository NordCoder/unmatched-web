external_definitions:
  - id: return_all_insight_tokens_to_supply
    kind: battlefield_token_transition
    semantics: Move every Insight token instance currently on the battlefield back to the finite Insight supply.
    normalization_blocker: B-EXT-006
  - id: place_one_insight_from_supply_at_chosen_space
    kind: battlefield_token_transition
    semantics: If at least one Insight token remains in supply, move one concrete token instance from supply to the chosen battlefield space.
    normalization_blocker: B-EXT-006
  - id: place_one_insight_from_supply_at_malcolm_space_if_available
    kind: battlefield_token_transition
    semantics: If at least one Insight token remains in supply, move one concrete token instance from supply to Dr. Ian Malcolm's current space.
    normalization_blocker: B-EXT-006

validation:
  available_pool_count: 30
  game_deck_count: 30
  quantity_sum: 30
  unique_card_definitions: 14
  quantity_reconciles: true

sources:
  - https://unmatched.cards/umdb/decks/dr-ellie-sattler
  - https://unmatched.cards/umdb/decks/stats
  - https://restorationgames.com/shop/jurassic-park-dr-sattler-vs-t-rex/
  - https://www.the-unmatched.club/heroes/dr-ellie-sattler

normalization_notes:
  - The complete 14-definition deck reconciles to 30. Current UmDb deck statistics independently match the recovered card-type distribution: 3 attack cards, 21 versatile cards, 5 defense cards, and 1 scheme card by physical quantity.
  - Lock the Doors! is defense, not versatile; its two copies plus three copies of The Concept of Attraction reconcile the published five-defense-card total.
  - Insight removal returns tokens to the public insight supply; DISCARD from an empty opponent deck is not a DRAW and does not itself cause exhaustion.
  - Community /decks/ translations, reskins, and balance patches were excluded from evidence.
  - Audit correction: the manifest no longer references an undeclared insight_token_locations state that the fighter manifest intentionally removed. Token transitions are explicit blocked composites tied to B-EXT-006.

blockers:
  - id: semantic-extension-battlefield-token-instance-positions
    reason: Card effects must count, select, place and return physical Insight token instances, including multiple tokens in one space. This is the same B-EXT-006 blocker recorded by the fighter manifest.
