normalization_notes:
  - The 12-definition quantity index reconciles to 30. Current UmDb type statistics reconcile to 11 physical attack cards, 14 versatile cards, 3 defense cards, and 2 scheme cards.
  - Feint is versatile in Bullseye's deck; Tactical Retreat is the single defense definition.
  - A secondary strategy article incorrectly reports four Arrogant But Effective copies. Current component imagery visibly marks the published card x3, and the 30-card quantity reconciliation agrees.
  - Arrogant But Effective changes the combat winner at its after-combat timing and then moves Bullseye up to 2 spaces; the movement is not omitted from normalization.
  - Ricochet's type, value, quantity, and effect are independently cross-checked; only its BOOST value remains intentionally unfilled.
  - No community /decks/ record was used.

blockers:
  - id: ricochet-boost-evidence-gap
    reason: One printed field remains unverified: Ricochet's BOOST value. It is intentionally null rather than inferred from fan copies or secondary aggregate assumptions.