normalization_notes:
- Published fixed deck size is 20. RESURRECTED clauses are gated by fighter persistent state.
- Audit correction: The Fist's self-damage is an explicit cost for its return-to-hand and gain-action consequence, preserving the printed "if you do" dependency.
- Audit correction: Hands of Red, Snakeroot Clan and Mesmerize now bind fighter/opponent/card choices explicitly; Snakeroot changes the defender only if the swap succeeds.
