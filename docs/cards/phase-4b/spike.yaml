schema_version: 1
reconciliation_contract: phase-4b-v1
fighter_id: spike
status: partial
verification: {evidence: verified, semantics: verified, integration: requires_shared_extension, policy: not_applicable}
requires: [A-REQ-003, A-REQ-007]
construction: {kind: fixed, available_pool_count: 30, game_deck_count: 30}

cards:
  - id: arrogance
    name: Arrogance
    quantity: 1
    usable_by: [spike]
    type: attack
    printed_value: 4
    boost: 2
    effects:
      - id: arrogance-effect
        trigger: during_combat
        controller: owner
        cancellation: cancelable
        stages:
          - id: discard-entire-hand-for-value
            when: always
            choices:
              - {id: use-arrogance, owner: controller, visibility: private, optional: true, domain: [discard_entire_hand], bind: use_arrogance}
            costs:
              - {op: DISCARD, from_zone: hand, selector: {kind: all}, when: {choice_bound: use_arrogance}}
            operations:
              - {op: SET_VALUE, target: this_card, value: 6, when: {choice_bound: use_arrogance}}
  - {id: the-rush, name: The Rush, quantity: 2, usable_by: [spike], type: attack, printed_value: 3, boost: 3, requires: [A-REQ-003], effects: [{id: rush-value, trigger: during_combat, controller: owner, cancellation: cancelable, requires: [A-REQ-003], stages: [{id: set-value, when: {any: [{position: {fighter: spike, on_component_type: shadow}}, {position: {fighter: {ref: combat.opposing_fighter}, on_component_type: shadow}}]}, choices: [], costs: [], operations: [{op: SET_VALUE, target: this_card, value: 5}]}]}]}
  - id: leap-away
    name: Leap Away
    quantity: 2
    usable_by: any
    type: versatile
    printed_value: 4
    boost: 1
    effects:
      - id: leap-away-move
        trigger: after_combat
        controller: owner
        cancellation: cancelable
        stages:
          - id: choose-fighter
            when: {combat: {result: won}}
            choices:
              - {id: choose-combat-fighter, owner: controller, visibility: public, optional: false, domain: {kind: fighter, relation: in_current_combat}, bind: chosen_fighter}
            costs: []
            operations: [{op: MOVE, target: {ref: choice.chosen_fighter}, max_distance: 4}]
  - id: skirmish
    name: Skirmish
    quantity: 2
    usable_by: any
    type: versatile
    printed_value: 4
    boost: 1
    effects:
      - id: skirmish-move
        trigger: after_combat
        controller: owner
        cancellation: cancelable
        stages:
          - id: choose-fighter
            when: {combat: {result: won}}
            choices:
              - {id: choose-combat-fighter, owner: controller, visibility: public, optional: false, domain: {kind: fighter, relation: in_current_combat}, bind: chosen_fighter}
            costs: []
            operations: [{op: MOVE, target: {ref: choice.chosen_fighter}, max_distance: 2}]
  - id: lets-dance
    name: Let's Dance
    quantity: 3
    usable_by: [spike]
    type: versatile
    printed_value: 4
    boost: 3
    requires: [A-REQ-003]
    effects:
      - id: lets-dance-boost
        trigger: during_combat
        controller: owner
        cancellation: cancelable
        requires: [A-REQ-003]
        stages:
          - id: choose-boost
            when: {any: [{position: {fighter: spike, on_component_type: shadow}}, {position: {fighter: {ref: combat.opposing_fighter}, on_component_type: shadow}}]}
            choices:
              - {id: choose-boost-card, owner: controller, visibility: private, optional: true, domain: {zone: hand, owner: self}, bind: boost_card}
            costs: []
            operations: [{op: BOOST, target: this_card, source: {ref: choice.boost_card}}]
  - id: bloody-hell
    name: Bloody Hell!
    quantity: 3
    usable_by: [spike]
    type: versatile
    printed_value: 3
    boost: 2
    requires: [A-REQ-003]
    effects:
      - id: bloody-hell-effect
        trigger: after_combat
        controller: owner
        cancellation: cancelable
        requires: [A-REQ-003]
        stages:
          - {id: first-damage, when: always, choices: [], costs: [], operations: [{op: DEAL_EFFECT_DAMAGE, target: {ref: combat.opposing_fighter}, amount: 1}]}
          - id: shadow-damage
            when: always
            choices: []
            costs: []
            operations:
              - op: DEAL_EFFECT_DAMAGE
                target: {ref: combat.opposing_fighter}
                amount:
                  expr: count
                  selector: {kind: component, type: shadow, adjacent_to: {ref: combat.opposing_fighter}}
  - id: empathy
    name: Empathy
    quantity: 2
    usable_by: [drusilla]
    type: versatile
    printed_value: 3
    boost: 3
    requires: [A-REQ-003]
    effects:
      - id: empathy-draw
        trigger: after_combat
        controller: owner
        cancellation: cancelable
        stages:
          - {id: on-shadow, when: {position: {fighter: {ref: combat.opposing_fighter}, on_component_type: shadow}}, choices: [], costs: [], operations: [{op: DRAW, count: 3}]}
          - {id: not-on-shadow, when: {not: {position: {fighter: {ref: combat.opposing_fighter}, on_component_type: shadow}}}, choices: [], costs: [], operations: [{op: DRAW, count: 1}]}
  - {id: feint, name: Feint, quantity: 3, usable_by: any, type: versatile, printed_value: 2, boost: 2, effects: [{id: feint-cancel, trigger: immediately, controller: owner, cancellation: cancelable, stages: [{id: cancel, when: always, choices: [], costs: [], operations: [{op: CANCEL_EFFECTS, target_scope: opposing_combat_card}]}]}]}
  - id: always-surprising
    name: Always Surprising
    quantity: 3
    usable_by: [drusilla]
    type: versatile
    printed_value: 1
    boost: 2
    requires: [A-REQ-003, A-REQ-007]
    effects:
      - id: always-surprising-boost
        trigger: during_combat
        controller: owner
        cancellation: cancelable
        requires: [A-REQ-007]
        stages:
          - id: blind-boost
            when: always
            choices: []
            costs: []
            operations:
              - op: BOOST
                target: this_card
                source: {zone: deck, position: top}
                blind: true
                resolved_amount_transform:
                  when: {position: {fighter: drusilla, on_component_type: shadow}}
                  expr: {multiply: [2, {ref: boost.resolved_amount}]}
                  requires: A-REQ-007
  - {id: regroup, name: Regroup, quantity: 3, usable_by: any, type: versatile, printed_value: 1, boost: 1, effects: [{id: regroup-draw, trigger: after_combat, controller: owner, cancellation: cancelable, stages: [{id: won, when: {combat: {result: won}}, choices: [], costs: [], operations: [{op: DRAW, count: 2}]}, {id: not-won, when: {combat: {result: not_won}}, choices: [], costs: [], operations: [{op: DRAW, count: 1}]}]}]}
  - id: the-sight
    name: The Sight
    quantity: 2
    usable_by: [drusilla]
    type: scheme
    printed_value: null
    boost: 2
    requires: [A-REQ-003]
    effects:
      - id: the-sight-effect
        trigger: scheme
        controller: owner
        cancellation: cancelable
        stages:
          - id: choose-opponent
            when: always
            choices:
              - {id: choose-opponent, owner: controller, visibility: public, optional: false, domain: {kind: player, relation: opponent}, bind: chosen_opponent}
            costs: []
            operations: [{op: LOOK_AT, source: {zone: hand, owner: {ref: choice.chosen_opponent}}, viewer: controller}]
          - id: choose-discards
            when: always
            choices:
              - id: choose-cards
                owner: controller
                visibility: private
                optional: false
                domain: {zone: hand, owner: {ref: choice.chosen_opponent}}
                bind: discarded_cards
                min: {expr: if, condition: {selector_nonempty: {kind: fighter, relation: opposing, on_component_type: shadow}}, then: 2, else: 1}
                max: {expr: if, condition: {selector_nonempty: {kind: fighter, relation: opposing, on_component_type: shadow}}, then: 2, else: 1}
                distinct: true
                order_matters: false
            costs: []
            operations: [{op: DISCARD, from_zone: {zone: hand, owner: {ref: choice.chosen_opponent}}, selector: {ref: choice.discarded_cards}}]
  - id: seek-the-shadows
    name: Seek the Shadows
    quantity: 4
    usable_by: [spike]
    type: scheme
    printed_value: null
    boost: 2
    requires: [A-REQ-003]
    effects:
      - id: seek-the-shadows-effect
        trigger: scheme
        controller: owner
        cancellation: cancelable
        requires: [A-REQ-003]
        stages:
          - {id: draw, when: always, choices: [], costs: [], operations: [{op: DRAW, count: 2}]}
          - id: choose-shadow-placements
            when: {component_pool_available: shadows}
            choices:
              - {id: choose-shadow-spaces, owner: controller, visibility: public, optional: false, domain: {kind: space, in: [spike_space, spaces_adjacent_to_spike], legal_for_component: shadow}, bind: shadow_spaces, min: all_available_components, max: all_available_components, distinct: true, order_matters: false}
            costs: []
            operations: [{op: PLACE_COMPONENTS, component_pool: shadows, destinations: {ref: choice.shadow_spaces}, requires: A-REQ-003}]

