        cancellation: cancelable
        stages:
          - {id: draw, when: always, choices: [], costs: [], operations: [{op: DRAW, count: 3, bind: draw_result}]}
          - id: choose-card
            when: {result: draw_result, completed: true}
            choices:
              - {id: topdeck_card, owner: controller, visibility: private, optional: false, domain: {kind: card, zone: own_hand_after_previous_stage, count: 1}, bind: topdeck_card}
