        controller: controller
        cancellation: cancelable
        stages:
          - id: choose-opponent
            when: {requirement: B-REQ-004, source_card: this_card}
            choices:
              - {id: chosen_opponent, owner: controller, visibility: public, optional: false, domain: {kind: player, selector: opponent}, bind: chosen_opponent}
            costs: []
            operations: []
          - {id: inspect, when: {bound: chosen_opponent, exists: true}, choices: [], costs: [], operations: [{op: LOOK_AT, source: {player: {bound: chosen_opponent}, zone: hand}, selector: all, viewer: controller, bind: viewed_hand}]}
          - id: choose-discard
            when: {result: viewed_hand, count_gte: 1}
            choices:
              - {id: discard_card, owner: controller, visibility: private, optional: false, domain: {kind: card, from_result: viewed_hand, count: 1}, bind: discard_card}
            costs: []
            operations: []
          - {id: discard, when: {bound: discard_card, exists: true}, choices: [], costs: [], operations: [{op: DISCARD, controller: {bound: chosen_opponent}, from_zone: hand, selector: {bound: discard_card}, count: 1}]}
