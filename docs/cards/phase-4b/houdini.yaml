schema_version: 1
fighter_id: houdini
status: blocked

construction:
  kind: fixed
  available_pool_count: 30
  game_deck_count: 30

cards:
  - id: a-magician-never-reveals-his-secrets
    name: A Magician Never Reveals His Secrets
    quantity: 1
    inclusion: fixed
    usable_by: [houdini]
    type: scheme
    printed_value: null
    boost: 4
    tags: []
    effects:
      - trigger: scheme
        operations:
          - {op: DRAW, count: 2}
          - {op: GAIN_ACTION, count: 1}
      - trigger: opponent_would_look_at_hand
        optional: true
        operations:
          - {op: REVEAL, source: hand, selector: this_card}
          - {op: PREVENT_OPERATION, target_operation: {op: LOOK_AT, source: own_hand, scope: current_effect}}

  - id: all-part-of-the-show
    name: All Part of the Show
    quantity: 2
    inclusion: fixed
    usable_by: any
    type: defense
    printed_value: 2
    boost: 2
    tags: [boosted-with]
    cancellation: protected
    effects:
      - trigger: after_combat
        condition: {own_combat_fighter_would_be_defeated: true}
        operations: [{op: RETURN_FIGHTER, target: own_combat_fighter, destination: any_space, health_rule: set_to_4}]
      - trigger: card_used_as_boost_source
        condition: {source_card: this_card}
        operations: [{op: RECOVER, target: houdini, amount: 2}]
        normalization_blocker: Requires the proposed generic BOOST-source event.

  - id: an-illusion-of-my-own-design
    name: An Illusion of My Own Design
    quantity: 2
    inclusion: fixed
    usable_by: [houdini]
    type: attack
    printed_value: 4
    boost: 1
    tags: []
    effects:
      - trigger: immediately
        controller: opponent
        optional: true
        operations: [{op: BOOST, target: opposing_combat_card, source: opponent_hand, count: 1}]
      - trigger: during_combat
        optional: true
        operations: [{op: BOOST, target: this_card, source: hand, count: 1}]

  - id: and-the-beautiful-bess
    name: And the Beautiful Bess!
    quantity: 2
    inclusion: fixed
    usable_by: [bess]
    type: versatile
    printed_value: 3
    boost: 1
    tags: [boosted-with]
    effects:
      - trigger: card_discarded_from_hand
        condition:
          all:
            - {source_card: this_card}
            - {discard_cause: opponent_effect}
        operations: [{op: DRAW, count: 1}]
        normalization_blocker: Requires a generic discard event carrying cause/source attribution so an effect can distinguish an opponent-caused discard from costs, cleanup, random self-discard, or other causes.
      - trigger: card_used_as_boost_source
        condition:
          all:
            - {source_card: this_card}
            - {active_player: controller}
        operations: [{op: GAIN_ACTION, count: 1}]
        normalization_blocker: Requires the proposed generic BOOST-source event.

  - id: flourish
    name: Flourish
    quantity: 4
    inclusion: fixed
    usable_by: any
    type: attack
    printed_value: 3
    boost: 2
    tags: [boosted-with]
    effects:
      - trigger: during_combat
        optional: true
        operations: [{op: BOOST, target: this_card, source: hand, count: 1}]
      - trigger: card_used_as_boost_source
        condition: {source_card: this_card}
        operations: [{op: DRAW, count: 1}]
        normalization_blocker: Requires the proposed generic BOOST-source event.

  - id: for-my-next-trick
    name: For My Next Trick
    quantity: 2
    inclusion: fixed
    usable_by: any
    type: attack
    printed_value: 2
    boost: 2
    tags: []
    effects:
      - trigger: after_combat
        choices: [{owner: controller, choose: friendly_fighter}]
        operations:
          - {op: MOVE, target: chosen_fighter, max_distance: 1}
          - {op: DRAW, count: 1}
          - {op: GAIN_ACTION, count: 1}

  - id: grand-escape
    name: Grand Escape
    quantity: 3
    inclusion: fixed
    usable_by: [houdini]
    type: defense
    printed_value: 2
    boost: 3
    tags: []
    effects:
      - trigger: during_combat
        optional: true
        operations: [{op: BOOST, target: this_card, source: hand, count: 1}]
      - trigger: after_combat
        condition: {combat_result: won}
        operations: [{op: PLACE, target: own_combat_fighter, destination: any_space}]

  - id: misdirection
    name: Misdirection
    quantity: 3
    inclusion: fixed
    usable_by: any
    type: versatile
    printed_value: 2
    boost: 1
    tags: [boosted-with]
    effects:
      - trigger: immediately
        operations: [{op: CANCEL_EFFECTS, target_scope: opposing_combat_card}]
      - trigger: card_used_as_boost_source
        condition: {source_card: this_card}
        choices: [{owner: controller, choose: fighter}]
        operations: [{op: DEAL_EFFECT_DAMAGE, target: chosen_fighter, amount: 2}]
        normalization_blocker: Requires the proposed generic BOOST-source event.

  - id: set-the-stage
    name: Set the Stage
    quantity: 2
    inclusion: fixed
    usable_by: [bess]
    type: scheme
    printed_value: null
    boost: 2
    tags: [boosted-with]
    effects:
      - trigger: scheme
        operations:
          - {op: DRAW, count: 3}
        nested_choice:
          owner: controller
          choose: card_in_hand_after_draw
          then: [{op: MOVE_CARD, from_zone: hand, to_zone: deck_top, selector: chosen_card}]
      - trigger: card_used_as_boost_source
        condition: {source_card: this_card}
        choices:
          - {owner: controller, choose: opponent}
        operations:
          - {op: LOOK_AT, source: chosen_opponent.hand, selector: all, viewer: controller}
        nested_choice:
          owner: controller
          choose: one_card_from_viewed_hand
          then: [{op: DISCARD, from: chosen_opponent.hand, selector: chosen_card, count: 1}]
        normalization_blocker: Requires the proposed generic BOOST-source event.

  - id: sleight-of-hand
    name: Sleight of Hand
    quantity: 2
    inclusion: fixed
    usable_by: any
    type: attack
    printed_value: 1
    boost: 3
    tags: [boosted-with]
    effects:
      - trigger: immediately
        optional: true
        operations:
          - {op: MOVE_CARD, from_zone: combat, to_zone: hand, selector: this_card}
        nested_choice:
          owner: controller
          choose: different_legal_combat_card_from_hand
          then: [{op: REPLACE_COMBAT_CARD, side: own, card: chosen_card, rule: resolve_replacement_normally}]
      - trigger: card_used_as_boost_source
        condition: {source_card: this_card}
        operations: [{op: DRAW, count: 1}]
        normalization_blocker: Requires the proposed generic BOOST-source event.

  - id: smoke-and-mirrors
    name: Smoke and Mirrors
    quantity: 2
    inclusion: fixed
    usable_by: any
    type: versatile
    printed_value: 3
    boost: 1
    tags: []
    effects:
      - trigger: immediately
        optional: true
        operations:
          - {op: SWAP, a: houdini, b: bess}
          - {op: SET_STATE, key: combat.own_participant, value: other_fighter}

  - id: the-big-reveal
    name: The Big Reveal
    quantity: 2
    inclusion: fixed
    usable_by: [houdini]
    type: attack
    printed_value: 2
    boost: 3
    tags: []
    effects:
      - trigger: during_combat
        optional: true
        choices:
          - owner: controller
            choose: exactly_2_legal_boost_cards_simultaneously
        operations:
          - {op: BOOST, target: this_card, source: chosen_boost_card_1, count: 1}
          - {op: BOOST, target: this_card, source: chosen_boost_card_2, count: 1}
      - trigger: after_combat
        choices: [{owner: controller, choose: one_card_used_by_the_big_reveal_to_boost_this_card}]
        operations: [{op: MOVE_CARD, from_zone: boost_disposition, to_zone: hand, selector: chosen_card}]
        normalization_blocker: Selecting the cards used by this BOOST sequence requires BOOST-source identity/history to be first-class.

  - id: vanishing-act
    name: Vanishing Act
    quantity: 3
    inclusion: fixed
    usable_by: any
    type: versatile
    printed_value: 2
    boost: 2
    tags: []
    effects:
      - trigger: after_combat
        choices: [{owner: controller, choose: combat_fighter}]
        operations: [{op: MOVE, target: chosen_fighter, max_distance: 3, overrides: [may_move_through_opposing_fighters]}]

external_definitions: []

validation:
  available_pool_count: 30
  game_deck_count: 30
  quantity_sum: 30
  unique_card_definitions: 13
  quantity_reconciles: true

sources:
  - https://unmatched.cards/card-counter/harry-houdini
  - https://unmatched.cards/umdb/decks/harry-houdini
  - https://unmatched.cards/umdb/cards/the-big-reveal
  - https://restorationgames.com/shop/unmatched-houdini-genie/
  - https://restorationgames.com/wp-content/uploads/2022/09/UM-HvG_Rules-two-page.pdf
  - https://www.the-unmatched.club/heroes/houdini

normalization_notes:
  - All 13 published definitions, exact card types, values, BOOST values, and quantities reconcile to the 30-card deck.
  - BOOSTED WITH text is represented explicitly but remains blocked on a reusable event for effects printed on the card consumed as the BOOST source.
  - The Big Reveal requires both boost cards to be chosen together; a draw caused by the first selected BOOST source does not create a new decision before the second.
  - Audit correction: All Part of the Show carries explicit cancellation protection; And the Beautiful Bess! includes its opponent-caused-discard draw; Flourish includes its ordinary DURING COMBAT BOOST option.
  - Audit correction: For My Next Trick and Vanishing Act explicitly bind their fighter choices; Set the Stage chooses the returned card only after drawing; Sleight of Hand chooses its replacement only after the original card has returned to hand.

blockers:
  - id: semantic-extension-boost-source-trigger
    reason: Current Phase 4A effect vocabulary can execute BOOST but does not expose the consumed source card as an event source for its own BOOSTED WITH effect or preserve source-card identity for later selectors such as The Big Reveal.
  - id: semantic-extension-discard-cause-event
    reason: And the Beautiful Bess! depends on whether this specific hand card was discarded as the result of an opponent's effect. The current shared model has DISCARD as an operation but no reusable discard event carrying cause/source attribution for downstream triggers.
