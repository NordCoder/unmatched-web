normalization_notes:
  - SUMMON follows the Witcher rule: an off-board Wolf can return; when both are already on-board, choose one to place instead.
  - Vanish Into Murder requires a non-defeat temporary removal composite; using DEFEAT would corrupt loss, health, and defeat-trigger semantics.
