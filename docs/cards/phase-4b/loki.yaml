      - id: opaque-hand-card
        owner: loki_owner
        visibility: opaque_card_back_only
        optional: false
        domain: card_instances_in_current_controller_hand
        bind: card
    - id: disclose-and-discard
      operations:
      - {op: REVEAL, source: controller_hand, selector: bound.card}
      - {op: DISCARD, from: controller_hand, selector: bound.card}
