- TRICK cards have no BOOST value.
- Svadilfari selection is explicitly opaque until the selected instance is revealed, under D-REQ-017.
- Freyja's Rescue swaps captured current combat values through stages; no numeric SWAP/source_defined handler remains.
- Fighter-level multiplayer recipient behavior remains a medium-confidence project normalization, not an official ruling.