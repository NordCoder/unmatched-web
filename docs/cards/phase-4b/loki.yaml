normalization_notes:
- TRICK cards use boost: null because the source defines no BOOST value for them.
- Freyja's Rescue uses an explicit combat-value-swap composite; positional SWAP is not overloaded for numeric values.
- Sindri's Bet resolves in DURING COMBAT; if the opponent elects to discard, the discard is an explicit operation rather than an unmaterialized choice.
- Card title spellings use current physical/current-index forms: Baldr's Downfall, Malicious Flyting, Freyja's Rescue, Svadilfari's Lure, Shapeshifter.
- Ownership is never transferred when a Loki-owned TRICK occupies an opponent hand.
- No unmatched.cards/decks fan namespace is used.
