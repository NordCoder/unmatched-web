  - {id: prophecy, name: Prophecy, quantity: 1, usable_by: [merlin], type: scheme, printed_value: null, boost: 2, effects: [{trigger: scheme, operations: [{op: LOOK_AT, source: deck, count: 4, viewer: owner}, {op: REQUEST_CHOICE, definition: prophecy_keep_two}, {op: MOVE_CARD, from_zone: deck_top_four, to_zone: hand, selector: chosen_two}, {op: REORDER, zone: deck, selector: remaining_two, order: chosen_order}]}]}
  - {id: restless-spirits, name: Restless Spirits, quantity: 1, usable_by: [merlin], type: scheme, printed_value: null, boost: 2, effects: [{trigger: scheme, choices: [{choose: space_in_merlin_zone}, {choose: adjacent_space}], operations: [{op: DEAL_EFFECT_DAMAGE, target: each_opposing_fighter_in_chosen_spaces, amount: 2}]}, {trigger: after_effect, condition: {fighter_defeated_by_this_effect: true}, operations: [{op: DRAW, count: 1}]}]}
