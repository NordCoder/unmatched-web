  - {id: excalibur, name: Excalibur, quantity: 1, usable_by: [king-arthur], type: attack, printed_value: 6, boost: 3, effects: []}
  - {id: the-holy-grail, name: The Holy Grail, quantity: 1, usable_by: [king-arthur], type: defense, printed_value: 1, boost: 2, effects: [{trigger: after_combat, condition: {king_arthur_health_lte: 4, king_arthur_undefeated: true}, operations: []}], normalization_blocker: set_king_arthur_health_to_8}
