            operations: []
          - id: discard-mode
            when: {bound: legalese_mode, equals: both_discard_one}
            choices: []
            costs: []
            operations:
              - {op: DISCARD, from_zone: hand, selector: {bound: controller_discard}, skip_if_empty: true}
              - {op: DISCARD, controller: combat_opponent, from_zone: hand, selector: {bound: opponent_discard}, skip_if_empty: true}
