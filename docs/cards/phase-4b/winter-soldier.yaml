normalization_notes:
- BRAINWASHED/star clauses are tagged at the individual effect level so A Boy Named Bucky suppresses only the negative clause, not the ordinary portion of a card.
- Audit correction: Bionic Arm's opponent-movement clause is BRAINWASHED; its DURING COMBAT value effect is not.
- Audit correction: Manipulation's own draw is unconditional, while each opponent independently may resolve the BRAINWASHED draw-until-five clause unless A Boy Named Bucky is active.
- Audit correction: Without Remorse gives the opponent a choice to draw; it is not a mandatory opponent draw.
