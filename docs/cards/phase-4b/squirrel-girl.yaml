normalization_notes:
- Deck metadata and quantities are verified independently, but the manifest is blocked because several card effects require unresolved small-fighter shared-occupancy runtime semantics.
- Audit correction: Get 'Em Tippy-Toe!, Horde of Squirrels and Nutwork of Spies explicitly bind their choices; movement uses up-to semantics; small-fighter-dependent summon/move effects point to B-EXT-002.
blockers:
- id: semantic-extension-small-fighter-shared-occupancy
  reason: Fuzzball Special, Squirmish, Get 'Em Tippy-Toe! and Eat Nuts require small-fighter shared-space capacity/coexistence/path semantics covered by B-EXT-002.
