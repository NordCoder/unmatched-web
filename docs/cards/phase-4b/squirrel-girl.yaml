interpretations:
  - id: squirrel-go-nuts-empty-correction
    affects: [squirrel-summoning]
    status: project_normalization
    confidence: medium
    behavior: Go Nuts uses an adjacent destination allowed by small-fighter occupancy even when compatibly occupied; the printed empty restriction is not enforced.
    source_refs: [squirrel-official-rulebook, squirrel-rulings-index, squirrel-secondary-faq, squirrel-project-normalization]
    replacement_condition: replace_if_authoritative_ruling_found
  - id: squirrel-propagated-damage-counting
    affects: [small_fighter_damage_events]
    status: project_normalization
    confidence: high
    behavior: Every Squirrel receiving propagated damage counts as damaged and contributes that amount to total damage caused by the originating effect; provenance distinguishes primary from propagated recipients.
    source_refs: [squirrel-official-damage-ruling, squirrel-project-normalization]
    replacement_condition: replace_if_authoritative_ruling_found
