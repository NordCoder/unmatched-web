cards:
  - id: remote-detonation
    name: Remote Detonation
    quantity: 3
    usable_by: any
    type: scheme
    printed_value: null
    boost: 2
    requires: [A-REQ-003]
    effects:
      - id: remote-detonation-effect
        trigger: scheme
        controller: owner
        cancellation: cancelable
        requires: [A-REQ-003]
        stages:
          - id: choose-trap
            when: always
            choices:
              - id: choose-trap
                owner: controller
                visibility: public
                optional: false
                domain:
                  kind: component
                  type: trap
                  owner: self
                  relation:
                    same_zone_as_any:
                      selector: {kind: fighter, owner: self, fighter_id: ingen-worker}
                bind: chosen_trap
            costs: []
            operations: []
          - id: damage-adjacent-opponents
            when: always
            choices: []
            costs: []
            operations: [{op: DEAL_EFFECT_DAMAGE, target: {selector: {kind: fighter, relation: opposing, adjacent_to_component: {ref: choice.chosen_trap}}}, amount: 1}]
          - id: return-trap
            when: always
            choices: []
            costs: []
            operations: [{op: MOVE_COMPONENT, target: {ref: choice.chosen_trap}, destination: box, requires: A-REQ-003}]
          - id: draw-on-return
            when: always
            choices: []
            costs: []
            operations: [{op: DRAW, count: 1}]
  - id: they-should-all-be-destroyed
    name: They Should All Be Destroyed
    quantity: 3
