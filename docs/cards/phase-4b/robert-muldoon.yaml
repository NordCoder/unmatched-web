          - {id: first-draw, when: {choice_item: {ref: choice.selected_options, index: 0}, equals: draw_2}, choices: [], costs: [], operations: [{op: DRAW, count: 2}]}
          - {id: second-place, when: {choice_item: {ref: choice.selected_options, index: 1}, equals: place_up_to_3_traps}, choices: [], costs: [], operations: [{op: PLACE_COMPONENTS, component_pool: traps, destinations: {ref: choice.trap_spaces}, requires: A-REQ-003}]}
          - {id: second-return, when: {choice_item: {ref: choice.selected_options, index: 1}, equals: return_all_defeated_workers}, choices: [], costs: [], operations: [{op: RETURN_FIGHTER, target: {selector: {kind: fighter, owner: self, fighter_id: ingen-worker, state: defeated}}, destination_rule: {kind: legal_return_space, in_zone_of: robert-muldoon}, health_rule: {kind: starting_health}}]}
          - {id: second-draw, when: {choice_item: {ref: choice.selected_options, index: 1}, equals: draw_2}, choices: [], costs: [], operations: [{op: DRAW, count: 2}]}
  - {id: tactical-advance, name: Tactical Advance, quantity: 3, usable_by: [ingen-worker], type: versatile, printed_value: 3, boost: 3, effects: [{id: tactical-move, trigger: after_combat, controller: owner, cancellation: cancelable, stages: [{id: move-workers, when: always, choices: [], costs: [], operations: [{op: MOVE, target: {selector: {kind: fighter, owner: self, fighter_id: ingen-worker}}, max_distance: 2}]}]}]}
  - {id: rending-shot, name: Rending Shot, quantity: 4, usable_by: any, type: attack, printed_value: 3, boost: 1, effects: [{id: rending-move, trigger: after_combat, controller: owner, cancellation: cancelable, stages: [{id: move-opponent, when: always, choices: [], costs: [], operations: [{op: MOVE, target: {ref: combat.opposing_fighter}, max_distance: 3, controller: owner}]}]}]}
  - {id: feint, name: Feint, quantity: 3, usable_by: any, type: versatile, printed_value: 2, boost: 1, effects: [{id: feint-cancel, trigger: immediately, controller: owner, cancellation: cancelable, stages: [{id: cancel, when: always, choices: [], costs: [], operations: [{op: CANCEL_EFFECTS, target_scope: opposing_combat_card}]}]}]}
  - {id: regroup, name: Regroup, quantity: 3, usable_by: any, type: versatile, printed_value: 1, boost: 1, effects: [{id: regroup-draw, trigger: after_combat, controller: owner, cancellation: cancelable, stages: [{id: won, when: {combat: {result: won}}, choices: [], costs: [], operations: [{op: DRAW, count: 2}]}, {id: not-won, when: {combat: {result: not_won}}, choices: [], costs: [], operations: [{op: DRAW, count: 1}]}]}]}
  - id: leap-away
    name: Leap Away
    quantity: 3
    usable_by: any
    type: versatile
    printed_value: 4
    boost: 2
    effects:
      - id: leap-away-move
        trigger: after_combat
        controller: owner
        cancellation: cancelable
        stages:
          - id: choose-fighter
            when: {combat: {result: won}}
            choices:
