        controller: owner
        cancellation: cancelable
        requires: [A-REQ-003]
        stages:
          - id: add-trap-count
            when: always
            choices: []
            costs: []
            operations:
              - op: ADD_VALUE
                target: this_card
                amount:
                  expr: count
                  selector: {kind: component, type: trap, owner: self, adjacent_to: {ref: combat.opposing_fighter}}
  - {id: shoot-her, name: Shoot Her!, quantity: 2, usable_by: [robert-muldoon], type: attack, printed_value: 3, boost: 1, effects: [{id: shoot-her-value, trigger: during_combat, controller: owner, cancellation: cancelable, stages: [{id: set-value, when: {turn: {action_ordinal: 1}}, choices: [], costs: [], operations: [{op: SET_VALUE, target: this_card, value: 5}]}]}]}
  - {id: ive-hunted-most-things-that-can-hunt-you, name: "I've Hunted Most Things That Can Hunt You", quantity: 2, usable_by: [robert-muldoon], type: defense, printed_value: 4, boost: 1, effects: [{id: hunted-move, trigger: after_combat, controller: owner, cancellation: cancelable, stages: [{id: move-friendly, when: always, choices: [], costs: [], operations: [{op: MOVE, target: {selector: {kind: fighter, owner: self}}, max_distance: 5, overrides: [may_move_through_opposing_fighters]}]}]}]}
