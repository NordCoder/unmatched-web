normalization_notes:
- All 10 competitive Hero Deck definitions reconcile to 30 cards.
- Every Ultimate Destruction occurrence is an explicit random-resolution stage referencing one generic D-REQ-009 contract; no source_defined roll/add/draw/recover handlers remain.
- Dynamic BOOST is explicit under D-REQ-010; Missiles face-up ranged commitment is explicit under D-REQ-011.
- Portal leave-space lock is explicit state under D-REQ-006.
- Adventures villain AI/scenario behavior is excluded.