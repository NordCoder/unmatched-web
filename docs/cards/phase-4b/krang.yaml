schema_version: 1
fighter_id: krang
status: verified
construction: {kind: fixed, available_pool_count: 30, game_deck_count: 30, rules: []}
card_zones:
- {id: deck, owner: self}
- {id: hand, owner: self}
- {id: discard, owner: self}
cards:
- id: android-arms-powerbomb
  name: 'Android Arms: Powerbomb'
  quantity: 3
  inclusion: fixed
  usable_by: [krang]
  type: attack
  printed_value: 3
  boost: 2
  tags: []
  effects:
  - trigger: during_combat
    optional: true
    choices: [{owner: controller, choose: card_in_hand_for_boost}]
    operations: [{op: BOOST, target: this_card, card_or_blind_source: chosen_hand_card}]
  - trigger: after_combat
    choices: [{owner: controller, choose: move_distance, min: 0, max_rule: combat_damage_dealt}]
    operations: [{op: MOVE, target: opposing_combat_fighter, max_distance: chosen_move_distance}]
- id: android-arms-chain-flail
