schema_version: 1
fighter_id: krang
status: partial
verification: {evidence: qualified, semantics: verified, integration: requires_shared_extension, policy: ready}
requires: [D-REQ-001, D-REQ-004, D-REQ-006, D-REQ-009, D-REQ-010, D-REQ-011]
construction: {kind: fixed, available_pool_count: 30, game_deck_count: 30, rules: []}
card_zones: [{id: deck, owner: self}, {id: hand, owner: self}, {id: discard, owner: self}]
cards:
- id: android-arms-powerbomb
  name: 'Android Arms: Powerbomb'
  quantity: 3
  inclusion: fixed
  usable_by: [krang]
  type: attack
  printed_value: 3
  boost: 2
  tags: []
  effects:
  - id: powerbomb-boost
    trigger: during_combat
    optional: true
    choices: [{id: boost-card, owner: controller, visibility: private, optional: false, domain: own_hand_cards, bind: card}]
    operations: [{op: BOOST, target: this_card, card_or_blind_source: bound.card}]
  - id: powerbomb-move
    trigger: after_combat
    choices: [{id: distance, owner: controller, visibility: public, optional: true, domain: {integer_range: [0, combat_damage_dealt]}, bind: distance}]
    operations: [{op: MOVE, target: opposing_combat_fighter, max_distance: bound.distance}]
- id: android-arms-chain-flail
  name: 'Android Arms: Chain Flail'
  quantity: 3
  inclusion: fixed
  usable_by: [krang]
  type: attack
  printed_value: 2
  boost: 3
  tags: [ultimate_destruction]
  effects:
  - id: chain-flail
    trigger: after_combat
    requires: [D-REQ-009]
    stages:
    - id: roll
      random_resolution: {table: die-of-ultimate-destruction, reroll_contract: D-REQ-009, bind: destruction_result}
    - id: resolve-number
      condition: {bound.destruction_result.kind: number, opposing_card_not_played_or_printed_value_lt_bound_result: true}
      operations: [{op: DISCARD, from: opponent_hand, selector: opponent_chosen, count: 2, controller: opponent}]
- id: android-arms-missiles
  name: 'Android Arms: Missiles'
  quantity: 3
  inclusion: fixed
  usable_by: [krang]
  type: attack
  printed_value: 1
  boost: 1
  tags: [ultimate_destruction]
  requires: [D-REQ-011]
  play_modes:
  - {id: normal, visibility: face_down, attack_type: melee}
  - {id: face_up_ranged, visibility: face_up_on_commit, attack_type: ranged, replacement_for_normal_commitment: true}
  effects:
  - id: missiles-value
    trigger: during_combat
    requires: [D-REQ-009]
    stages:
    - id: roll
      random_resolution: {table: die-of-ultimate-destruction, reroll_contract: D-REQ-009, bind: destruction_result}
    - id: add
      condition: {bound.destruction_result.kind: number}
      operations: [{op: ADD_VALUE, target: this_card, amount_from: bound.destruction_result.value}]
- id: warlord-of-dimension-x
  name: Warlord of Dimension X
  quantity: 3
  inclusion: fixed
  usable_by: [krang]
  type: versatile
  printed_value: 3
  boost: 3
  tags: []
  effects:
  - id: warlord
    trigger: after_combat
    requires: [D-REQ-001]
    stages:
    - id: reveal-own
      operations: [{op: REVEAL, source: deck_top, selector: 1, bind: own_card}]
    - id: reveal-opponent
      operations: [{op: REVEAL, source: opponent_deck_top, selector: 1, bind: opponent_card}]
    - id: compare-and-draw
      condition: {bound.own_card.name_length_gt_bound.opponent_card.name_length: true}
      operations: [{op: DRAW, count: 1}]
- id: pan-dimensional-portal
  name: Pan-Dimensional Portal
  quantity: 2
  inclusion: fixed
  usable_by: [krang]
  type: versatile
  printed_value: 3
  boost: dynamic
  boost_resolution: {requires: [D-REQ-010], kind: ultimate_destruction_roll, table: die-of-ultimate-destruction, reroll_contract: D-REQ-009}
  tags: [ultimate_destruction]
  effects:
  - id: portal
    trigger: after_combat
    requires: [D-REQ-001, D-REQ-006, D-REQ-009]
    stages:
    - id: choose-fighter
      choices: [{id: fighter, owner: controller, visibility: public, optional: false, domain: combat_fighters, bind: target}]
    - id: choose-destination
      choices: [{id: destination, owner: controller, visibility: public, optional: false, domain: any_open_space, bind: destination}]
    - id: place-and-lock
      operations:
      - {op: PLACE, target: bound.target, destination_rule: bound.destination}
      - op: SET_STATE
        key: temporary_space_locks
        value: {target: bound.target, scope: until_turn_end, restriction: cannot_leave_current_space, excludes: [defeat_removal]}
    - id: roll
      random_resolution: {table: die-of-ultimate-destruction, reroll_contract: D-REQ-009, bind: hand_bottom_count}
    - id: bottom-cards
      condition: {bound.hand_bottom_count.kind: number}
      operations: [{op: MOVE_CARD, from_zone: each_combat_player_hand, to_zone: each_combat_player_deck, selector: random, count: bound.hand_bottom_count.value, position: bottom}]
    - id: draw
      operations: [{op: DRAW, controller: each_combat_player, count: 2}]
- id: molecular-amplification-unit
  name: Molecular Amplification Unit
  quantity: 4
  inclusion: fixed
  usable_by: [krang]
  type: versatile
  printed_value: 2
  boost: 2
  tags: [ultimate_destruction]
  effects:
  - {id: mau-activate, trigger: immediately, operations: [{op: CHANGE_STATE, key: active_doomsday_machines, transition: plus_one_capped_at_3}]}
  - id: mau-value
    trigger: during_combat
    requires: [D-REQ-009]
    stages:
    - id: roll
      random_resolution: {table: die-of-ultimate-destruction, reroll_contract: D-REQ-009, bind: destruction_result}
    - id: add
      condition: {bound.destruction_result.kind: number}
      operations: [{op: ADD_VALUE, target: this_card, amount_from: bound.destruction_result.value}]
- id: welcome-to-the-technodrome
  name: Welcome to the Technodrome!
  quantity: 3
  inclusion: fixed
  usable_by: [krang]
  type: versatile
  printed_value: 2
  boost: 2
  tags: []
  effects:
  - id: technodrome
    trigger: immediately
    choices: [{id: mode, owner: controller, visibility: public, optional: false, domain: [cancel_opponent_card, activate_machine], bind: mode}]
    branches:
    - {condition: {bound.mode: cancel_opponent_card}, operations: [{op: CANCEL_EFFECTS, target_scope: opposing_combat_card}]}
    - {condition: {bound.mode: activate_machine}, operations: [{op: CHANGE_STATE, key: active_doomsday_machines, transition: plus_one_capped_at_3}]}
- {id: minimizer, name: Minimizer, quantity: 3, inclusion: fixed, usable_by: [krang], type: defense, printed_value: 0, boost: 1, tags: [], effects: [{id: minimizer-reduce, trigger: immediately, operations: [{op: ADD_VALUE, target: opposing_combat_card, amount: -4}]}, {id: minimizer-end-turn, trigger: after_combat, operations: [{op: END_TURN}]}]}
- id: android-arms-wings
  name: 'Android Arms: Wings'
  quantity: 3
  inclusion: fixed
  usable_by: [krang]
  type: scheme
  printed_value: null
  boost: 3
  tags: [ultimate_destruction]
  effects:
  - id: wings
    trigger: scheme
    requires: [D-REQ-009]
    stages:
    - id: roll
      random_resolution: {table: die-of-ultimate-destruction, reroll_contract: D-REQ-009, bind: move_result}
    - id: move
      condition: {bound.move_result.kind: number}
      operations: [{op: MOVE, target: krang, max_distance: bound.move_result.value, overrides: [may_move_through_opposing_fighters], bind: movement_result}]
    - id: damage-crossed
      operations: [{op: DEAL_EFFECT_DAMAGE, target: bound.movement_result.opposing_fighters_moved_through, amount: 1}]
    - id: action
      operations: [{op: GAIN_ACTION, count: 1}]
- id: iq-of-968
  name: IQ of 968
  quantity: 3
  inclusion: fixed
  usable_by: [krang]
  type: scheme
  printed_value: null
  boost: dynamic
  boost_resolution: {requires: [D-REQ-010], kind: ultimate_destruction_roll, table: die-of-ultimate-destruction, reroll_contract: D-REQ-009}
  tags: [ultimate_destruction]
  effects:
  - id: iq
    trigger: scheme
    requires: [D-REQ-009]
    stages:
    - {id: activate-all, operations: [{op: SET_STATE, key: active_doomsday_machines, value: 3}]}
    - id: roll-draw
      random_resolution: {table: die-of-ultimate-destruction, reroll_contract: D-REQ-009, bind: draw_result}
    - id: draw
      condition: {bound.draw_result.kind: number}
      operations: [{op: DRAW, count: bound.draw_result.value}]
    - id: roll-recover
      random_resolution: {table: die-of-ultimate-destruction, reroll_contract: D-REQ-009, bind: recover_result}
    - id: recover
      condition: {bound.recover_result.kind: number}
      operations: [{op: RECOVER, target: krang, amount: bound.recover_result.value}]
external_definitions:
- id: ultimate-destruction-resolution
  kind: random_resolution_contract
  requires: [D-REQ-009]
  table: die-of-ultimate-destruction
  semantics:
    roll_independently_per_symbol: true
    numbered_face: bind_numeric_value
    x_face: {value: 0, associated_symbol_effect_resolves: false}
    after_each_roll: controller_may_deactivate_one_active_machine_to_reroll_and_replace_result
    repeat_reroll_while_active_machine_available: true
validation:
  quantity: {result: PASS, available_pool_count: 30, game_deck_count: 30, quantity_sum: 30}
  usable_by: PASS
  references: PASS
  source_coverage: QUALIFIED
  semantic_structure: PASS
  integration: REQUIRES_SHARED_EXTENSION
  fan_content: PASS
sources:
- {id: hero-decks-product, authority: official_component, url: https://restorationgames.com/shop/unmatched-adventures-teenage-mutant-ninja-turtles-shredder-krang-hero-decks/, checked_at: '2026-07-27', supports: [official_competitive_release], durability: durable}
- {id: hero-decks-rules-mirror, authority: published_rules_mirror, url: https://tesera.ru/images/items/2594660/UMA-TMNT-Shredder_and_Krang_Rules_pages_lr.pdf, checked_at: '2026-07-27', supports: [ultimate_destruction_die_and_rerolls], durability: durable}
