external_definitions:
- id: ultimate-destruction-symbol
  kind: random_resolution_rule
  operations:
  - Roll the Die of Ultimate Destruction independently for each symbol.
  - Numbered result supplies that symbol's value.
  - X counts as zero and the effect for that symbol does not resolve.
  - Krang may deactivate an active machine after a roll to reroll; repeat while machines remain active.
validation: {available_pool_count: 30, game_deck_count: 30, quantity_sum: 30, unique_card_definitions: 10, result: PASS}
sources:
- {authority: official_component, url: https://restorationgames.com/shop/unmatched-adventures-teenage-mutant-ninja-turtles-shredder-krang-hero-decks/, checked_at: '2026-07-27'}
- {authority: reference, url: https://tesera.ru/images/items/2594660/UMA-TMNT-Shredder_and_Krang_Rules_pages_lr.pdf, checked_at: '2026-07-27', note: Set-rules mirror used for authoritative destruction-die procedure.}
- {authority: reference, url: https://www.the-unmatched.club/heroes/krang, checked_at: '2026-07-27', note: Current competitive Hero Deck visual corpus transcribed from Club card images supplied during reconciliation.}
normalization_notes:
- All 10 competitive Hero Deck definitions reconcile to 30 physical cards.
- Pan-Dimensional Portal's both-players clause is scoped to the two players participating in the combat, not every player in a multiplayer game.
- Pan-Dimensional Portal and IQ of 968 use a destruction-die BOOST symbol rather than a numeric BOOST; boost_rule is a provisional corpus-proven field requiring shared schema promotion.
- Android Arms: Missiles has a face-up ranged-attack play mode; play_overrides is a provisional field pending a generic combat-commitment/visibility override.
- Adventures villain AI/scenario behavior is excluded.
