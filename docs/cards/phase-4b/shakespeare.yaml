schema_version: 1
fighter_id: shakespeare
status: verified
construction: {kind: fixed, available_pool_count: 30, game_deck_count: 30}

card_zones:
  - {id: line, owner: self, visibility: public, ordered: true}

cards:
  - {id: horror, name: Horror, quantity: 5, usable_by: [shakespeare], type: attack, printed_value: 4, boost: 3, tags: [line, syllables:2], effects: [{trigger: during_combat, operations: [{op: ADD_VALUE, target: this_card, amount_rule: count_other_horror_cards_already_in_line}]}], completion_effects: [{trigger: line_completion, operations: [{op: DEAL_EFFECT_DAMAGE, target: opposing_combat_fighter, amount_rule: count_other_cards_in_completed_line}]}]}
  - {id: my-kingdom-for-a-horse, name: My Kingdom For A Horse, quantity: 3, usable_by: [shakespeare], type: attack, printed_value: 5, boost: 3, tags: [line, syllables:6], effects: [], completion_effects: [{trigger: line_completion, operations: [{op: GAIN_ACTION, count: 2}]}]}
  - {id: the-ides-of-march, name: The Ides Of March, quantity: 2, usable_by: [shakespeare], type: versatile, printed_value: 2, boost: 2, tags: [line, syllables:4], effects: [], completion_effects: [{trigger: line_completion, choices: [{owner: controller, choose: opposing_fighter, capture: damage_target}], operations: [{op: DEAL_EFFECT_DAMAGE, target: captured.damage_target, amount: 2}]}]}
  - {id: alas, name: Alas, quantity: 2, usable_by: [shakespeare], type: versatile, printed_value: 2, boost: 2, tags: [line, syllables:2], effects: [{trigger: after_combat, condition: {combat_result: lost}, operations: [{op: RECOVER, target: shakespeare, amount: 1}]}], completion_effects: [{trigger: line_completion, operations: [{op: DRAW, count: 2}, {op: RECOVER, target: shakespeare, amount: 2}]}]}
  - id: once-more-unto-the-breach
    name: Once More Unto The Breach
    quantity: 2
    usable_by: [shakespeare]
    type: versatile
    printed_value: 3
    boost: 2
    tags: [line, syllables:6]
    effects:
      - trigger: after_combat
        choices: [{owner: controller, choose: defeated_actor, capture: actor_to_return}]
        operations: [{op: RETURN_FIGHTER, target: captured.actor_to_return, destination: any_space_in_shakespeare_zone, health_rule: source_defined_full_token_health}]
    completion_effects:
      - trigger: line_completion
        choices: [{owner: controller, choose: destination_for_each_defeated_actor, domain: spaces_in_shakespeare_zone, capture: actor_destinations}]
        operations: [{op: RETURN_FIGHTER, target: all_defeated_actors, destination_rule: captured.actor_destinations, health_rule: source_defined_full_token_health}]
  - {id: again, name: Again, quantity: 3, usable_by: [actor], type: versatile, printed_value: 3, boost: 2, tags: [line, syllables:2], effects: [{trigger: after_combat_before_line_append, optional: true, operations: [{op: MOVE_CARD, from_zone: line, to_zone: hand, selector: first_card}]}], completion_effects: [{trigger: line_completion, operations: [{op: DRAW, count: 1}]}]}
  - {id: such-sweet-sorrow, name: Such Sweet Sorrow, quantity: 2, usable_by: [actor], type: versatile, printed_value: 4, boost: 2, tags: [line, syllables:4], effects: [{trigger: after_combat, operations: [{op: MOVE, target: own_combat_fighter, max_distance: 2}]}], completion_effects: [{trigger: line_completion, operations: [{op: DRAW, count: 1}]}]}
  - {id: all-are-punished, name: All Are Punished, quantity: 2, usable_by: any, type: attack, printed_value: 4, boost: 2, tags: [line, syllables:4], effects: [{trigger: after_combat, operations: [{op: DEAL_EFFECT_DAMAGE, target: each_other_fighter_in_own_combat_fighter_zone, amount: 1}]}], completion_effects: [{trigger: line_completion, operations: [{op: DRAW, count: 1}]}]}
  - {id: places-places, name: "Places, Places!", quantity: 2, usable_by: any, type: attack, printed_value: 3, boost: 1, tags: [line, syllables:4], effects: [{trigger: after_combat, operations: [{op: MOVE, target: each_actor, max_distance: 3}]}], completion_effects: [{trigger: line_completion, operations: [{op: PLACE, target: shakespeare, destination: space_in_zone_with_no_actors}]}]}
  - {id: deceive, name: Deceive, quantity: 3, usable_by: any, type: versatile, printed_value: 2, boost: 1, tags: [line, syllables:2], effects: [{trigger: immediately, operations: [{op: CANCEL_EFFECTS, target_scope: opposing_combat_card}]}], completion_effects: [{trigger: line_completion, operations: [{op: MOVE_CARD, from_zone: line, to_zone: hand, selector: this_card}]}]}
  - id: et-tu-brute
    name: "Et Tu, Brute?"
    quantity: 2
    usable_by: any
    type: versatile
    printed_value: 3
    boost: 3
    tags: [line, syllables:4]
    effects: [{trigger: during_combat, operations: [{op: ADD_VALUE, target: this_card, amount_rule: count_friendly_fighters_adjacent_to_opposing_fighter}]}]
    completion_effects:
      - trigger: line_completion
        choices: [{owner: controller, choose: destination_for_each_friendly_fighter, domain: any_space, capture: fighter_destinations}]
        operations: [{op: PLACE, target: each_friendly_fighter, destination_rule: captured.fighter_destinations}]
  - {id: revise, name: Revise, quantity: 2, usable_by: any, type: versatile, printed_value: 1, boost: 2, tags: [line, syllables:2], effects: [{trigger: after_combat, operations: [{op: DRAW, count_rule: 2_if_won_else_1}]}], completion_effects: [{trigger: line_completion, operations: [{op: MOVE, target: each_fighter, max_distance: 2}]}]}

external_definitions: []
validation: {available_pool_count: 30, game_deck_count: 30, quantity_sum: 30, unique_card_definitions: 12}
sources:
  - https://unmatched.cards/umdb/decks/william-shakespeare
  - https://restorationgames.com/wp-content/uploads/2024/03/UM-SaA-Set-Rules.pdf
  - https://www.the-unmatched.club/heroes/shakespeare
normalization_notes:
  - syllables metadata and completion_effects are consumed only by the proposed generic ordered-sequence completion composite.
  - completion_effects are full normalized effect records and may contain controller choices, dependencies, and operations; they are not bare operation lists.
  - Completion effects are not ordinary combat-card effects and remain eligible when the final card's ordinary effects were canceled.
  - Again resolves its optional first-card return after ordinary After Combat processing but before cleanup appends the current card to the Line.
