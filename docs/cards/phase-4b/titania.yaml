schema_version: 1
fighter_id: titania
status: verified
construction: {kind: fixed, available_pool_count: 30, game_deck_count: 30}

card_zones:
  - {id: glamour-deck, owner: self, visibility: private_order}
  - {id: active-glamour, owner: self, visibility: public}
  - {id: glamour-discard, owner: self, visibility: public}

cards:
  - {id: queen-of-the-fairies, name: Queen Of The Fairies, quantity: 2, usable_by: [titania], type: attack, printed_value: 2, boost: 3, tags: [], effects: [{trigger: during_combat, operations: [{op: ADD_VALUE, target: this_card, amount_rule: count_cards_in_glamour_discard}]}]}
  - {id: met-by-moonlight, name: Met By Moonlight, quantity: 3, usable_by: [oberon], type: attack, printed_value: 5, boost: 2, tags: [], effects: [{trigger: after_combat, operations: [{op: PLACE, target: oberon, destination: space_adjacent_to_titania}]}]}
  - {id: as-wise-as-beautiful, name: As Wise As Beautiful, quantity: 3, usable_by: [titania], type: versatile, printed_value: 2, boost: 2, tags: [], effects: [{trigger: after_combat, choices: [{owner: controller, choose: branch, options: [draw_one, discard_glamour_draw_two]}], branches: [{condition: {chosen_branch: draw_one}, operations: [{op: DRAW, count: 1}]}, {condition: {chosen_branch: discard_glamour_draw_two}, costs: [{op: MOVE_CARD, from_zone: active-glamour, to_zone: glamour-discard, selector: active_card}], operations: [{op: DRAW, count: 2}]}]}]}
  - {id: whisked-away, name: Whisked Away, quantity: 3, usable_by: any, type: versatile, printed_value: 4, boost: 1, tags: [], effects: [{trigger: after_combat, operations: [{op: MOVE, target: own_combat_fighter, max_distance: 2}], optional: true, costs: [{op: MOVE_CARD, from_zone: active-glamour, to_zone: glamour-discard, selector: active_card}], followup: [{op: PLACE, target: own_combat_fighter, destination: any_space}]}]}
  - {id: the-moon-looks-down, name: The Moon Looks Down, quantity: 2, usable_by: [titania], type: versatile, printed_value: 3, boost: 2, tags: [], effects: [{trigger: after_combat, choices: [{owner: controller, choose: card_in_glamour_discard}], operations: [{op: MOVE_CARD, from_zone: glamour-discard, to_zone: glamour-deck_bottom, selector: chosen_card}]}]}
  - {id: fairy-song, name: Fairy Song, quantity: 3, usable_by: any, type: versatile, printed_value: 3, boost: 2, tags: [], effects: [{trigger: during_combat, optional: true, costs: [{op: MOVE_CARD, from_zone: active-glamour, to_zone: glamour-discard, selector: active_card}], operations: [{op: SET_VALUE, target: this_card, value: 5}]}]}
  - {id: parting-gift, name: Parting Gift, quantity: 2, usable_by: any, type: versatile, printed_value: 2, boost: 1, tags: [], effects: [{trigger: after_combat, optional: true, operations: [{op: DEAL_EFFECT_DAMAGE, target: each_fighter_in_combat, amount: 2}]}]}
  - {id: but-a-dream, name: But A Dream, quantity: 2, usable_by: [titania], type: defense, printed_value: 0, boost: 2, tags: [], effects: [{trigger: immediately, operations: [{op: CANCEL_EFFECTS, target_scope: opposing_combat_card}, {op: IGNORE_VALUE, target: opposing_combat_card}, {op: MOVE_CARD, from_zone: resolving_opposing_combat_card, to_zone: owner_hand, selector: opposing_combat_card}]}, {trigger: after_combat, operations: [{op: DRAW, count: 1}]}]}
  - {id: protection-of-the-fairy-woods, name: Protection Of The Fairy Woods, quantity: 3, usable_by: any, type: defense, printed_value: 2, boost: 1, tags: [], effects: [{trigger: immediately, optional: true, costs: [{op: MOVE_CARD, from_zone: active-glamour, to_zone: glamour-discard, selector: active_card}], operations: [{op: CANCEL_EFFECTS, target_scope: opposing_combat_card}]}]}
  - {id: a-momentary-glance, name: A Momentary Glance, quantity: 2, usable_by: [titania], type: scheme, printed_value: null, boost: 4, tags: [], effects: [{trigger: scheme, choices: [{owner: controller, choose: fighter_in_titania_zone}], operations: [{op: DEAL_EFFECT_DAMAGE, target: chosen_fighter, amount: 2}]}]}
  - {id: gift-of-the-fair-folk, name: Gift Of The Fair Folk, quantity: 3, usable_by: any, type: scheme, printed_value: null, boost: 2, tags: [], effects: [{trigger: scheme, choices: [{owner: controller, choose: two_distinct_branches, options: [recover_one, draw_two, move_two]}], operations: [{op: RECOVER, target: chosen_fighter, amount: 2, condition: {recover_one_selected: true}}, {op: DRAW, count: 2, condition: {draw_two_selected: true}}, {op: MOVE, target: up_to_two_chosen_fighters, max_distance: 2, condition: {move_two_selected: true}}]}]}
  - {id: what-fools-these-mortals-be, name: What Fools These Mortals Be, quantity: 2, usable_by: [oberon], type: scheme, printed_value: null, boost: 2, tags: [], effects: [{trigger: scheme, choices: [{owner: controller, choose: opponent}, {owner: controller, choose: card_from_viewed_hand}], operations: [{op: LOOK_AT, source: chosen_opponent.hand, selector: all, viewer: controller}, {op: MOVE_CARD, from_zone: chosen_opponent.hand, to_zone: chosen_opponent.deck, selector: chosen_card}, {op: SHUFFLE, zone: chosen_opponent.deck}]}]}

external_definitions:
  - {id: glamour-of-greed, kind: glamour, effects: [{trigger: turn_end, optional: true, operations: [{op: DRAW, count: 1}]}]}
  - {id: glamour-of-invisibility, kind: glamour, effects: [{trigger: static, continuous: true, operations: [{op: SET_STATE, target: friendly_fighters, key: may_move_through_opposing_fighters, value: true}]}]}
  - {id: glamour-of-jealousy, kind: glamour, effects: [{trigger: before_defense_card_commit, optional: true, condition: {defender: [titania, oberon]}, operations: [{op: SWAP, a: titania, b: oberon}, {op: SET_STATE, key: combat_defender, value: other_fighter, condition: {swap_completed: true}}]}]}
  - {id: glamour-of-love, kind: glamour, effects: [{trigger: maneuver_before_fighter_movement, optional: true, choices: [{owner: controller, choose: opposing_fighter}], operations: [{op: MOVE, target: chosen_fighter, max_distance: 1}]}]}
  - {id: glamour-of-rhyme, kind: glamour, effects: [{trigger: after_scheme, operations: [{op: GAIN_ACTION, count: 1}]}]}
  - {id: glamour-of-sleep, kind: glamour, effects: [{trigger: replacement, continuous: true, operations: [{op: PREVENT_DAMAGE, target: friendly_fighters, scope: all_non_combat_damage}]}]}

validation: {available_pool_count: 30, game_deck_count: 30, quantity_sum: 30, unique_card_definitions: 12, external_definition_count: 6}
sources:
  - https://unmatched.cards/umdb/decks/titania
  - https://restorationgames.com/wp-content/uploads/2024/03/UM-SaA-Set-Rules.pdf
  - https://www.the-unmatched.club/heroes/titania
normalization_notes:
  - The six Glamours are external gameplay cards with runtime instances in their own shuffled deck; they do not count toward the 30-card action deck.
  - The auxiliary-deck runtime lifecycle and the pre-defense-card Glamour of Jealousy interrupt are proposed as generic semantics in the Worker C report.
