  - {id: t-rex-project-normalization, authority: project_normalization, url: https://github.com/NordCoder/unmatched-web/blob/phase-4b-worker-b-licensed/docs/phase-4b/worker-b-report.md, checked_at: 2026-07-27, supports: [momentous_shift_overlap_behavior]}
