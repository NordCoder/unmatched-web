normalization_notes:
- Deck metadata and quantities are verified independently, but the manifest is blocked because several card effects themselves require unresolved large-fighter runtime geometry.
- Momentous Shift uses the project-conservative interpretation that T. Rex must occupy no turn-start space for the condition to be satisfied. This is explicitly uncertain because current secondary FAQ evidence says occupying one new space is sufficient; an exact authoritative ruling has not been captured.
- 65 Million Years explicitly binds its discard-pile choice; movement/placement cards point to B-EXT-001 rather than pretending single-space MOVE/PLACE is sufficient.
blockers:
- id: semantic-extension-large-fighter-footprint
  reason: Momentous Shift, Closer Than She Appears and Ripples in the Water require two-space footprint history, movement, placement and resulting adjacency semantics covered by B-EXT-001.
