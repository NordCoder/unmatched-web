normalization_notes:
  - flanked is a board predicate: at least two fighters controlled by the same player are adjacent to the target fighter.
  - Battle Maneuvers says "your fighters" and therefore moves only fighters controlled by the card controller, not a teammate's merely-friendly fighters.
  - Spring the Trap may select a teammate's adjacent friendly fighter in team play; the replacement defender's fighter controller may therefore differ from the controller/owner of the already-played defense card. C-EXT-003 must preserve those identities separately.
