normalization_notes:
- All 13 definitions reconcile to 30 physical cards.
- Triangle-marked printed clauses are normalized as ruse_attached_to_this_attack conditions.
- Sympathetic Stain keeps opponent selection, private hand inspection, conditional discard and ruse regain in one scheme-resolution context.
- Recruit to the Ring and Undercover Agent require runtime fighter-instance identity for Culper Spies.
