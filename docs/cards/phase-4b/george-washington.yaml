  name: Recruit to the Ring
  quantity: 2
  inclusion: fixed
  usable_by: any
  type: versatile
  printed_value: 2
  boost: 1
  tags: []
  effects:
  - id: recruit
    trigger: after_combat
    requires: [D-REQ-001]
    stages:
    - id: choose-spy
      choices: [{id: spy, owner: controller, visibility: public, optional: false, domain: defeated_culper_spy_instances, bind: spy}]
