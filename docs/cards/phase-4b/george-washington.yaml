  name: Undercover Agent
  quantity: 2
  inclusion: fixed
  usable_by: [george-washington]
  type: defense
  printed_value: 1
  boost: 2
  tags: []
  effects:
  - id: undercover-swap-defender
    trigger: during_combat
    optional: true
    requires: [D-REQ-001]
    stages:
    - id: choose-spy
      choices: [{id: spy, owner: controller, visibility: public, optional: false, domain: adjacent_culper_spy_instances, bind: spy}]
    - id: swap-position
      operations: [{op: SWAP, a: george-washington, b: bound.spy}]
    - id: rebind-defender
      operations: [{op: SET_STATE, key: current_combat.defender_fighter, value_from: bound.spy, scope: current_combat}]
