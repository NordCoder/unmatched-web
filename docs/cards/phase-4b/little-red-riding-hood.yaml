schema_version: 1
fighter_id: little-red-riding-hood
status: blocked
construction: {kind: fixed, available_pool_count: 30, game_deck_count: 30}
card_zones:
  - {id: discard, visibility: public, controller: owner, special_top_card_semantics: basket_item_symbol}

cards:
  - {id: what-large-hands-you-have, name: What Large Hands You Have, quantity: 2, usable_by: [little-red-riding-hood], type: attack, printed_value: 2, boost: 3, printed_symbol: wolf, effects: [{trigger: after_combat, optional: true, branches: [{condition: {basket_symbol: pelt}, operations: [{op: MOVE_CARD, from_zone: discard, to_zone: hand, selector: top_card}]}, {condition: {basket_symbol: not_pelt}, operations: [{op: MOVE_CARD, from_zone: resolving, to_zone: hand, selector: this_card}]}]}]}
  - {id: the-wolfs-skin, name: "The Wolf's Skin", quantity: 3, usable_by: any, type: defense, printed_value: 2, boost: 2, printed_symbol: knife, effects: [{trigger: after_combat, condition: {basket_symbol: wolf}, operations: [{op: DRAW, count: 2}]}]}
  - {id: what-a-terrible-big-mouth-you-have, name: What a Terrible Big Mouth You Have, quantity: 2, usable_by: [little-red-riding-hood], type: defense, printed_value: 2, boost: 2, printed_symbol: knife, effects: [{trigger: after_combat, condition: {basket_symbol: wolf}, operations: [{op: DEAL_EFFECT_DAMAGE, target: opposing_combat_fighter, amount: opposing_card_printed_value}]}]}
  - {id: what-big-ears-you-have, name: What Big Ears You Have, quantity: 2, usable_by: [little-red-riding-hood], type: attack, printed_value: 4, boost: 2, printed_symbol: wolf, effects: [], play_permission: {alternate_type: defense, condition: {basket_symbol: knife}}, normalization_blocker: conditional_card_type_and_play_permission}
  - {id: what-big-eyes-you-have, name: What Big Eyes You Have, quantity: 2, usable_by: [little-red-riding-hood], type: versatile, printed_value: 3, boost: 2, printed_symbol: wolf, effects: [{trigger: immediately, operations: [{op: CANCEL_EFFECTS, target_scope: opposing_combat_card}]}, {trigger: immediately, condition: {basket_symbol: pelt}, operations: [{op: IGNORE_VALUE, target: opposing_combat_card}]}]}
  - {id: whats-that-in-my-basket, name: "What's That in My Basket?", quantity: 4, usable_by: [little-red-riding-hood], type: versatile, printed_value: 4, boost: 3, printed_symbol: wild, effects: []}
  - {id: never-leave-the-path, name: Never Leave the Path, quantity: 2, usable_by: [little-red-riding-hood], type: scheme, printed_value: null, boost: 1, printed_symbol: wolf, effects: [{trigger: scheme, operations: [{op: REQUEST_CHOICE, definition: resolve_basket_item_for_current_source}, {op: TRIGGER_COMPOSITE, definition: never_leave_the_path_selected_item}]}]}
  - {id: into-the-woods-wolf, name: Into the Woods, quantity: 1, usable_by: [little-red-riding-hood], type: scheme, printed_value: null, boost: 2, printed_symbol: wolf, effects: [{trigger: scheme, operations: [{op: MOVE, target: little-red-riding-hood, max_distance: 3}, {op: GAIN_ACTION, count: 1}]}]}
  - {id: into-the-woods-pelt, name: Into the Woods, quantity: 1, usable_by: [little-red-riding-hood], type: scheme, printed_value: null, boost: 2, printed_symbol: pelt, effects: [{trigger: scheme, operations: [{op: MOVE, target: little-red-riding-hood, max_distance: 3}, {op: GAIN_ACTION, count: 1}]}]}
  - {id: into-the-woods-knife, name: Into the Woods, quantity: 1, usable_by: [little-red-riding-hood], type: scheme, printed_value: null, boost: 2, printed_symbol: knife, effects: [{trigger: scheme, operations: [{op: MOVE, target: little-red-riding-hood, max_distance: 3}, {op: GAIN_ACTION, count: 1}]}]}
  - {id: long-have-i-sought-you, name: Long Have I Sought You, quantity: 3, usable_by: [huntsman], type: attack, printed_value: 4, boost: 2, printed_symbol: knife, effects: [{trigger: during_combat, condition: {huntsman_adjacent_to_opposing_combat_fighter: true}, operations: [{op: SET_VALUE, target: this_card, value: 6}]}]}
  - {id: a-grimm-tale, name: A Grimm Tale, quantity: 2, usable_by: [huntsman], type: scheme, printed_value: null, boost: 3, printed_symbol: pelt, effects: [{trigger: scheme, operations: [{op: REQUEST_CHOICE, definition: resolve_basket_item_for_current_source}, {op: TRIGGER_COMPOSITE, definition: a_grimm_tale_selected_item}]}]}
  - {id: stones-in-the-belly, name: Stones in the Belly, quantity: 3, usable_by: any, type: versatile, printed_value: 2, boost: 1, printed_symbol: pelt, effects: [{trigger: during_combat, condition: {basket_symbol: knife}, operations: [{op: DISCARD, from: combat_opponent_hand, selector: random, count: 1}, {op: ADD_VALUE, target: this_card, amount: discarded_card_boost}]}]}
  - {id: once-upon-a-time, name: Once Upon a Time, quantity: 2, usable_by: any, type: versatile, printed_value: 2, boost: 1, printed_symbol: pelt, effects: [{trigger: after_combat, condition: {basket_symbol: knife}, operations: [{op: DEAL_EFFECT_DAMAGE, target: opposing_combat_fighter, amount: 3}]}]}

external_definitions:
  - id: basket-symbol-resolution
    kind: top_discard_metadata
    visibility: public
    wild_semantics: choose_exactly_one_of_wolf_pelt_knife
    wild_binding_scope: current_source_resolution
    note: A wild top discard never satisfies multiple Basket-item branches in the same source resolution.
  - id: resolve_basket_item_for_current_source
    kind: conditional_choice
    controller: owner
    if_top_symbol_is_wild: {choose: [wolf, pelt, knife], count: 1, bind: effective_basket_item}
    otherwise: {bind_from_top_discard_symbol: effective_basket_item}
  - id: never_leave_the_path_selected_item
    kind: exclusive_branch_composite
    selector: effective_basket_item
    branches:
      wolf: [{op: PLACE, target: little-red-riding-hood, destination_rule: any_space}, {op: GAIN_ACTION, count: 1}]
      knife: [{op: DEAL_EFFECT_DAMAGE, target: each_opposing_fighter_in_little_red_zone, amount: 2}]
      pelt: [{op: DRAW, count: 3}]
  - id: a_grimm_tale_selected_item
    kind: exclusive_branch_composite
    selector: effective_basket_item
    branches:
      pelt: [{op: RECOVER, target: little-red-riding-hood, amount: 4}]
      default: [{op: RECOVER, target: little-red-riding-hood, amount: 2}]
  - {id: conditional-card-mode, kind: proposed_generic_play_permission, affected_card: what-big-ears-you-have}
validation: {available_pool_count: 30, game_deck_count: 30, quantity_sum: 30, unique_card_definitions: 14, unique_titles: 12, non_action_reference_components: 1}
sources:
  - https://unmatched.cards/umdb/decks/little-red
  - https://restorationgames.com/wp-content/uploads/2020/11/UM-Little_Red_Riding_HoodvBeowulf-Rules-two-page.pdf
  - https://how-to-play.s3.us-east-2.amazonaws.com/295564/rules/295564_rules.pdf
normalization_notes:
  - The Basket is a setup/reference component in the discard pile, not one of the 30 action cards; the shared runtime still needs a real non-action component instance capable of occupying this ordered zone.
  - A wild Basket is bound to exactly one effective item for a source resolution. Never Leave the Path therefore resolves exactly one item branch, never multiple branches from the same wild Basket.
  - Into the Woods is represented as three definitions because its three physical copies carry different printed symbols.
  - Combat references to an opponent hand are scoped to the current combat opponent rather than an arbitrary multiplayer opponent.