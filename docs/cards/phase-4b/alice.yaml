normalization_notes:
  - Alice size state is defined in the fighter manifest; card effects only mutate or read that state.
  - Manxome Foe discards the top deck card and adds that discarded card's BOOST value to the combat value; it is not normalized as a reveal or as a BOOST-value modifier.