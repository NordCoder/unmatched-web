  - https://unmatched.cards/umdb/cards/web-shooters
  - https://www.the-unmatched.club/heroes/spiderman

normalization_notes:
  - The complete published Spider-Man deck now reconciles to 30; community /decks/ Spider-Man builds were excluded.
  - The official Brains and Brawn rulebook directly confirms Momentous Shift, Disarming Shot, With Great Power, Thwip!, the 30-card deck size, and Spidey-Sense timing.
  - Spider-Sense Tingling! and Counter-Attack read the opponent card's current combat value at their after-combat timing, not the printed value disclosed by Spidey-Sense before defense selection.
  - With Great Power is normalized as a turn-scoped attack-value state increment so playing both copies in one turn can stack without changing immutable printed card values.