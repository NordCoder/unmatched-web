        trigger: during_combat
        controller: controller
        cancellation: cancelable
        stages:
          - {id: swap, when: {card_played_by: dagger}, choices: [], costs: [], operations: [{op: SWAP, a: dagger, b: cloak, bind: swap_result}]}
