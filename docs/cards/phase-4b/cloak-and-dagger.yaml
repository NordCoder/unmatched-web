    name: Darkforce Dimension
    quantity: 2
    inclusion: fixed
    usable_by: [cloak]
    type: attack
    printed_value: 4
    boost: 3
    tags: []
    effects:
      - id: darkforce-dimension-resolve
        trigger: after_combat
        controller: controller
        cancellation: cancelable
        stages:
          - id: choose-destination
            when: always
            choices:
              - {id: destination, owner: controller, visibility: public, optional: false, domain: {kind: space, selector: any_selectable_space_for_place}, bind: destination}
