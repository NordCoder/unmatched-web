normalization_notes:
- Audit correction: Lightforce Barrage uses the schema's first-class cancellation protection instead of relying only on a decorative tag.
- Audit correction: Channel the Dark and Living Shadow preserve their official IF/THEN dependencies: later consequences do not resolve when the required placement/swap cannot occur.
- Audit correction: Into Darkness and Chosen Fate explicitly bind their fighter/value choices.
