        trigger: after_combat
        controller: controller
        cancellation: cancelable
        stages: [{id: recover, when: {cloak_played_this_as_defense: true}, choices: [], costs: [], operations: [{op: RECOVER, target: dagger, amount: 2}]}]
      - id: living-light-recover-cloak
        trigger: after_combat
        controller: controller
        cancellation: cancelable
        stages: [{id: recover, when: {dagger_played_this_as_attack: true}, choices: [], costs: [], operations: [{op: RECOVER, target: cloak, amount: 2}]}]
