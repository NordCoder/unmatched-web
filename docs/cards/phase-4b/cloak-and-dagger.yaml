    name: Lightforce Barrage
    quantity: 2
    inclusion: fixed
    usable_by: [dagger]
    type: attack
    printed_value: 7
    boost: 3
    tags: [effects-cannot-be-canceled]
    effects:
      - id: lightforce-barrage-self-damage
        trigger: after_combat
        controller: controller
        cancellation: protected
        stages: [{id: damage, when: {combat_result: won}, choices: [], costs: [], operations: [{op: DEAL_EFFECT_DAMAGE, target: own_combat_fighter, amount_ref: {combat: current, field: combat_damage_dealt}}]}]
  - id: commanding-impact
    name: Commanding Impact
    quantity: 3
    inclusion: fixed
    usable_by: any
    type: attack
    printed_value: 5
    boost: 2
    tags: []
