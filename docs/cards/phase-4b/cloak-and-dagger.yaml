            when: {combat_opponent_hand_size_gte: 1}
            choices:
              - {id: opponent_discard, owner: combat_opponent, visibility: private, optional: false, domain: {kind: card, zone: own_hand, count: 1}, bind: opponent_discard}
            costs: []
            operations: []
          - {id: discard, when: {bound: opponent_discard, exists: true}, choices: [], costs: [], operations: [{op: DISCARD, controller: combat_opponent, from_zone: hand, selector: {bound: opponent_discard}, count: 1}]}
