            when: {result: damage_result, exists: true}
            choices: []
            costs: []
            operations:
              - {op: RECOVER, target: other_friendly_hero, amount_ref: {result: damage_result, field: actual_damage_dealt}}
              - {op: DRAW, count: 2}

