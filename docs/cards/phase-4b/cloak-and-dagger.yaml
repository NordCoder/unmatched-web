    name: Chosen Fate
    quantity: 2
    inclusion: fixed
    usable_by: any
    type: scheme
    printed_value: null
    boost: 1
    tags: []
    effects:
      - id: chosen-fate-resolve
        trigger: scheme
        controller: controller
        cancellation: cancelable
        stages:
          - id: choose
            when: always
            choices:
              - {id: damaged_hero, owner: controller, visibility: public, optional: false, domain: {kind: fighter, selector: friendly_hero, count: 1}, bind: damaged_hero}
              - {id: damage_amount, owner: controller, visibility: public, optional: false, domain: {kind: integer, min: 0, max: 4}, bind: damage_amount}
            costs: []
            operations: []
          - {id: damage, when: {all_bound: [damaged_hero, damage_amount]}, choices: [], costs: [], operations: [{op: DEAL_EFFECT_DAMAGE, target: {bound: damaged_hero}, amount: {bound: damage_amount}, bind: damage_result}]}
