validation: {available_pool_count: 30, game_deck_count: 30, quantity_sum: 30, unique_card_definitions: 30, attack_count: 11, versatile_count: 11, defense_count: 4, scheme_count: 4}
sources:
  - https://unmatched.cards/umdb/decks/deadpool
  - https://www.unmatchedarena.com/heroes/deadpool
normalization_notes:
  - All published cards are one copy each.
  - Physical/social joke semantics are preserved as provenance-bearing external semantics and are not replaced with digital-only house rules.
  - Time Out replaces the combat card from the deck without inventing a shuffle not present in the published effect.
