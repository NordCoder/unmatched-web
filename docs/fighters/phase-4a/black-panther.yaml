schema_version: 1
id: black-panther
display_name: Black Panther
set_ids: [marvel-for-king-and-country]
status: verified
movement: 2

topology:
  type: hero_with_sidekicks
  loss_rule: primary_hero_defeated
  fighters:
    - id: black-panther
      display_name: Black Panther
      role: hero
      count: 1
      attack_type: melee
      starting_health: 14
      starts_on_board: true
      summonable: false
    - id: shuri
      display_name: Shuri
      role: sidekick
      count: 1
      attack_type: ranged
      starting_health: 6
      starts_on_board: true
      summonable: false

setup:
  hooks:
    - stage: character_configuration
      operations:
        - {op: CREATE_CARD_ZONE, zone: vibranium-suit, visibility: public, controller: owner}
  state_initialization: []

ability:
  id: vibranium-suit
  controller: owner
  effects:
    - id: draw-after-each-boost-value
      trigger: boost_value_applied
      condition: {boost_performed_by_controller: true}
      optional: false
      operations:
        - {op: DRAW, count: 1}
      ordering_note: Draw immediately after applying that BOOST value and before continuing the remaining action/effect.

resources:
  - id: vibranium-suit
    kind: card_zone
    visibility: public
    initial: empty
    ownership_rule: Stored cards retain the opponent who originally owns the card.
    use_rule: Cards in this zone may be selected by Black Panther's controller only as BOOST sources and only if they have a BOOST value.
    disposition_after_boost: Move the used stored card to its owner's discard pile after resolving its BOOST value/effect.

persistent_state: []

deck:
  manifest: ../../cards/phase-4a/black-panther.yaml
  construction: fixed

rulings:
  - id: black-panther-storage-ownership
    summary: Stored opponent cards are face-up, are not part of Black Panther's hand/deck, remain opponent-owned, and return to the owner's discard after Black Panther uses them to BOOST.
    source: https://www.the-unmatched.club/rules/black-panther
  - id: black-panther-boost-effect
    summary: A stored card's BOOST effect, if any, resolves normally when used; effects can therefore benefit the card owner if their wording says so.
    source: https://www.the-unmatched.club/rules/black-panther
  - id: black-panther-no-boost-value
    summary: A stored card without a BOOST value cannot be selected as a BOOST source and can remain stranded in the Suit unless another rule moves it.
    source: https://www.the-unmatched.club/rules/black-panther

sources:
  - type: official_product
    url: https://restorationgames.com/shop/marvel-king-and-country-unmatched/
  - type: published_deck_index
    url: https://unmatched.cards/umdb/decks/black-panther
  - type: consolidated_official-ruling-reference
    url: https://how-to-play.s3.us-east-2.amazonaws.com/295564/rules/295564_rules.pdf
  - type: current_rulings_index
    url: https://www.the-unmatched.club/rules/black-panther

scope_note: Black Panther is stress-tested only for competitive play. Official Adventures materials identify some player-interaction heroes as unsuitable for co-op without house rules; Adventures compatibility is outside Phase 4A.