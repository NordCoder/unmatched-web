schema_version: 1
id: sun-wukong
display_name: Sun Wukong
set_ids: [battle-of-legends-vol-2]
status: verified
movement: 2

topology:
  type: hero_with_sidekicks
  loss_rule: primary_hero_defeated
  fighters:
    - id: sun-wukong
      display_name: Sun Wukong
      role: hero
      count: 1
      attack_type: melee
      starting_health: 17
      starts_on_board: true
      summonable: false
    - id: clone
      display_name: Clone
      role: sidekick
      count: 3
      attack_type: melee
      starting_health: 1
      starts_on_board: false
      summonable: true

setup:
  hooks: []
  state_initialization:
    - {key: clones_in_reserve, value: 3}

ability:
  id: stone-birth
  controller: owner
  effects:
    - id: start-turn-summon-clone
      trigger: turn_start
      optional: true
      condition:
        all:
          - {reserve_count: clone, greater_than: 0}
          - {legal_empty_adjacent_space_exists_for: sun-wukong}
      costs:
        - {op: DEAL_EFFECT_DAMAGE, target: sun-wukong, amount: 1, cost_semantics: true}
      operations:
        - {op: SUMMON, pool: clone, destination_rule: empty_adjacent_to_sun-wukong}

resources:
  - id: clone-reserve
    kind: token_pool
    visibility: public
    initial: 3

persistent_state:
  - key: clones_in_reserve
    type: integer
    reset: never

deck:
  manifest: ../../cards/phase-4a/sun-wukong.yaml
  construction: fixed

rulings:
  - id: sun-wukong-no-summon-destination
    summary: A summon that has no legal destination does not create a Clone; source-dependent costs/continuations must respect the dependency edge rather than manufacturing an off-board result.
    source: https://www.the-unmatched.club/rules/sun-wukong
  - id: sun-wukong-summon-reserve
    summary: Summoning requires an available Clone token from reserve; defeated/off-board Clone state is distinct from a Clone currently occupying a battlefield space.
    source: https://www.the-unmatched.club/rules/sun-wukong

sources:
  - type: official_set
    url: https://restorationgames.com/shop/battle-of-legends-vol-2-unmatched/
  - type: official_rulebook
    url: https://restorationgames.com/wp-content/uploads/2021/11/UM-Battle_of_Legends_vol2_Rules-two-page.pdf
  - type: published_deck_index
    url: https://unmatched.cards/umdb/decks/sun-wukong
  - type: current_rulings_index
    url: https://www.the-unmatched.club/rules/sun-wukong

provenance_exclusions:
  - Community balance-patch versions that alter Ox Form, 72 Transformations, Sly Monkey or ability wording are excluded.