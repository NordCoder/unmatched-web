schema_version: 1
id: squirrel-girl
display_name: Squirrel Girl
set_ids: [marvel-teen-spirit]
status: partial
verification:
  evidence: qualified
  semantics: qualified
  integration: requires_shared_extension
  policy: not_applicable
requires: [B-REQ-002]
movement: 2

topology:
  type: hero_with_sidekicks
  loss_rule: primary_hero_defeated
  fighters:
    - {id: squirrel-girl, display_name: Squirrel Girl, role: hero, count: 1, attack_type: melee, starting_health: 13, starts_on_board: true, summonable: false}
    - id: squirrel
      display_name: Squirrel
      role: sidekick
      count: 8
      attack_type: melee
      starting_health: 1
      starts_on_board: false
      summonable: true
      occupancy_requirement: B-REQ-002
      runtime_identity: distinct_fighter_instance_per_token

setup: {hooks: [], state_initialization: []}

ability:
  id: squirrel-summoning
  controller: owner
  effects:
    - id: start-turn-squirrel-placement
      trigger: turn_start
      controller: controller
      cancellation: protected
      stages:
        - id: decide
          when: always
          choices:
            - id: use_go_nuts
              owner: controller
              visibility: public
              optional: true
              domain: {kind: boolean, meaning: resolve_go_nuts}
              bind: use_go_nuts
          costs: []
          operations: []
        - id: choose-reserve-destination
          when: {bound: use_go_nuts, equals: true, reserve_count: {squirrel: greater_than_0}}
          choices:
            - id: squirrel_destination
              owner: controller
              visibility: public
              optional: false
              domain: {kind: space, selector: adjacent_space_compatible_with_small_fighter_occupancy, requirement: B-REQ-002}
              bind: squirrel_destination
          costs: []
          operations: []
        - id: summon
          when: {bound: squirrel_destination, exists: true}
          choices: []
          costs: []
          operations: [{op: SUMMON, pool: squirrel, destination: {bound: squirrel_destination}, requirement: B-REQ-002}]
        - id: choose-reposition
          when: {bound: use_go_nuts, equals: true, reserve_count: {squirrel: 0}}
          choices:
            - id: squirrel_to_reposition
              owner: controller
              visibility: public
              optional: false
              domain: {kind: fighter, selector: own_squirrel_on_battlefield}
              bind: squirrel_to_reposition
            - id: reposition_destination
              owner: controller
              visibility: public
              optional: false
              domain: {kind: space, selector: adjacent_space_compatible_with_small_fighter_occupancy, requirement: B-REQ-002}
              bind: reposition_destination
          costs: []
          operations: []
        - id: reposition
          when: {all_bound: [squirrel_to_reposition, reposition_destination]}
          choices: []
          costs: []
          operations: [{op: PLACE, target: {bound: squirrel_to_reposition}, destination: {bound: reposition_destination}, requirement: B-REQ-002}]

resources:
  - {id: squirrel-reserve, kind: token_pool, visibility: public, initial: 8}
persistent_state: []

deck:
  manifest: ../../cards/phase-4b/squirrel-girl.yaml
  construction: fixed

rulings:
  - {id: squirrel-small-fighter-damage, source_ref: squirrel-official-damage-ruling, summary: If one small fighter takes damage, every small fighter of the same type in that space takes the same amount; Squirrels have one health.}
  - {id: squirrel-shared-occupancy, source_ref: squirrel-official-rulebook, summary: Small fighters may share spaces under the published capacity and coexistence rules.}

interpretations:
  - id: squirrel-go-nuts-empty-correction
    affects: [start-turn-squirrel-placement]
    status: project_normalization
    confidence: medium
    behavior: Go Nuts may choose an adjacent destination permitted by small-fighter occupancy even when that space is compatibly occupied; the printed word empty is not enforced.
    source_refs: [squirrel-official-rulebook, squirrel-rulings-index, squirrel-secondary-faq, squirrel-project-normalization]
    replacement_condition: replace_if_authoritative_ruling_found
  - id: squirrel-propagated-damage-counting
    affects: [small_fighter_damage_events]
    status: project_normalization
    confidence: high
    behavior: Every Squirrel that receives propagated damage counts as a damaged fighter and contributes its received amount to total damage caused by the originating effect; provenance distinguishes the primary target from propagated recipients.
    source_refs: [squirrel-official-damage-ruling, squirrel-project-normalization]
    replacement_condition: replace_if_authoritative_ruling_found

sources:
  - id: squirrel-official-product
    authority: official
    url: https://restorationgames.com/shop/marvel-teen-spirit-unmatched/
    checked_at: 2026-07-27
    supports: [set_membership]
  - id: squirrel-official-rulebook
    authority: official
    url: https://restorationgames.com/wp-content/uploads/2023/02/UM-TS_Rules.pdf
    checked_at: 2026-07-27
    supports: [small_fighter_rules, printed_go_nuts_empty_wording]
  - id: squirrel-umdb
    authority: published_umdb
    url: https://unmatched.cards/umdb/decks/squirrel-girl
    checked_at: 2026-07-27
    supports: [fighter_stats, ability, deck_construction]
  - id: squirrel-official-damage-ruling
    authority: official_ruling
    url: https://www.the-unmatched.club/tools/disputes/458dae71-7481-4a9c-8d2e-4924ed4afb72
    checked_at: 2026-07-27
    supports: [damage_propagation, four_small_fighter_capacity, shared_space_adjacency]
  - id: squirrel-rulings-index
    authority: secondary_cross_check
    url: https://www.the-unmatched.club/heroes/squirrel-girl
    checked_at: 2026-07-27
    supports: [current_go_nuts_wording_cross_check]
  - id: squirrel-secondary-faq
    authority: secondary_cross_check
    url: https://gridbeast.gg/unmatched-rules-faq/
    checked_at: 2026-07-27
    supports: [go_nuts_empty_correction_claim]
  - id: squirrel-project-normalization
    authority: project_normalization
    url: https://github.com/NordCoder/unmatched-web/blob/phase-4b-worker-b-licensed/docs/phase-4b/worker-b-report.md
    checked_at: 2026-07-27
    supports: [go_nuts_behavior, propagated_damage_counting]

validation:
  quantity: {result: pass, available_pool_count: 30, game_deck_count: 30, quantity_sum: 30}
  usable_by: pass
  references: pass
  source_coverage: qualified
  semantic_structure: pass
  integration: requires_shared_extension
  fan_content: pass
