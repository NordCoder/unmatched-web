schema_version: 1
id: squirrel-girl
display_name: Squirrel Girl
set_ids: [marvel-teen-spirit]
status: blocked
movement: 2

topology:
  type: hero_with_sidekicks
  loss_rule: primary_hero_defeated
  fighters:
    - id: squirrel-girl
      display_name: Squirrel Girl
      role: hero
      count: 1
      attack_type: melee
      starting_health: 13
      starts_on_board: true
      summonable: false
    - id: squirrel
      display_name: Squirrel
      role: sidekick
      count: 8
      attack_type: melee
      starting_health: 1
      starts_on_board: false
      summonable: true
      occupancy_class: small
      runtime_identity: Each Squirrel token is a distinct fighter instance even though same-type Squirrels share printed statistics.

setup:
  hooks: []
  state_initialization:
    - {key: squirrels_in_reserve, value: 8}

ability:
  id: squirrel-summoning
  controller: owner
  effects:
    - id: start-turn-squirrel-placement
      trigger: turn_start
      optional: true
      condition: {legal_small_fighter_space_adjacent_to_squirrel-girl_exists: true}
      branches:
        - condition: {reserve_count: {squirrel: greater_than_0}}
          operations:
            - {op: SUMMON, pool: squirrel, destination_rule: legal_small_fighter_space_adjacent_to_squirrel-girl}
        - condition: {reserve_count: {squirrel: 0}}
          choices: [{owner: controller, choose: squirrel_on_battlefield}]
          operations:
            - {op: PLACE, target: chosen_squirrel, destination_rule: legal_small_fighter_space_adjacent_to_squirrel-girl}
      normalization_blocker: Current occupancy rules cannot define the legal shared-space destination domain for small fighters.

resources:
  - id: squirrel-reserve
    kind: token_pool
    visibility: public
    initial: 8

persistent_state:
  - key: squirrels_in_reserve
    type: integer
    reset: never

deck:
  manifest: ../../cards/phase-4b/squirrel-girl.yaml
  construction: fixed

rulings:
  - id: squirrel-girl-no-starting-squirrels
    summary: No Squirrels are placed during setup; the eight tokens begin off-board.
    source: https://restorationgames.com/wp-content/uploads/2023/02/UM-TS_Rules.pdf
  - id: squirrel-girl-summon-is-optional
    summary: At the start of each turn the controller may use the Squirrel placement ability; it is not mandatory.
    source: https://restorationgames.com/wp-content/uploads/2023/02/UM-TS_Rules.pdf
  - id: squirrel-girl-reposition-when-reserve-empty
    summary: If all eight Squirrels are already on the battlefield, the start-turn ability may reposition one existing Squirrel adjacent to Squirrel Girl instead of taking a token from reserve.
    source: https://restorationgames.com/wp-content/uploads/2023/02/UM-TS_Rules.pdf
  - id: squirrel-girl-empty-space-erratum
    summary: The printed rulebook's requirement to use an empty space is erroneous. Current ruling permits a Squirrel in a space with an opposing fighter or with three or fewer Squirrels, subject to small-fighter occupancy limits.
    source: https://gridbeast.gg/unmatched-rules-faq/
  - id: squirrel-girl-shared-damage-attribution
    summary: When shared-space small-fighter damage defeats multiple Squirrels, the damage is attributed to one Squirrel rather than independently multiplying damage-dealt triggers for every affected Squirrel.
    source: https://gridbeast.gg/unmatched-rules-faq/

sources:
  - type: official_product
    url: https://restorationgames.com/shop/marvel-teen-spirit-unmatched/
  - type: official_rulebook
    url: https://restorationgames.com/wp-content/uploads/2023/02/UM-TS_Rules.pdf
  - type: published_database
    url: https://unmatched.cards/umdb/decks/squirrel-girl
  - type: current_rulings_index
    url: https://www.the-unmatched.club/heroes/squirrel-girl
  - type: current_secondary_faq
    url: https://gridbeast.gg/unmatched-rules-faq/

normalization_notes:
  - Official Teen Spirit rules define Squirrels as small fighters: opposing and small fighters may move through each other, a small fighter may share a space with another fighter, and up to four small fighters may occupy one space in addition to an ordinary fighter.
  - A small fighter sharing a space with another fighter is adjacent to that fighter.
  - When a small fighter takes damage, each other small fighter of the same type in that space takes the same amount of damage.
  - Current ruling supersedes the printed word "empty" for Squirrel Girl's start-turn placement. The legal destination may already contain an opposing fighter or up to three Squirrels.

blockers:
  - id: semantic-extension-small-fighter-occupancy
    reason: The published rules plus current ruling require shared occupancy, occupancy capacity/compatibility, adjacency within a shared space, pass-through behavior, same-type co-located damage propagation and attribution, and a summon/place legality domain that can target an occupied space. Current generic battlefield occupancy/damage semantics do not encode these rules.