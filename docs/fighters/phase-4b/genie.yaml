schema_version: 1
id: genie
display_name: The Genie
set_ids:
- houdini-vs-genie
status: verified
movement: 3
topology:
  type: single_hero
  loss_rule: primary_hero_defeated
  fighters:
  - id: genie
    display_name: The Genie
    role: hero
    count: 1
    attack_type: ranged
    starting_health: 16
    starts_on_board: true
    summonable: false
setup:
  hooks: []
  state_initialization:
  - key: three_wishes_value_lock_active
    value: false
ability:
  id: three-wishes-in-spirit
  controller: owner
  effects:
  - id: discard-for-action
    trigger: turn_start
    optional: true
    costs:
    - op: DISCARD
      from_zone: hand
      selector: chosen_card
      count: 1
    operations:
    - op: GAIN_ACTION
      count: 1
  - id: three-wishes-value-lock
    trigger: static
    continuous: true
    condition:
      state_equals:
        three_wishes_value_lock_active: true
    operations:
    - op: SET_VALUE
      target: own_combat_card
      value: 4
      lock: true
      scope: rest_of_turn
resources: []
persistent_state:
- key: three_wishes_value_lock_active
  type: boolean
  reset: turn_end
  note: Set by the value-lock branch of Three Wishes; while active, every combat card played by the controller has current value 4 and later value changes are prevented for the rest of the turn.
deck:
  manifest: ../../cards/phase-4b/genie.yaml
  construction: fixed
rulings: []
sources:
- type: official_product
  url: https://restorationgames.com/shop/unmatched-houdini-genie/
- type: published_database
  url: https://unmatched.cards/umdb/decks/the-genie
- type: current_rulings_index
  url: https://www.the-unmatched.club/heroes/genie
normalization_notes:
- Three Wishes' value-lock option is a turn-scoped floating modifier represented by explicit persistent state plus a continuous SET_VALUE lock; it is not a one-card combat modifier.
