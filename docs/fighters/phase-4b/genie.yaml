schema_version: 1
id: genie
display_name: The Genie
set_ids: [houdini-vs-genie]
status: verified
verification:
  evidence: verified
  semantics: verified
  integration: ready
  policy: not_applicable
requires: []
movement: 3

topology:
  type: single_hero
  loss_rule: primary_hero_defeated
  fighters:
    - {id: genie, display_name: The Genie, role: hero, count: 1, attack_type: ranged, starting_health: 16, starts_on_board: true, summonable: false}

setup:
  hooks: []
  state_initialization: [{key: three_wishes_value_lock_active, value: false}]

ability:
  id: three-wishes-in-spirit
  controller: owner
  effects:
    - id: discard-for-action
      trigger: turn_start
      controller: controller
      cancellation: protected
      stages:
        - id: choose-card
          when: {hand_size_gte: 1}
          choices:
            - id: discard_card
              owner: controller
              visibility: private
              optional: true
              domain: {kind: card, zone: own_hand, count: 1}
              bind: discard_card
          costs: []
          operations: []
        - id: pay
          when: {bound: discard_card, exists: true}
          choices: []
          costs:
            - {id: discard_for_action, op: DISCARD, from_zone: hand, selector: {bound: discard_card}, count: 1, bind: discard_paid}
          operations: []
        - id: gain-action
          when: {result: discard_paid, equals: succeeded}
          choices: []
          costs: []
          operations: [{op: GAIN_ACTION, count: 1}]
    - id: three-wishes-value-lock
      trigger: static
      controller: controller
      cancellation: protected
      stages:
        - id: apply-lock
          when: {state_equals: {three_wishes_value_lock_active: true}}
          choices: []
          costs: []
          operations: [{op: SET_VALUE, target: own_combat_card, value: 4, lock: true, scope: rest_of_turn}]

resources: []
persistent_state:
  - {key: three_wishes_value_lock_active, type: boolean, reset: turn_end}

deck:
  manifest: ../../cards/phase-4b/genie.yaml
  construction: fixed

rulings: []
interpretations: []

sources:
  - id: genie-official-product
    authority: official
    url: https://restorationgames.com/shop/unmatched-houdini-genie/
    checked_at: 2026-07-27
    supports: [set_membership]
  - id: genie-umdb
    authority: published_umdb
    url: https://unmatched.cards/umdb/decks/the-genie
    checked_at: 2026-07-27
    supports: [fighter_stats, ability, deck_construction, three_wishes]
  - id: genie-rulings-index
    authority: secondary_cross_check
    url: https://www.the-unmatched.club/heroes/genie
    checked_at: 2026-07-27
    supports: [ability_cross_check]

validation:
  quantity: {result: pass, available_pool_count: 30, game_deck_count: 30, quantity_sum: 30}
  usable_by: pass
  references: pass
  source_coverage: verified
  semantic_structure: pass
  integration: ready
  fan_content: pass
