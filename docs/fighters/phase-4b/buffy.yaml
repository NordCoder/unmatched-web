  - {id: buffy-deck-index, authority: published_deck_index, url: https://unmatched.cards/umdb/decks/buffy, checked_at: 2026-07-27, supports: [deck_identity, card_metadata, sidekick_packages]}
  - {id: buffy-rulings, authority: official_ruling, url: https://how-to-play.s3.us-east-2.amazonaws.com/295564/rules/295564_rules.pdf, checked_at: 2026-07-27, supports: [setup_order, movement_scope]}
