schema_version: 1
id: buffy
display_name: Buffy
set_ids: [buffy-the-vampire-slayer]
status: verified
movement: 3

topology:
  type: hero_with_sidekicks
  loss_rule: primary_hero_defeated
  fighters:
    - {id: buffy, display_name: Buffy, role: hero, count: 1, attack_type: melee, starting_health: 14, starts_on_board: true, summonable: false}
    - {id: giles, display_name: Giles, role: sidekick, count: 1, attack_type: melee, starting_health: 6, starts_on_board: false, summonable: false, setup_selectable: true}
    - {id: xander, display_name: Xander, role: sidekick, count: 1, attack_type: melee, starting_health: 6, starts_on_board: false, summonable: false, setup_selectable: true}
setup:
  hooks:
    - stage: deck_construction
      note: Current Reference setup order resolves Buffy's sidekick choice and 30-card deck construction before shuffle/draw and before hero placement.
      pending_choice: {owner: controller, visibility: public, choose: [giles, xander]}
      operations:
        - {op: SET_STATE, key: selected_sidekick, value: chosen_value}
        - {op: CONSTRUCT_DECK, base_card_count: 25, selected_group_card_count: 5, final_count: 30}
  state_initialization: [{key: selected_sidekick, value: source_defined_setup_choice}]
ability:
  id: slayer
  controller: owner
  effects:
    - id: pass-through-opponents
      trigger: movement_rule
      continuous: true
      condition: {fighter: buffy}
      note: Buffy may move through spaces containing opposing fighters, including effect movement, but may not end movement in occupied spaces.
resources: []
persistent_state:
  - {key: selected_sidekick, type: fighter_ref, reset: never, visibility: public}
deck: {manifest: ../../cards/phase-4b/buffy.yaml, construction: choose_groups}
rulings:
  - id: buffy-sidekick-deck-group
    summary: Buffy has a 35-card published pool. Choose Giles or Xander before shuffle/draw, include only that sidekick's five-card group with the 25 base cards, and then continue setup under the current setup-order ruling.
    source: https://how-to-play.s3.us-east-2.amazonaws.com/295564/rules/295564_rules.pdf
sources:
  - {type: official_rulebook, url: https://restorationgames.com/wp-content/uploads/2020/11/UM-Buffy_the_Vampire_Slayer-Rules-two-page.pdf}
  - {type: published_deck_index, url: https://unmatched.cards/umdb/decks/buffy}
  - {type: current_reference, url: https://how-to-play.s3.us-east-2.amazonaws.com/295564/rules/295564_rules.pdf}
  - {type: official_rulings_archive, url: https://docs.google.com/document/d/13b-FbPq_vuqcc3IokeHvQ2ctJaDNZZuUaZmt4uft5h0/}
