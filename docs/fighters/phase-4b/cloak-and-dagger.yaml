schema_version: 1
id: cloak-and-dagger
display_name: Cloak and Dagger
set_ids: [marvel-teen-spirit]
status: verified
verification:
  evidence: verified
  semantics: verified
  integration: ready
  policy: not_applicable
requires: []
movement: 2

topology:
  type: multiple_heroes
  loss_rule: all_heroes_defeated
  fighters:
    - {id: cloak, display_name: Cloak, role: hero, count: 1, attack_type: melee, starting_health: 8, starts_on_board: true, summonable: false}
    - {id: dagger, display_name: Dagger, role: hero, count: 1, attack_type: melee, starting_health: 8, starts_on_board: true, summonable: false}

setup: {hooks: [], state_initialization: []}

ability:
  id: umbra-and-refraction
  controller: owner
  effects:
    - id: umbra
      trigger: after_combat
      controller: controller
      cancellation: protected
      stages:
        - id: choose-discard
          when: {attacker: cloak, combat_damage_dealt_gte: 2}
          choices:
            - id: opponent_discard
              owner: combat_opponent
              visibility: private
              optional: false
              domain: {kind: card, zone: combat_opponent_hand, count: 1}
              bind: opponent_discard
          costs: []
          operations: []
        - id: discard
          when: {bound: opponent_discard, exists: true}
          choices: []
          costs: []
          operations: [{op: DISCARD, controller: combat_opponent, from_zone: hand, selector: {bound: opponent_discard}, count: 1}]
    - id: refraction
      trigger: after_combat
      controller: controller
      cancellation: protected
      stages:
        - id: gain-action
          when: {attacker: dagger, combat_damage_dealt_gte: 2}
          choices: []
          costs: []
          operations: [{op: GAIN_ACTION, count: 1}]

resources: []
persistent_state: []

deck:
  manifest: ../../cards/phase-4b/cloak-and-dagger.yaml
  construction: fixed

rulings:
  - {id: multiple-heroes-loss, source_ref: cloak-dagger-rulings-index, summary: The character is defeated only when both Cloak and Dagger are defeated.}
interpretations: []

sources:
