normalization_notes:
- Opponent-held TRICK cards preserve owner_player=Loki while current_zone and zone controller change.
- Cleanup disposition depends on who played the Loki-owned TRICK; ownership alone is not sufficient to select the destination.
- A targeted web search across current Club rulings, current Reference, official Core Rules, indexed BGG material and other current transcriptions found no authoritative rule naming the recipient of a Loki-played non-combat TRICK in 2v2/FFA when multiple opponents are eligible. Svadilfari's Lure is the concrete unresolved evidence case.
- Project normalization for implementation is explicit but uncertain: Loki's controller chooses the receiving opponent among currently eligible opponents. This rule must be replaceable if a later authoritative ruling specifies a different chooser.
- The official FFA combat-card rule does not establish this chooser because it is explicitly scoped to effects on combat cards.
- END_TURN interaction is no longer an evidence gap: current Reference states that Loki's TRICK still reaches the opponent hand during Cleanup even when the turn was ended.
- The movement-value bonus is a proposed generic extension; corpus verification does not require modifying the shared model on this worker branch.
