rulings:
- id: loki-tricks-retain-owner
  summary: TRICK cards placed in opponents' hands remain Loki-owned card instances; zone/controller changes do not change ownership.
  source: https://www.the-unmatched.club/rules/loki
- id: loki-trick-play-cleanup
  summary: A TRICK played by Loki enters an opponent hand during cleanup; a Loki-owned TRICK played by an opponent enters Loki's discard during cleanup.
  source: https://www.the-unmatched.club/rules/loki
- id: loki-trick-boost
  summary: TRICK cards have no BOOST value and cannot provide a positive BOOST unless a source explicitly overrides that fact.
  source: https://www.the-unmatched.club/rules/loki
- id: loki-end-turn-cleanup
  summary: Loki-owned TRICK cards still use their special cleanup destination when a card effect ends the turn; END_TURN jumps to Cleanup rather than bypassing it.
  source: https://how-to-play.s3.us-east-2.amazonaws.com/295564/rules/295564_rules.pdf
- id: loki-multiplayer-trick-recipient-provisional
  status: uncertain_project_normalization
  summary: In multiplayer, when Loki plays a non-combat TRICK and more than one opponent is eligible, the project provisionally lets Loki's controller choose the receiving opponent. No authoritative ruling confirming this chooser was found in the targeted evidence pass.
  source: project_owner_decision_2026-07-27
