schema_version: 1
id: loki
display_name: Loki
set_ids: [battle-of-legends-vol-3]
status: partial
verification:
  evidence: qualified
  semantics: qualified
  integration: requires_shared_extension
  policy: ready
requires: [D-REQ-004, D-REQ-017]
movement: 2
topology:
  type: single_hero
  loss_rule: primary_hero_defeated
  fighters:
  - {id: loki, display_name: Loki, role: hero, count: 1, attack_type: melee, starting_health: 16, starts_on_board: true, summonable: false}
setup: {hooks: [], state_initialization: []}
ability:
  id: mischief-monger
  controller: owner
  effects:
  - id: trick-cleanup-replacement
    trigger: cleanup_replacement
    condition: {played_card_tag: trick, card_owner: loki}
    branches:
    - condition: {played_card_controller: loki}
      choices:
      - id: choose-trick-recipient
        owner: controller
        visibility: public
        optional: false
        domain: eligible_opponents
        bind: trick_recipient
      operations: [{op: MOVE_CARD, from_zone: resolution, to_zone: bound.trick_recipient.hand, selector: played_card}]
    - condition: {played_card_controller_not: loki}
      operations: [{op: MOVE_CARD, from_zone: resolution, to_zone: owner_discard, selector: played_card}]
  - id: trick-opponent-discard-recovery
    trigger: owned_card_discarded_from_opponent_hand
    optional: true
    condition: {card_owner: loki, card_tag: trick}
    choices:
    - {id: choose-trick-recovery-destination, owner: controller, visibility: private, optional: false, domain: [hand, deck_top], bind: destination}
    operations: [{op: MOVE_CARD, from_zone: opponent_hand_discard_transition, to_zone: bound.destination, selector: affected_card}]
  - id: trick-move-bonus
    trigger: static
    continuous: true
    requires: [D-REQ-004]
    modifier:
      kind: maneuver_movement_value
      target: loki
      amount_rule: count_loki_owned_trick_cards_in_opponents_hands
resources: []
persistent_state: []
deck:
  manifest: ../../cards/phase-4b/loki.yaml
  construction: fixed
interpretations:
- id: loki-noncombat-trick-recipient
  status: project_normalization
  confidence: medium
  behavior: >
    If multiple opponents are eligible, Loki controller chooses recipient.
  source_refs: [loki-core-ffa, loki-rules-hub, loki-reference-v10]
  replacement_condition: >
    Replace if authoritative multiplayer ruling specifies chooser.
rulings:
- id: loki-tricks-retain-owner
  summary: TRICK cards placed in opponents' hands remain Loki-owned card instances; zone/controller changes do not change ownership.
  source_ref: loki-rules-hub
- id: loki-trick-play-cleanup
  summary: A TRICK played by Loki enters an opponent hand during cleanup; a Loki-owned TRICK played by an opponent enters Loki's discard during cleanup.
  source_ref: loki-rules-hub
- id: loki-end-turn-cleanup
  summary: END_TURN enters Cleanup rather than bypassing Loki's TRICK destination replacement.
  source_ref: loki-reference-v10
