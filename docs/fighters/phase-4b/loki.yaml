schema_version: 1
id: loki
display_name: Loki
set_ids:
- battle-of-legends-vol-3
status: verified
movement: 2
topology:
  type: single_hero
  loss_rule: primary_hero_defeated
  fighters:
  - id: loki
    display_name: Loki
    role: hero
    count: 1
    attack_type: melee
    starting_health: 16
    starts_on_board: true
    summonable: false
setup:
  hooks: []
  state_initialization: []
ability:
  id: mischief-monger
  controller: owner
  effects:
  - id: trick-cleanup-replacement
    trigger: cleanup_replacement
    condition: {played_card_tag: trick, card_owner: loki}
    operations: [{op: MOVE_CARD, from_zone: resolution, to_zone: opponent_hand, selector: played_card}]
  - id: trick-opponent-discard-recovery
    trigger: owned_card_discarded_from_opponent_hand
    optional: true
    condition: {card_owner: loki, card_tag: trick}
    choices: [{owner: controller, choose: destination, options: [hand, deck_top]}]
    operations: [{op: MOVE_CARD, from_zone: opponent_hand_discard_transition, to_zone: chosen_destination, selector: affected_card}]
  - id: trick-move-bonus
    trigger: static
    continuous: true
    operations:
    - op: TRIGGER_COMPOSITE
      kind: source_defined_move_value_modifier
      amount_rule: count_loki_trick_cards_in_opponents_hands
resources: []
persistent_state: []
deck:
  manifest: ../../cards/phase-4b/loki.yaml
  construction: fixed
rulings:
- id: loki-tricks-retain-owner
  summary: TRICK cards placed in opponents' hands remain Loki-owned card instances; zone/controller changes do not change ownership.
  source: https://www.the-unmatched.club/rules/loki
- id: loki-trick-boost
  summary: TRICK cards have no BOOST value and cannot provide a positive BOOST unless a source explicitly overrides that fact.
  source: https://www.the-unmatched.club/rules/loki
