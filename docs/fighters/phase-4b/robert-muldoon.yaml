schema_version: 1
id: robert-muldoon
display_name: Robert Muldoon
set_ids: [jurassic-park-ingen-vs-raptors]
status: blocked
movement: 3

topology:
  type: hero_with_sidekicks
  loss_rule: primary_hero_defeated
  fighters:
    - {id: robert-muldoon, display_name: Robert Muldoon, role: hero, count: 1, attack_type: ranged, starting_health: 14, starts_on_board: true, summonable: false}
    - {id: ingen-worker, display_name: InGen Worker, role: sidekick, count: 3, attack_type: ranged, starting_health: 1, starts_on_board: true, summonable: false}
setup: {hooks: [], state_initialization: []}
ability:
  id: ingen-traps
  controller: owner
  effects:
    - id: place-trap
      trigger: turn_start
      optional: true
      note: Place one not-yet-used trap in an unoccupied fighter/token-free space in Muldoon's zone.
    - id: trigger-trap
      trigger: opposing_fighter_enters_trap_space
      note: Stop that movement immediately, deal 1 damage, move the triggered trap permanently to the box, then resolve Muldoon's draw-on-return ability.
resources:
  - {id: traps, kind: token_pool, visibility: public, initial: 8, max: 8, position_sensitive: true, lifecycle: [available, board, box], reusable_from_box: false}
persistent_state: []
deck: {manifest: ../../cards/phase-4b/robert-muldoon.yaml, construction: fixed}
rulings:
  - id: traps-do-not-trigger-friendly
    summary: Muldoon's own fighters may enter or pass through trap spaces without triggering them; opposing fighters trigger upon entering.
    source: https://restorationgames.com/wp-content/uploads/2020/05/UM-JP-Ingen_v_Raptors-rules-two-page.pdf
sources:
  - {type: official_product, url: https://restorationgames.com/shop/jurassic-park-ingen-vs-raptors-unmatched/}
  - {type: official_rulebook, url: https://restorationgames.com/wp-content/uploads/2020/05/UM-JP-Ingen_v_Raptors-rules-two-page.pdf}
  - {type: published_deck_index, url: https://unmatched.cards/umdb/decks/ingen}
blocker:
  reason: positioned_special_tokens_and_movement_interrupt_not_in_shared_effect_model
  note: Trap availability must be derived from token-instance lifecycle rather than a duplicate traps_available integer. A triggered/removed trap goes to the box permanently and is not reusable.
  report: ../../phase-4b/worker-a-report.md