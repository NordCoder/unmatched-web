schema_version: 1
id: raphael
display_name: Raphael
set_ids: [tmnt-adventures]
status: partial
verification:
  evidence: verified
  semantics: verified
  integration: requires_shared_extension
  policy: ready
requires: [D-REQ-001]
movement: 2
topology:
  type: hero_with_sidekicks
  loss_rule: primary_hero_defeated
  fighters:
  - {id: raphael, display_name: Raphael, role: hero, count: 1, attack_type: melee, starting_health: 17, starts_on_board: true, summonable: false}
  - {id: casey-jones, display_name: Casey Jones, role: sidekick, count: 1, attack_type: ranged, starting_health: 8, starts_on_board: true, summonable: false}
setup:
  hooks: []
  state_initialization:
  - {key: anger_issues_used_this_turn, value: false}
  - {key: lost_combat_this_turn, value: false}
  - {key: break_something_canceled_this_combat, value: false}
ability:
  id: anger-issues
  controller: owner
  effects:
  - id: record-combat-loss
    trigger: after_combat
    condition: {controller_lost_combat: true}
    operations: [{op: SET_STATE, key: lost_combat_this_turn, value: true}]
  - id: anger-issues-action
    trigger: after_combat
    condition: {active_player: owner, combat_result: lost, state: anger_issues_used_this_turn, equals: false}
    operations: [{op: GAIN_ACTION, count: 1}, {op: SET_STATE, key: anger_issues_used_this_turn, value: true}]
resources: []
persistent_state:
- {key: anger_issues_used_this_turn, type: boolean, reset: turn_start}
- {key: lost_combat_this_turn, type: boolean, reset: turn_start}
- {key: break_something_canceled_this_combat, type: boolean, reset: combat_start}
deck:
  manifest: ../../cards/phase-4b/raphael.yaml
  construction: fixed
rulings: []
sources:
- id: tmnt-set-rules
  authority: official_set_rules
  url: https://iellogames.com/wp-content/uploads/2026/01/UMA-TMNT_Set-rules_EN_Light.pdf
  checked_at: '2026-07-27'
  supports: [fighter_stats, ability, deck_allocation]
  durability: durable
- id: tmnt-product
  authority: official_component
  url: https://restorationgames.com/shop/unmatched-adventures-teenage-mutant-ninja-turtles/
  checked_at: '2026-07-27'
  supports: [release_membership]
  durability: durable
- id: raphael-club
  authority: reference
  url: https://www.the-unmatched.club/heroes/raphael
  checked_at: '2026-07-27'
  supports: [deck_visual_transcription]
validation:
  quantity: {result: PASS, available_pool_count: 30, game_deck_count: 30, quantity_sum: 30}
  usable_by: PASS
  references: PASS
  source_coverage: PASS
  semantic_structure: PASS
  integration: REQUIRES_SHARED_EXTENSION
  fan_content: PASS
normalization_notes:
- lost_combat_this_turn is historical state for Payback Time.
- break_something_canceled_this_combat persists the actual cancellation outcome across combat timing windows; the deck uses D-REQ-001 result bindings rather than an opaque cancellation handler.
- Only competitive Raphael/Casey behavior is modeled.