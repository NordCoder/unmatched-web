schema_version: 1
id: george-washington
display_name: George Washington
set_ids: [stars-and-stripes]
status: verified
movement: 2
topology:
  type: hero_with_sidekicks
  loss_rule: primary_hero_defeated
  fighters:
  - {id: george-washington, display_name: George Washington, role: hero, count: 1, attack_type: melee, starting_health: 14, starts_on_board: true, summonable: false}
  - id: culper-spy
    display_name: Culper Spy
    role: sidekick
    count: 3
    attack_type: melee
    starting_health: 1
    starts_on_board: true
    summonable: true
    runtime_identity: Each Culper Spy token is a distinct one-health fighter instance and may be returned after defeat when a source allows it.
setup:
  hooks: []
  state_initialization: []
ability:
  id: espionage
  controller: owner
  effects:
  - id: espionage-ruse
    trigger: attack_declared_pre_defense
    optional: true
    condition: {resource: ruse-tokens, ready_gte: 1}
    operations: [{op: TRIGGER_COMPOSITE, kind: source_defined_ruse_attachment_and_veto}]
resources:
- id: ruse-tokens
  kind: token_pool
  visibility: public
  initial: 4
  runtime_state:
    per_token_states: [ready, attached_to_current_attack, used]
    initial_state: ready
    use_rule: ready_to_attached_before_defense_choice
    veto_rule: defender_random_discard_removes_attachment_before_defense_choice
    post_attack_rule: used
    regain_rule: used_to_ready
persistent_state: []
deck:
  manifest: ../../cards/phase-4b/george-washington.yaml
  construction: fixed
rulings:
- id: ruse-pre-defense-window
  summary: A ready ruse may be committed before the defender chooses whether to defend; the defender may discard a random card to remove the ruse before choosing a defense card.
  source: https://restorationgames.com/wp-content/uploads/2025/08/UM-Stars-Stripes_Rulebook-FLAT.pdf
- id: ruse-ready-used-lifecycle
  summary: Ruse tokens begin ready; using a token makes it unavailable until a source regains it. Card effects marked as ruse effects resolve only if the ruse remains associated with that attack after the defender's removal opportunity.
  source: https://restorationgames.com/wp-content/uploads/2025/08/UM-Stars-Stripes_Rulebook-FLAT.pdf
sources:
- {authority: official_component, url: https://restorationgames.com/shop/unmatched-stars-and-stripes/, checked_at: '2026-07-27'}
- {authority: official_set, url: https://restorationgames.com/wp-content/uploads/2025/08/UM-Stars-Stripes_Rulebook-FLAT.pdf, checked_at: '2026-07-27'}
- {authority: official_component, url: https://restorationgames.com/gameplay-of-unmatched-stars-and-stripes/, checked_at: '2026-07-27', note: Confirms pre-defense ruse commitment and bluffing semantics.}
- {authority: reference, url: https://www.the-unmatched.club/heroes/george-washington, checked_at: '2026-07-27', note: Fighter ability and current visual card corpus.}
normalization_notes:
- Culper Spies are summonable because Recruit to the Ring can return defeated Spies.
- Ruse tokens require per-token ready/used state plus a combat-scoped attachment marker; a scalar token count alone is insufficient for reconnect-safe execution.
- Ruse attachment/veto remains an explicit pre-defense composite pending shared combat-marker semantics.
