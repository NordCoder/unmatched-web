schema_version: 1
id: golden-bat
display_name: Golden Bat
set_ids: [tales-to-amaze]
status: partial
verification:
  evidence: verified
  semantics: verified
  integration: requires_shared_extension
  policy: ready
requires: [C-REQ-013]
movement: 3

topology:
  type: single_hero
  loss_rule: primary_hero_defeated
  fighters:
    - {id: golden-bat, display_name: Golden Bat, role: hero, count: 1, attack_type: melee, starting_health: 18, starts_on_board: true, summonable: false}

setup:
  hooks: []
  state_initialization:
    - {key: maneuver_actions_taken_this_turn, value: 0}
    - {key: turn_start_space, value: current_space}

ability:
  id: the-first-superhero
  controller: owner
  effects:
    - id: attack-before-maneuver-bonus
      trigger: static
      controller: owner
      cancellation: source_defined
      continuous: true
      stages:
        - id: apply
          when: {attacker: golden-bat, maneuver_actions_taken_this_turn: 0}
          operations: [{op: ADD_VALUE, target: golden_bat_attack, amount: 2}]

resources: []
persistent_state:
  - {key: maneuver_actions_taken_this_turn, type: integer, reset: turn_start}
  - {key: turn_start_space, type: space_ref, reset: turn_start}

deck:
  manifest: ../../cards/phase-4b/golden-bat.yaml
  construction: fixed

rulings: []
sources:
  - {id: tta-set-rules-golden-bat, authority: official_set_rules, url: https://iellogames.com/wp-content/uploads/2024/02/UN-Adventures_Set-rules_EN_Light.pdf, checked_at: 2026-07-27, supports: [competitive hero context]}
  - {id: golden-bat-deck-index, authority: published_deck_index, url: https://unmatched.cards/umdb/decks/golden-bat, checked_at: 2026-07-27, supports: [fighter metadata, published deck corpus]}
  - {id: golden-bat-rulings, authority: secondary_crosscheck, url: https://www.the-unmatched.club/heroes/golden-bat, checked_at: 2026-07-27, supports: [current hero ruling index]}

validation:
  quantity: {result: pass, available_pool_count: 30, game_deck_count: 30, quantity_sum: 30}
  usable_by: pass
  references: pass
  source_coverage: pass
  semantic_structure: pass
  integration: requires_shared_extension
  fan_content: pass

normalization_notes:
  - The ability depends on action history, not current position or whether a maneuver changed any fighter position.
  - Competitive hero behavior only; Adventures enemy/scenario state is excluded.
