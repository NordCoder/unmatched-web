normalization_notes:
- Audit correction: Hell on Wheels is normalized as the maneuver's replacement movement, up to 4 spaces, after any optional movement BOOST; spending Hellfire fixes the effective move value at 4 rather than adding to a BOOST.
- Audit correction: turn-start position is explicit persistent historical state for The Wicked Will Burn, following FIGHTER-SCHEMA-005.
