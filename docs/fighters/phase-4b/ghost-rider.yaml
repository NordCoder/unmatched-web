      - may_move_through_opposing_fighters
      - ignore_maneuver_boost_for_move_value
    - op: DEAL_EFFECT_DAMAGE
      target: each_opposing_fighter_moved_through
      amount: 1
    dependency: movement_override_and_damage_only_if_hellfire_cost_was_paid
