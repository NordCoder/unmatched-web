rulings:
- id: hellfire-move-cap
  summary: After spending Hellfire for the maneuver ability, the movement value is 4 and cannot be increased by a movement BOOST.
  source: https://unmatched.cards/umdb/decks/ghost-rider
sources:
- type: official_product
