      trigger: maneuver_after_boost
      controller: controller
      cancellation: protected
      stages:
        - id: decide
          when: {boosted_fighter: houdini}
          choices:
            - id: use_teleport
              owner: controller
              visibility: public
              optional: true
              domain: {kind: boolean, meaning: replace_maneuver_movement_with_placement}
              bind: use_teleport
          costs: []
          operations: []
        - id: choose-destination
          when: {bound: use_teleport, equals: true}
          choices:
            - id: destination
              owner: controller
              visibility: public
              optional: false
              domain: {kind: space, selector: any_selectable_space_for_place}
              bind: destination
          costs: []
          operations: []
        - id: place
          when: {bound: destination, exists: true}
          choices: []
          costs: []
          operations: [{op: PLACE, target: houdini, destination: {bound: destination}, replacement_for: maneuver_movement}]

