schema_version: 1
id: eredin
display_name: Eredin
set_ids: [witcher-realms-fall]
status: verified
movement: 2

topology:
  type: hero_with_sidekicks
  loss_rule: primary_hero_defeated
  fighters:
    - {id: eredin, display_name: Eredin, role: hero, count: 1, attack_type: melee, starting_health: 14, starts_on_board: true, summonable: false}
    - {id: red-rider, display_name: Red Rider, role: sidekick, count: 4, attack_type: melee, starting_health: 1, starts_on_board: true, summonable: false}

setup: {hooks: [], state_initialization: []}

ability:
  id: king-of-the-wild-hunt
  controller: owner
  effects:
    - id: enraged-state
      trigger: static
      continuous: true
      condition: {all_red_riders_defeated: true}
      operations:
        - {op: ADD_VALUE, target: controller_combat_cards, amount: 1}
        - {op: TRIGGER_COMPOSITE, kind: continuous_attribute_modifier, target: eredin, attribute: move_value, set_value: 3, source_lifetime: while_condition_true}

resources: []
persistent_state:
  - {key: enraged, type: boolean, reset: never, derivation: all_red_rider_instances_defeated}

deck:
  manifest: ../../cards/phase-4b/eredin.yaml
  construction: fixed

rulings:
  - id: enraged-is-derived
    summary: Eredin is enraged only while every Red Rider is defeated; returning a Rider makes the condition false again.
    source: https://www.the-unmatched.club/heroes/eredin

sources:
  - {type: official_set_rules, url: https://restorationgames.com/wp-content/uploads/2024/10/UM-W-RF-Set-Rules.pdf}
  - {type: published_deck_index, url: https://unmatched.cards/umdb/decks/eredin}
  - {type: current_rulings_index, url: https://www.the-unmatched.club/heroes/eredin}

normalization_notes:
  - Foul Purpose and Implacable alter legal combat-card play modes before ordinary combat effects. They share the generic combat-play-mode proposal in the Worker C report.
  - Eredin's +1 combat value and move value 3 are derived continuous modifiers while all Riders are defeated; they must disappear immediately when a Rider returns. Move-value handling uses C-EXT-011 rather than permanent SET_STATE mutation.
