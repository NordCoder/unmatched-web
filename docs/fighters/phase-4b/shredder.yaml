schema_version: 1
id: shredder
display_name: Shredder
set_ids: [tmnt-shredder-krang-hero-decks]
status: verified
movement: 3
topology:
  type: hero_with_sidekicks
  loss_rule: primary_hero_defeated
  fighters:
  - {id: shredder, display_name: Shredder, role: hero, count: 1, attack_type: melee, starting_health: 15, starts_on_board: true, summonable: false}
  - {id: bebop, display_name: Bebop, role: sidekick, count: 1, attack_type: melee, starting_health: 7, starts_on_board: true, summonable: true}
  - {id: rocksteady, display_name: Rocksteady, role: sidekick, count: 1, attack_type: melee, starting_health: 7, starts_on_board: true, summonable: true}
setup:
  hooks: []
  state_initialization: []
ability:
  id: master-of-the-clan
  controller: owner
  effects:
  - id: deploy-foot-soldier
    trigger: start_turn
    operations: [{op: TRIGGER_COMPOSITE, kind: source_defined_path_token_deployment, resource: foot-soldiers, adjacent_to: friendly_fighter}]
  - id: foot-soldier-attack-network
    trigger: static
    continuous: true
    operations: [{op: TRIGGER_COMPOSITE, kind: source_defined_attack_targeting_via_path_token}]
  - id: boosted-maneuver-removal
    trigger: opponent_boosted_maneuver
    optional: true
    operations: [{op: TRIGGER_COMPOSITE, kind: source_defined_remove_traversed_path_tokens, mover_role: opponent_hero}]
resources:
- id: foot-soldiers
  kind: token_pool
  visibility: public
  initial: 24
  runtime_state:
    per_token_states: [supply, deployed]
    deployed_anchor: path_ref
    occupancy_rule: at_most_one_foot_soldier_per_path
    removal_destination: supply
persistent_state: []
deck:
  manifest: ../../cards/phase-4b/shredder.yaml
  construction: fixed
rulings:
- id: shredder-sidekick-revival
  summary: Back to Work can recover Bebop and Rocksteady even if they were defeated, then places them as close as possible to Shredder.
  source: https://www.the-unmatched.club/heroes/shredder
- id: shredder-path-token-rulings
  summary: Foot Soldiers occupy paths. Only an opposing hero moving during a boosted maneuver may remove traversed Foot Soldiers; sidekicks and effect movement cannot. Removed tokens return to supply.
  source: https://www.the-unmatched.club/rules/shredder
sources:
- {authority: official_component, url: https://restorationgames.com/shop/unmatched-adventures-teenage-mutant-ninja-turtles-shredder-krang-hero-decks/, checked_at: '2026-07-27'}
- {authority: reference, url: https://www.the-unmatched.club/heroes/shredder, checked_at: '2026-07-27', note: Visual competitive Hero Deck corpus transcribed from Club card images supplied during reconciliation.}
- {authority: reference, url: https://www.the-unmatched.club/rules/shredder, checked_at: '2026-07-27'}
normalization_notes:
- Bebop and Rocksteady are summonable runtime instances because Back to Work explicitly returns defeated sidekicks.
- Every deployed Foot Soldier is a concrete token instance anchored to a path_ref; a scalar deployed count is derived state only.
- Foot Soldier edge/path semantics remain source-defined composites pending shared path_ref integration.
- Adventures villain deck, threat state, initiative logic and scenario AI are excluded.
