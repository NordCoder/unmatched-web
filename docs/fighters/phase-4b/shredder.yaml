normalization_notes:
- Bebop & Rocksteady are one canonical sidekick fighter instance with one token and one 7-health dial; modeling Bebop and Rocksteady as two independently damageable fighters is invalid.
- The combined sidekick is summonable because Back to Work can return it after defeat.
- Every deployed Foot Soldier is a concrete token instance anchored to a path_ref; a scalar deployed count is derived state only.
- A deployed Foot Soldier survives disappearance of its path_ref. The token remains deployed for count-based effects such as Perplexing Tactics but is dormant for adjacency/path effects while that path is absent. If the path returns, the existing token becomes effective on that path again without redeployment.
- Point Pleasant follows the same disappearing-path rule, but a path removed there never returns; competitive setup may independently omit those bridge paths under current map rules.
- Foot Soldier edge/path semantics remain source-defined composites pending shared path_ref lifecycle integration; the gameplay evidence is now complete.
- Adventures villain deck, threat state, initiative logic and scenario AI are excluded.
