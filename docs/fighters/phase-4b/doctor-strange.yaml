set_ids: [marvel-brains-and-brawn]
status: verified
verification:
  evidence: verified
  semantics: verified
  integration: ready
  policy: not_applicable
requires: []
movement: 2

topology:
  type: hero_with_sidekicks
  loss_rule: primary_hero_defeated
  fighters:
    - {id: doctor-strange, display_name: Doctor Strange, role: hero, count: 1, attack_type: ranged, starting_health: 14, starts_on_board: true, summonable: false}
    - {id: wong, display_name: Wong, role: sidekick, count: 1, attack_type: ranged, starting_health: 6, starts_on_board: true, summonable: false}

setup: {hooks: [], state_initialization: []}

ability:
  id: dark-pact
  controller: owner
  effects:
    - id: recycle-resolved-combat-card
      trigger: after_combat_card_fully_resolved
      controller: controller
      cancellation: protected
      stages:
        - id: decide
          when: {card_played_by: doctor-strange}
          choices:
            - id: use_dark_pact
              owner: controller
              visibility: public
              optional: true
              domain: {kind: boolean, meaning: pay_one_health_to_recycle_card}
              bind: use_dark_pact
          costs: []
          operations: []
        - id: pay
          when: {bound: use_dark_pact, equals: true}
          choices: []
          costs:
            - {id: dark_pact_damage, op: DEAL_EFFECT_DAMAGE, target: doctor-strange, amount: 1, bind: dark_pact_paid}
          operations: []
        - id: recycle
          when: {result: dark_pact_paid, equals: succeeded}
          choices: []
          costs: []
          operations:
            - {op: MOVE_CARD, from_zone: combat_cleanup_source, to_zone: deck_bottom, selector: played_doctor_strange_card}
            - {op: DRAW, count: 1}

