    - {id: maria-hill, display_name: Maria Hill, role: sidekick, count: 1, attack_type: ranged, starting_health: 6, starts_on_board: true, summonable: false}

setup:
  hooks:
    - id: seed-moscow-protocol
      stage: pre_shuffle_deck_setup
      controller: controller
      cancellation: protected
      stages:
        - id: seed
          when: always
          choices: []
          costs: []
          operations:
            - {op: MOVE_CARD, from_zone: deck_pool, to_zone: hand, selector: {definition_id: the-moscow-protocol}}
            - {op: SHUFFLE, zone: deck}
            - {op: DRAW, count: 5}
  state_initialization:
    - {key: opposing_fighter_took_damage_this_turn, value: false}
    - {key: black_widow_starting_space, value_ref: match_setup.black_widow_starting_space}

ability:
  id: missions
  controller: owner
  effects:
    - id: record-opposing-fighter-damage
      trigger: fighter_damaged
      controller: controller
      cancellation: protected
      stages:
        - id: record
          when: {damaged_fighter_relation: opposing}
          choices: []
          costs: []
          operations: [{op: SET_STATE, key: opposing_fighter_took_damage_this_turn, value: true}]

resources: []
persistent_state:
  - {key: opposing_fighter_took_damage_this_turn, type: boolean, reset: turn_start}
  - {key: black_widow_starting_space, type: space_ref, reset: never}

