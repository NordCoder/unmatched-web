schema_version: 1
id: krang
display_name: Krang
set_ids: [tmnt-shredder-krang-hero-decks]
status: verified
movement: 1
topology:
  type: single_hero
  loss_rule: primary_hero_defeated
  fighters:
  - {id: krang, display_name: Krang, role: hero, count: 1, attack_type: melee, starting_health: 16, starts_on_board: true, summonable: false}
setup:
  hooks: []
  state_initialization:
  - {key: active_doomsday_machines, value: 1}
ability:
  id: dooooom
  controller: owner
  effects:
  - id: machine-move-modifier
    trigger: static
    continuous: true
    operations: [{op: TRIGGER_COMPOSITE, kind: source_defined_move_value_modifier, amount_rule: active_doomsday_machine_count}]
  - id: ultimate-destruction-reroll
    trigger: after_source_defined_die_roll
    optional: true
    condition: {state: active_doomsday_machines, gte: 1}
    operations:
    - {op: CHANGE_STATE, key: active_doomsday_machines, transition: minus_one}
    - {op: TRIGGER_COMPOSITE, kind: source_defined_reroll_die, die: die-of-ultimate-destruction}
resources:
- {id: doomsday-machines, kind: token_pool, visibility: public, initial: 3}
- id: die-of-ultimate-destruction
  kind: external_definition_pool
  visibility: public
  initial: physical_die_from_tmnt_base_set
  rules:
  - Roll separately for each destruction-die symbol resolved.
  - Use the numbered result for that symbol.
  - An X counts as zero and the effect associated with that roll does not resolve.
  - After a roll, Krang may deactivate an active Doomsday Machine to reroll; this can repeat while active machines remain.
persistent_state:
- {key: active_doomsday_machines, type: integer, reset: never}
deck:
  manifest: ../../cards/phase-4b/krang.yaml
  construction: fixed
rulings: []
sources:
- {authority: official_component, url: https://restorationgames.com/shop/unmatched-adventures-teenage-mutant-ninja-turtles-shredder-krang-hero-decks/, checked_at: '2026-07-27'}
- {authority: reference, url: https://tesera.ru/images/items/2594660/UMA-TMNT-Shredder_and_Krang_Rules_pages_lr.pdf, checked_at: '2026-07-27', note: Published set-rules mirror used to reconcile Ultimate Destruction symbol, X result, separate rolls and reroll procedure.}
- {authority: reference, url: https://www.the-unmatched.club/heroes/krang, checked_at: '2026-07-27', note: Visual competitive Hero Deck corpus transcribed from Club card images supplied during reconciliation.}
normalization_notes:
- The competitive Hero Deck uses the base TMNT physical Die of Ultimate Destruction but does not import Adventures villain AI/scenario logic.
- Dynamic destruction-die BOOST symbols require a schema extension beyond numeric/null BOOST; card manifests preserve them with boost_rule.
