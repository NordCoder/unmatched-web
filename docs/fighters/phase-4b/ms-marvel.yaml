  id: stretchy
  controller: owner
  effects:
  - id: start-turn-move
    trigger: turn_start
    optional: true
    operations:
    - op: MOVE
      target: ms-marvel
      max_distance: 1
  - id: extended-attack-range
    trigger: static
    continuous: true
    normalization_blocker: Ms. Marvel attacks by graph distance up to 2 while ignoring zones. Phase 4A has standard melee/ranged-zone legality but no reusable graph-distance attack-legality modifier; encoding an undocumented structured object in SET_STATE would not satisfy the shared-model validation contract.
resources: []
persistent_state:
- key: turn_start_space
  type: space_ref
  reset: turn_start
  note: Required by Momentous Shift; current position alone cannot reconstruct whether Ms. Marvel started the turn in a different space.
deck:
  manifest: ../../cards/phase-4b/ms-marvel.yaml
  construction: fixed
rulings:
- id: stretchy-range
  summary: Ms. Marvel may attack a fighter up to 2 spaces away by space distance, ignoring zones.
  source: https://unmatched.cards/umdb/decks/ms-marvel
sources:
- type: official_product
  url: https://restorationgames.com/shop/marvel-teen-spirit-unmatched/
- type: published_database
  url: https://unmatched.cards/umdb/decks/ms-marvel
- type: current_rulings_index
  url: https://www.the-unmatched.club/heroes/ms-marvel
normalization_notes:
- Audit correction: Stretchy's start-of-turn move is optional and is an up-to-1 movement.
- Audit correction: Momentous Shift's turn-start comparison is backed by explicit historical state, following FIGHTER-SCHEMA-005.
blockers:
- id: semantic-extension-spatial-attack-range
  reason: A reusable attack-legality modifier is required for graph-distance attacks that ignore zones. The previous attack_range_rule object was stored in an enum-typed persistent state and had no shared semantic contract.
