sources:
  - {type: official_rulebook, url: https://restorationgames.com/wp-content/uploads/2020/11/UM-Buffy_the_Vampire_Slayer-Rules-two-page.pdf}
  - {type: current_rulings_index, url: https://www.the-unmatched.club/heroes/spike}
  - {type: published_deck_index, url: https://unmatched.cards/umdb/decks/spike}
blocker:
