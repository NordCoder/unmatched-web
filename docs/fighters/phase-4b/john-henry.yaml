schema_version: 1
id: john-henry
display_name: John Henry
set_ids: [stars-and-stripes]
status: partial
verification:
  evidence: verified
  semantics: verified
  integration: requires_shared_extension
  policy: ready
requires: [D-REQ-003, D-REQ-004, D-REQ-007]
movement: 2
topology:
  type: single_hero
  loss_rule: primary_hero_defeated
  fighters:
  - {id: john-henry, display_name: John Henry, role: hero, count: 1, attack_type: melee, starting_health: 17, starts_on_board: true, summonable: false}
setup:
  hooks: []
  state_initialization:
  - {key: john_henry_paths_used_this_turn, value: []}
ability:
  id: steel-driving-man
  controller: owner
  effects:
  - id: lay-track
    trigger: start_turn
    requires: [D-REQ-007]
    choices:
    - {id: choose-track-destination, owner: controller, visibility: public, optional: false, domain: open_spaces_in_john_henry_zone, bind: destination}
    operations:
    - op: CHANGE_STATE
      resource: track-tokens
      transition: deploy_or_relocate_one
      destination: bound.destination
  - id: track-movement-cost
    trigger: static
    continuous: true
    condition: {movement_controller: owner}
    requires: [D-REQ-004, D-REQ-007]
    modifier:
      kind: movement_space_cost
      target: john-henry
      marked_spaces_resource: track-tokens
      rule: entering_or_moving_through_marked_space_does_not_count_toward_distance_as_published
  - id: record-distinct-paths
    trigger: john_henry_moves
    requires: [D-REQ-007]
    operations:
    - op: CHANGE_STATE
      key: john_henry_paths_used_this_turn
      transition: union_with_traversed_path_refs
resources:
- id: track-tokens
  kind: token_pool
  visibility: public
  initial: 10
  runtime_state:
    requires: [D-REQ-007]
    per_token_states: [off_board, deployed]
    initial_state: off_board
    deployed_anchor: space_ref
    transition:
      deploy_or_relocate_one: use_off_board_token_if_available_else_choose_deployed_token_to_relocate
persistent_state:
- {key: john_henry_paths_used_this_turn, type: path_ref_set, reset: turn_start}
deck:
  manifest: ../../cards/phase-4b/john-henry.yaml
  construction: fixed
rulings:
- id: track-summon-supply-exhaustion
  summary: At start of turn place an off-board track token if available; if all ten are deployed, relocate one deployed token instead.
  source_ref: stars-rules
- id: opponent-movement-track-benefit
  summary: An opponent moving John Henry does not receive his track movement benefit.
  source_ref: stars-rules
sources:
- id: stars-rules
  authority: official_set_rules
  url: https://restorationgames.com/wp-content/uploads/2025/08/UM-Stars-Stripes_Rulebook-FLAT.pdf
