schema_version: 1
id: tomoe-gozen
display_name: Tomoe Gozen
set_ids: [suns-origin]
status: verified
movement: 2

topology:
  type: single_hero
  loss_rule: primary_hero_defeated
  fighters:
    - {id: tomoe-gozen, display_name: Tomoe Gozen, role: hero, count: 1, attack_type: ranged, starting_health: 14, starts_on_board: true, summonable: false}

setup: {hooks: [], state_initialization: []}

ability:
  id: attack-of-opportunity
  controller: owner
  effects:
    - id: damage-hero-leaving-zone
      trigger: fighter_leaves_zone
      condition: {fighter: opposing_hero, zone_owner: tomoe-gozen}
      operations: [{op: DEAL_EFFECT_DAMAGE, target: triggering_hero, amount: 1}]

resources: []
persistent_state: []

deck:
  manifest: ../../cards/phase-4b/tomoe-gozen.yaml
  construction: fixed

rulings:
  - id: leaving-zone-is-event-semantic
    summary: The ability applies whenever an opposing hero leaves Tomoe's zone through movement, placement, or removal from the board, including multiple times in one effect; it does not trigger merely because Tomoe herself moved and changed the zone relationship, and it never applies to sidekicks.
    source: https://restorationgames.com/wp-content/uploads/2024/01/UM-SO-Set-Rules.pdf

sources:
  - {type: official_product, url: https://restorationgames.com/shop/suns-origin-unmatched/}
  - {type: official_set_rules, url: https://restorationgames.com/wp-content/uploads/2024/01/UM-SO-Set-Rules.pdf}
  - {type: published_deck_index, url: https://unmatched.cards/umdb/decks/tomoe-gozen}
  - {type: secondary_crosscheck, url: https://www.unmatchedarena.com/heroes/tomoe-gozen}

normalization_notes:
  - Attack of Opportunity consumes the existing relocation transition facts required by `docs/mechanics/movement-and-placement.md` (`left_zone` / `removed_from_board`); Tomoe does not require a second parallel zone-event primitive.
  - Witness My Last Battle has declaration-time target and face-up-play rules. These use the reusable combat-play-mode proposal in the Worker C report rather than a Tomoe-only engine branch.
