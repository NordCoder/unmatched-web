schema_version: 1
id: ancient-leshen
display_name: Ancient Leshen
set_ids: [witcher-steel-and-silver]
status: verified
movement: source_defined_by_fighter

topology:
  type: hero_with_sidekicks
  loss_rule: primary_hero_defeated
  fighters:
    - {id: ancient-leshen, display_name: Ancient Leshen, role: hero, count: 1, attack_type: ranged, starting_health: 13, move_value: 1, starts_on_board: true, summonable: false}
    - {id: wolf, display_name: Wolf, role: sidekick, count: 2, attack_type: melee, starting_health: 1, move_value: 3, starts_on_board: true, summonable: true}

setup:
  hooks: []
  state_initialization:
    - {key: ancient_leshen_attacked_this_turn, value: false}

ability:
  id: heart-of-the-forest
  controller: owner
  effects:
    - id: repeat-attack-bonus
      trigger: static
      continuous: true
      condition: {attacker: ancient-leshen, ancient_leshen_attacked_earlier_this_turn: true}
      operations: [{op: ADD_VALUE, target: leshen_attack, amount: 3}]

resources: []
persistent_state:
  - {key: ancient_leshen_attacked_this_turn, type: boolean, reset: turn_start}
  - {key: left_space_this_turn_by_fighter, type: fighter_instance_boolean_map, reset: turn_start}

deck:
  manifest: ../../cards/phase-4b/ancient-leshen.yaml
  construction: fixed

rulings:
  - id: wolves-do-not-arm-leshen-bonus
    summary: A Wolf attack does not count as the Ancient Leshen having attacked; the +3 applies only after the Leshen itself attacked earlier that turn.
    source: https://www.the-unmatched.club/heroes/ancient-leshen
  - id: summon-wolf-placement
    summary: If a Wolf is off-board, Summon returns one; if both Wolves are already on the board, choose one and place it according to the Summon effect.
    source: https://restorationgames.com/wp-content/uploads/2024/10/UM-W-SaS-Set-Rules.pdf

sources:
  - {type: official_set_rules, url: https://restorationgames.com/wp-content/uploads/2024/10/UM-W-SaS-Set-Rules.pdf}
  - {type: published_deck_index, url: https://unmatched.cards/umdb/decks/ancient-leshen}
  - {type: current_rulings_index, url: https://www.the-unmatched.club/heroes/ancient-leshen}

normalization_notes:
  - Ancient Leshen and Wolves have different base move values (1 and 3 respectively); movement is fighter-definition data, not a permanent SET_STATE mutation. This uses C-EXT-011.
  - Per-turn movement history is keyed by runtime fighter instance; a shared boolean would conflate the Leshen and two Wolves. This uses C-EXT-010.
  - Vanish Into Murder's temporary-off-board state is owned by the C-EXT-007 scheduled-removal context; no parallel boolean mirror is authoritative.
