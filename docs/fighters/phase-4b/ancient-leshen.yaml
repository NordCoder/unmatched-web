schema_version: 1
id: ancient-leshen
display_name: Ancient Leshen
set_ids: [witcher-steel-and-silver]
status: partial
verification:
  evidence: qualified
  semantics: qualified
  integration: requires_shared_extension
  policy: not_applicable
requires: [C-REQ-007, C-REQ-010, C-REQ-011, C-REQ-013]
movement: source_defined_by_fighter

topology:
  type: hero_with_sidekicks
  loss_rule: primary_hero_defeated
  fighters:
    - {id: ancient-leshen, display_name: Ancient Leshen, role: hero, count: 1, attack_type: ranged, starting_health: 13, move_value: 1, starts_on_board: true, summonable: false}
    - {id: wolf, display_name: Wolf, role: sidekick, count: 2, attack_type: melee, starting_health: 1, move_value: 3, starts_on_board: true, summonable: true}

setup:
  hooks: []
  state_initialization:
    - {key: ancient_leshen_attacked_this_turn, value: false}

ability:
  id: heart-of-the-forest
  controller: owner
  effects:
    - id: repeat-attack-bonus
      trigger: static
      controller: owner
      cancellation: source_defined
      continuous: true
      stages:
        - id: apply
          when: {attacker: ancient-leshen, ancient_leshen_attacked_earlier_this_turn: true}
          operations: [{op: ADD_VALUE, target: leshen_attack, amount: 3}]

resources: []
persistent_state:
  - {key: ancient_leshen_attacked_this_turn, type: boolean, reset: turn_start}
  - {key: left_space_this_turn_by_fighter, type: fighter_instance_boolean_map, reset: turn_start, key_domain: controller_fighter_instances}

deck:
  manifest: ../../cards/phase-4b/ancient-leshen.yaml
  construction: fixed

rulings:
  - id: wolves-do-not-arm-leshen-bonus
    summary: A Wolf attack does not count as the Ancient Leshen having attacked; only an earlier Leshen attack arms the +3 bonus.
    source_refs: [leshen-rulings]
  - id: summon-wolf-placement
    summary: Summon returns an off-board Wolf; if both Wolves are already on board, choose one and place it according to the effect.
    source_refs: [witcher-sas-rules-leshen]

sources:
  - {id: witcher-sas-rules-leshen, authority: official_set_rules, url: https://restorationgames.com/wp-content/uploads/2024/10/UM-W-SaS-Set-Rules.pdf, checked_at: 2026-07-27, supports: [Leshen and Wolf movement, Summon rules, Witcher ongoing schemes]}
  - {id: leshen-deck-index, authority: published_deck_index, url: https://unmatched.cards/umdb/decks/ancient-leshen, checked_at: 2026-07-27, supports: [fighter metadata, published deck corpus, Vanish Into Murder sequence]}
  - {id: leshen-rulings, authority: secondary_crosscheck, url: https://www.the-unmatched.club/heroes/ancient-leshen, checked_at: 2026-07-27, supports: [current Ancient Leshen ruling index]}
  - {id: dormant-rule-changes, authority: official_ruling, url: https://www.the-unmatched.club/rules/rule-changes, checked_at: 2026-07-27, supports: [dormant-player checkpoint and restrictions]}
  - {id: worker-c-normalization-leshen, authority: project_normalization, url: https://github.com/NordCoder/unmatched-web/blob/phase-4b-worker-c-modern/docs/phase-4b/worker-c-report.md, checked_at: 2026-07-27, supports: [dormant return and draw interpretation]}

validation:
  quantity: {result: pass, available_pool_count: 30, game_deck_count: 30, quantity_sum: 30}
  usable_by: pass
  references: pass
  source_coverage: qualified
  semantic_structure: pass
  integration: requires_shared_extension
  fan_content: pass

normalization_notes:
  - Ancient Leshen and Wolves have different fighter-definition move values.
  - Per-turn movement history is keyed by runtime fighter instance.
  - Vanish Into Murder temporary absence is owned by the scheduled non-defeat removal context; no duplicate boolean state is authoritative.
