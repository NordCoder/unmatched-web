schema_version: 1
id: moon-knight
display_name: Moon Knight
set_ids: [marvel-redemption-row]
status: verified
verification:
  evidence: verified
  semantics: verified
  integration: ready
  policy: not_applicable
requires: []
movement: 3

topology:
  type: single_hero
  loss_rule: primary_hero_defeated
  fighters:
    - {id: moon-knight, display_name: Moon Knight, role: hero, count: 1, attack_type: melee, starting_health: 16, starts_on_board: true, summonable: false}

setup:
  hooks: []
  state_initialization: [{key: active_identity, value: moon-knight}]

ability:
  id: multiple-personalities
  controller: owner
  effects:
    - id: moon-knight-start-move
      trigger: turn_start
      controller: controller
      cancellation: protected
      stages:
        - id: resolve
          when: {active_identity: moon-knight}
          choices: []
          costs: []
          operations: [{op: MOVE, target: moon-knight, max_distance: 2}]
    - id: khonshu-attack-bonus
      trigger: static
      controller: controller
      cancellation: protected
      stages:
        - id: apply
          when: {active_identity: khonshu, combat_role: attacker}
          choices: []
          costs: []
          operations: [{op: ADD_VALUE, target: own_attack, amount: 2}]
    - id: khonshu-effect-damage-immunity
      trigger: before_damage_applied
      controller: controller
      cancellation: protected
      stages:
        - id: prevent
          when: {active_identity: khonshu, damage_type: effect, damage_target: moon-knight}
          choices: []
          costs: []
          operations: [{op: PREVENT_DAMAGE, target: moon-knight, scope: all_effect_damage}]
    - id: mr-knight-defense-bonus
      trigger: static
      controller: controller
      cancellation: protected
      stages:
        - id: apply
          when: {active_identity: mr-knight, combat_role: defender}
          choices: []
          costs: []
          operations: [{op: ADD_VALUE, target: own_defense, amount: 1}]
    - id: identity-cycle
      trigger: turn_end
      controller: controller
      cancellation: protected
      stages:
        - id: advance
          when: always
          choices: []
          costs: []
          operations: [{op: CHANGE_STATE, key: active_identity, transition: moon-knight->khonshu->mr-knight->moon-knight}]

resources: []
persistent_state:
  - {key: active_identity, type: enum, reset: never}
  - {key: turn_start_space, type: space_ref, reset: turn_start, capture: moon-knight.current_space}

deck:
  manifest: ../../cards/phase-4b/moon-knight.yaml
  construction: fixed

rulings: []
interpretations: []

sources:
  - id: moon-knight-official-product
    authority: official
    url: https://restorationgames.com/shop/marvel-redemption-row/
    checked_at: 2026-07-27
    supports: [set_membership]
  - id: moon-knight-umdb
    authority: published_umdb
    url: https://unmatched.cards/umdb/decks/moon-knight
    checked_at: 2026-07-27
    supports: [fighter_stats, identity_cycle, identity_abilities, deck_construction]
  - id: moon-knight-rulings-index
    authority: secondary_cross_check
    url: https://www.the-unmatched.club/heroes/moon-knight
    checked_at: 2026-07-27
    supports: [identity_cross_check]

validation:
