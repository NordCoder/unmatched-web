schema_version: 1
id: titania
display_name: Titania
set_ids: [slings-and-arrows]
status: verified
movement: 2

topology:
  type: hero_with_sidekicks
  loss_rule: primary_hero_defeated
  fighters:
    - {id: titania, display_name: Titania, role: hero, count: 1, attack_type: ranged, starting_health: 12, starts_on_board: true, summonable: false}
    - {id: oberon, display_name: Oberon, role: sidekick, count: 1, attack_type: melee, starting_health: 6, starts_on_board: true, summonable: false}

setup:
  hooks:
    - stage: character_configuration
      operations:
        - {op: CREATE_CARD_ZONE, zone: glamour-deck, visibility: private_order, controller: owner}
        - {op: CREATE_CARD_ZONE, zone: active-glamour, visibility: public, controller: owner}
        - {op: CREATE_CARD_ZONE, zone: glamour-discard, visibility: public, controller: owner}
        - {op: SHUFFLE, zone: glamour-deck}
  state_initialization: []

ability:
  id: fairy-magic
  controller: owner
  effects:
    - id: expose-glamour
      trigger: turn_start
      condition: {active_glamour_zone_empty: true, glamour_deck_not_empty: true}
      operations: [{op: MOVE_CARD, from_zone: glamour-deck, to_zone: active-glamour, selector: top_card, face_up: true}]

resources:
  - id: glamour-cards
    kind: external_definition_pool
    visibility: public
    initial: six_glamour_definitions
  - {id: glamour-deck, kind: card_zone, visibility: private, initial: six_shuffled_glamour_instances}
  - {id: active-glamour, kind: card_zone, visibility: public, initial: empty}
  - {id: glamour-discard, kind: card_zone, visibility: public, initial: empty}

persistent_state: []

deck:
  manifest: ../../cards/phase-4b/titania.yaml
  construction: fixed

rulings:
  - id: glamour-lifecycle
    summary: Glamours are shuffled at setup; at the start of each turn reveal one only when none is active; discarded glamours are not reshuffled automatically and action-card effects are the only ordinary way to discard/return them.
    source: https://restorationgames.com/wp-content/uploads/2024/03/UM-SaA-Set-Rules.pdf
  - id: active-glamour-opponent-protection
    summary: An opponent cannot discard Titania's face-up glamour unless an authoritative effect gives that authority.
    source: https://www.the-unmatched.club/heroes/titania

sources:
  - {type: official_set_rules, url: https://restorationgames.com/wp-content/uploads/2024/03/UM-SaA-Set-Rules.pdf}
  - {type: published_deck_index, url: https://unmatched.cards/umdb/decks/titania}
  - {type: current_rulings_index, url: https://www.the-unmatched.club/heroes/titania}

normalization_notes:
  - Glamours are runtime card instances in a shuffled auxiliary deck, not six always-available spell definitions. The reusable auxiliary-deck extension is proposed in the Worker C report.
