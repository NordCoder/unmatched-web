schema_version: 1
id: willow
display_name: Willow
set_ids: [buffy-the-vampire-slayer]
status: blocked
movement: 2

topology:
  type: hero_with_sidekicks
  loss_rule: primary_hero_defeated
  fighters:
    - {id: willow, display_name: Willow, role: hero, count: 1, attack_type: ranged, starting_health: 14, starts_on_board: true, summonable: false}
    - {id: tara, display_name: Tara, role: sidekick, count: 1, attack_type: ranged, starting_health: 6, starts_on_board: true, summonable: false}
setup: {hooks: [], state_initialization: [{key: form, value: willow}]}
ability:
  id: dark-willow
  controller: owner
  effects:
    - id: transform-on-damage
      trigger: damage_dealt
      condition: {target_in: [willow, tara]}
      operations: [{op: SET_STATE, key: form, value: dark-willow}]
    - id: calm-with-tara
      trigger: turn_end
      condition: {state: form, equals: dark-willow, adjacent: [willow, tara]}
      operations: [{op: SET_STATE, key: form, value: willow}]
resources: []
persistent_state:
  - {key: form, type: enum, values: [willow, dark-willow], reset: never, visibility: public}
deck: {manifest: ../../cards/phase-4b/willow.yaml, construction: fixed}
rulings:
  - id: dark-willow-damage-trigger
    summary: Damage dealt to either Willow or Tara changes the public form to Dark Willow; Dark clauses are mandatory while Dark Willow and ignored while Willow unless the source says otherwise.
    source: https://how-to-play.s3.us-east-2.amazonaws.com/295564/rules/295564_rules.pdf
sources:
  - {type: official_rulebook, url: https://restorationgames.com/wp-content/uploads/2020/11/UM-Buffy_the_Vampire_Slayer-Rules-two-page.pdf}
  - {type: published_deck_index, url: https://unmatched.cards/umdb/decks/willow}
  - {type: current_reference, url: https://how-to-play.s3.us-east-2.amazonaws.com/295564/rules/295564_rules.pdf}
  - {type: official_rulings_archive, url: https://docs.google.com/document/d/13b-FbPq_vuqcc3IokeHvQ2ctJaDNZZuUaZmt4uft5h0/}
blocker:
  reason: absolute_health_assignment_on_revived_fighter_not_in_shared_effect_model
  affected_card: resurrect
  report: ../../phase-4b/worker-a-report.md