schema_version: 1
id: hamlet
display_name: Hamlet
set_ids: [slings-and-arrows]
status: partial
verification:
  evidence: qualified
  semantics: qualified
  integration: requires_shared_extension
  policy: not_applicable
requires: [C-REQ-013]
movement: 2

topology:
  type: hero_with_sidekicks
  loss_rule: primary_hero_defeated
  fighters:
    - {id: hamlet, display_name: Hamlet, role: hero, count: 1, attack_type: melee, starting_health: 15, starts_on_board: true, summonable: false}
    - {id: rosencrantz-and-guildenstern, display_name: Rosencrantz & Guildenstern, role: sidekick, count: 1, attack_type: melee, starting_health: 6, starts_on_board: true, summonable: false}

setup:
  hooks: []
  state_initialization:
    - {key: question_state, value: none}
    - {key: hamlet_took_damage_this_turn, value: false}

ability:
  id: the-question
  controller: owner
  effects:
    - id: choose-question-state
      trigger: turn_start
      stages:
        - id: choose-state
          choices:
            - {id: question-state-choice, owner: controller, visibility: public, optional: false, domain: [to-be, not-to-be], bind: question_state_choice}
          operations: [{op: SET_STATE, key: question_state, value: {ref: question_state_choice}}]
        - id: not-to-be-self-damage
          when: {ref: question_state_choice, equals: not-to-be}
          choices:
            - {id: self-damage-target, owner: controller, visibility: public, optional: false, domain: {selector: {fighters: controller_fighters}}, bind: self_damage_target}
          operations: [{op: DEAL_EFFECT_DAMAGE, target: {ref: self_damage_target}, amount: 2}]
    - id: to-be-extra-draw
      trigger: maneuver_draw
      condition: {question_state: to-be}
      operations: [{op: DRAW, count: 1}]
    - id: not-to-be-attack-bonus
      trigger: static
      continuous: true
      condition: {question_state: not-to-be, attacker: hamlet}
      operations: [{op: ADD_VALUE, target: hamlet_attack, amount: 2}]

resources: []
persistent_state:
  - {key: question_state, type: enum, reset: never, visibility: public}
  - {key: hamlet_took_damage_this_turn, type: boolean, reset: turn_start}

deck:
  manifest: ../../cards/phase-4b/hamlet.yaml
  construction: fixed

rulings:
  - id: rg-single-fighter
    summary: Rosencrantz & Guildenstern are one sidekick fighter despite the two-name display label.
    source_refs: [slings-rules-hamlet]
  - id: not-to-be-damages-own-fighter
    summary: Choosing NOT TO BE requires dealing 2 damage to one fighter controlled by Hamlet's player.
    source_refs: [hamlet-rulings]

sources:
  - id: slings-rules-hamlet
    authority: official_set_rules
    url: https://restorationgames.com/wp-content/uploads/2024/03/UM-SaA-Set-Rules.pdf
    checked_at: 2026-07-27
    supports: [Hamlet fighter rules, Rosencrantz and Guildenstern topology]
  - id: hamlet-deck-index
    authority: published_deck_index
    url: https://unmatched.cards/umdb/decks/hamlet
    checked_at: 2026-07-27
    supports: [fighter metadata, published deck corpus]
  - id: hamlet-rulings
    authority: secondary_crosscheck
    url: https://www.the-unmatched.club/heroes/hamlet
    checked_at: 2026-07-27
    supports: [current Hamlet ruling index]
  - id: worker-c-normalization-hamlet
    authority: project_normalization
    url: https://github.com/NordCoder/unmatched-web/blob/phase-4b-worker-c-modern/docs/phase-4b/worker-c-report.md
    checked_at: 2026-07-27
    supports: [failed-placement dependency interpretation]

validation:
  quantity: {result: pass, available_pool_count: 30, game_deck_count: 30, quantity_sum: 30}
  usable_by: pass
  references: pass
  source_coverage: qualified
  semantic_structure: pass
  integration: requires_shared_extension
  fan_content: pass

normalization_notes:
  - question_state is the single authoritative public enum state; the physical token is presentation only.
