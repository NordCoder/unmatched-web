schema_version: 1
id: elektra
display_name: Elektra
set_ids: [marvel-hells-kitchen]
status: blocked
movement: 2

topology:
  type: hero_with_sidekicks
  loss_rule: primary_hero_defeated
  fighters:
    - id: elektra
      display_name: Elektra
      role: hero
      count: 1
      attack_type: melee
      starting_health: 7
      starts_on_board: true
      summonable: false
    - id: the-hand
      display_name: The Hand
      role: sidekick
      count: 4
      attack_type: melee
      starting_health: 1
      starts_on_board: true
      summonable: false

setup:
  hooks: []
  state_initialization:
    - {key: resurrection_used, value: false}
    - {key: resurrection_pending, value: false}
    - {key: elektra_starting_health_profile, value: normal_7}

ability:
  id: resurrection
  controller: owner
  effects:
    - id: first-defeat-replacement
      trigger: would_defeat_primary_hero
      condition: {resurrection_used: false}
      operations:
        - {op: SET_STATE, key: resurrection_used, value: true}
        - {op: SET_STATE, key: resurrection_pending, value: true}
      normalization_blocker: Published rules then remove Elektra and every Hand fighter from the battlefield while explicitly not treating Elektra as defeated; current vocabulary has no such lifecycle transition.
    - id: resurrect-at-next-turn-start
      trigger: turn_start
      condition: {resurrection_pending: true}
      operations:
        - {op: SHUFFLE, zone: own_discard_into_deck}
        - {op: SET_STATE, key: elektra_starting_health_profile, value: resurrected_9}
        - {op: RETURN_FIGHTER, target: elektra, destination: chosen_legal_space, health_rule: set_to_9}
        - {op: RETURN_FIGHTER, target: each_the_hand, destination: each_in_different_zone, health_rule: set_to_1}
        - {op: SET_STATE, key: resurrection_pending, value: false}

resources: []

persistent_state:
  - key: resurrection_used
    type: boolean
    reset: never
  - key: resurrection_pending
    type: boolean
    reset: never
  - key: elektra_starting_health_profile
    type: enum
    reset: never

deck:
  manifest: ../../cards/phase-4b/elektra.yaml
  construction: fixed

rulings:
  - id: elektra-first-removal-not-defeat
    summary: The first time Elektra reaches the defeat condition, Elektra and all Hand fighters are removed from the battlefield, but Elektra is explicitly not defeated; she cannot return until the start of her next turn.
    source: https://www.the-unmatched.club/heroes/elektra-the-hand
  - id: elektra-no-ninjitsu-before-resurrection
    summary: Ninjitsu cannot return first-life Elektra after her ability removes her from play; scheduled resurrection at the next turn start is the only return at that point.
    source: https://gridbeast.gg/unmatched-rules-faq/
  - id: elektra-not-valid-for-defeated-fighter-revival
    summary: A revival effect that targets a defeated fighter cannot target first-life removed Elektra because she is not defeated.
    source: https://gridbeast.gg/unmatched-rules-faq/
  - id: elektra-remaining-actions-ignored-off-board
    summary: After the first-life removal, any remaining actions in that turn are ignored while Elektra is out of play.
    source: https://gridbeast.gg/unmatched-rules-faq/
  - id: elektra-exhaustion-before-movement-boost
    summary: If the maneuver draw causes first-life Elektra to hit zero from exhaustion, her removal resolves before the maneuver can proceed to movement boosting.
    source: https://gridbeast.gg/unmatched-rules-faq/

sources:
  - type: official_product
    url: https://restorationgames.com/shop/marvel-hells-kitchen-unmatched/
  - type: published_database
    url: https://unmatched.cards/umdb/decks/elektra
  - type: current_rulings_index
    url: https://www.the-unmatched.club/heroes/elektra-the-hand
  - type: current_secondary_faq
    url: https://gridbeast.gg/unmatched-rules-faq/

normalization_notes:
  - RESURRECTED card clauses are inactive before the resurrection and mandatory after resurrection.
  - The evidence gap is closed: current sources agree on removal, non-defeat status, next-turn resurrection, the 7-to-9 health profile, discard-to-deck shuffle, and Hand return constraints.
  - Elektra remains blocked only because the shared semantic model cannot represent an off-board fighter who is explicitly not defeated.

blockers:
  - id: semantic-extension-off-board-not-defeated
    reason: A generic lifecycle operation is required to remove a fighter from battlefield presence without applying DEFEAT, while preserving identity/ownership and supporting a later RETURN_FIGHTER transition.