schema_version: 1
id: elektra
display_name: Elektra
set_ids: [marvel-hells-kitchen]
status: partial
verification:
  evidence: verified
  semantics: verified
  integration: requires_shared_extension
  policy: not_applicable
requires: [B-REQ-003]
movement: 2

topology:
  type: hero_with_sidekicks
  loss_rule: primary_hero_defeated
  fighters:
    - {id: elektra, display_name: Elektra, role: hero, count: 1, attack_type: melee, starting_health: 7, starts_on_board: true, summonable: false}
    - {id: the-hand, display_name: The Hand, role: sidekick, count: 4, attack_type: melee, starting_health: 1, starts_on_board: true, summonable: false}

setup:
  hooks: []
  state_initialization:
    - {key: resurrection_used, value: false}
    - {key: resurrection_pending, value: false}
    - {key: elektra_starting_health_profile, value: normal_7}

ability:
  id: resurrection
  controller: owner
  effects:
    - id: first-defeat-replacement
      trigger: would_defeat_primary_hero
      controller: controller
      cancellation: protected
      stages:
        - id: replace-defeat
          when: {resurrection_used: false}
          choices: []
          costs: []
          operations:
            - {op: SET_STATE, key: resurrection_used, value: true}
            - {op: SET_STATE, key: resurrection_pending, value: true}
            - op: SET_FIGHTER_PRESENCE
              requirement: B-REQ-003
              targets: [elektra, each_the_hand_on_battlefield]
              presence: off_board_resurrection_pending
              elektra_defeat_status: undefeated
    - id: resurrect-at-next-turn-start
      trigger: turn_start
      controller: controller
      cancellation: protected
      stages:
        - id: choose-return-layout
          when: {resurrection_pending: true}
          choices:
            - id: elektra_return_space
              owner: controller
              visibility: public
              optional: false
              domain: {kind: space, selector: legal_elektra_resurrection_space}
              bind: elektra_return_space
            - id: hand_return_layout
              owner: controller
              visibility: public
              optional: false
              domain: {kind: placement_plan, selector: return_each_hand_in_different_zone}
              bind: hand_return_layout
          costs: []
          operations: []
        - id: return
          when: {all_bound: [elektra_return_space, hand_return_layout]}
          choices: []
          costs: []
          operations:
            - {op: SHUFFLE, zone: own_discard_into_deck}
            - {op: SET_STATE, key: elektra_starting_health_profile, value: resurrected_9}
            - {op: RETURN_FIGHTER, target: elektra, destination: {bound: elektra_return_space}, health_rule: set_to_9, requirement: B-REQ-003}
            - {op: RETURN_FIGHTER, target: each_the_hand, destination_plan: {bound: hand_return_layout}, health_rule: set_to_1, requirement: B-REQ-003}
            - {op: SET_STATE, key: resurrection_pending, value: false}

resources: []
persistent_state:
  - {key: resurrection_used, type: boolean, reset: never}
  - {key: resurrection_pending, type: boolean, reset: never}
  - {key: elektra_starting_health_profile, type: enum, reset: never}

deck:
  manifest: ../../cards/phase-4b/elektra.yaml
  construction: fixed

rulings:
  - id: elektra-first-removal-not-defeat
    source_ref: elektra-rulings-index
    summary: First-life removal takes Elektra and Hand fighters off the battlefield while Elektra is explicitly not defeated; scheduled resurrection occurs at the next turn start.
interpretations: []

sources:
  - id: elektra-official-product
    authority: official
    url: https://restorationgames.com/shop/marvel-hells-kitchen-unmatched/
    checked_at: 2026-07-27
    supports: [set_membership]
  - id: elektra-umdb
    authority: published_umdb
    url: https://unmatched.cards/umdb/decks/elektra
    checked_at: 2026-07-27
    supports: [fighter_stats, resurrection_behavior, deck_construction]
  - id: elektra-rulings-index
    authority: official_ruling_index
    url: https://www.the-unmatched.club/heroes/elektra-the-hand
    checked_at: 2026-07-27
    supports: [off_board_not_defeated, resurrection_timing]
  - id: elektra-secondary-faq
    authority: secondary_cross_check
    url: https://gridbeast.gg/unmatched-rules-faq/
    checked_at: 2026-07-27
    supports: [ninjitsu_cross_check, remaining_actions_cross_check, exhaustion_order_cross_check]

validation:
  quantity: {result: pass, available_pool_count: 20, game_deck_count: 20, quantity_sum: 20}
  usable_by: pass
  references: pass
  source_coverage: verified
  semantic_structure: pass
  integration: requires_shared_extension
  fan_content: pass
