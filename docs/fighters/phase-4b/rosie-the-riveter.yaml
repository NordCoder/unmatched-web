schema_version: 1
id: rosie-the-riveter
display_name: Rosie the Riveter
set_ids: [stars-and-stripes]
status: partial
reason: upgrade_token_initial_identity_order_not_directly_transcribed
movement: 2
topology:
  type: hero_with_sidekicks
  loss_rule: primary_hero_defeated
  fighters:
  - {id: rosie-the-riveter, display_name: Rosie the Riveter, role: hero, count: 1, attack_type: melee, starting_health: 15, starts_on_board: true, summonable: false}
  - {id: wendy-the-welder, display_name: Wendy the Welder, role: sidekick, count: 1, attack_type: melee, starting_health: 7, starts_on_board: true, summonable: false}
setup:
  hooks: []
  state_initialization:
  - {key: active_upgrade_count, value: 0}
ability:
  id: freedom-xk-ii-mech-suit
  controller: owner
  effects:
  - id: activate-upgrade
    trigger: start_turn
    operations: [{op: TRIGGER_COMPOSITE, kind: source_defined_activate_next_ordered_upgrade}]
  - id: reset-upgrades
    trigger: end_turn
    condition: {state: active_upgrade_count, equals: 4}
    operations: [{op: TRIGGER_COMPOSITE, kind: source_defined_deactivate_all_upgrades}]
  - id: upgrade-ranged
    trigger: static
    continuous: true
    condition: {source_defined_upgrade_active: ranged_attack}
    operations: [{op: TRIGGER_COMPOSITE, kind: source_defined_attack_type_modifier, target: rosie-the-riveter, attack_type: ranged}]
  - id: upgrade-movement
    trigger: static
    continuous: true
    condition: {source_defined_upgrade_active: movement_three}
    operations: [{op: TRIGGER_COMPOSITE, kind: source_defined_move_value_modifier, target: rosie-the-riveter, set_value: 3}]
  - id: upgrade-attack
    trigger: static
    continuous: true
    condition: {source_defined_upgrade_active: attack_plus_one}
    operations: [{op: ADD_VALUE, target: rosie_attack, amount: 1}]
  - id: upgrade-after-attack-draw
    trigger: after_attack
    optional: true
    condition: {source_defined_upgrade_active: draw_after_attack, attacker: rosie-the-riveter}
    operations: [{op: DRAW, count: 1}]
resources:
- id: upgrade-tokens
  kind: token_pool
  visibility: public
  initial: 4
  runtime_state:
    kind: ordered_token_row
    initial_active_count: 0
    initial_identity_order: unresolved_component_transcription
    activate_rule: leftmost_inactive
    deactivate_rule: leftmost_active_then_move_to_right_end
  definitions:
  - {id: ranged_attack, printed_name: null, printed_order: null, evidence_status: semantics_identified_printed_identity_unverified, active_effect: Rosie becomes a ranged fighter.}
  - {id: movement_three, printed_name: null, printed_order: null, evidence_status: semantics_identified_printed_identity_unverified, active_effect: Rosie's movement value is 3 instead of 2.}
  - {id: attack_plus_one, printed_name: null, printed_order: null, evidence_status: semantics_identified_printed_identity_unverified, active_effect: Rosie's attacks get +1 value.}
  - {id: draw_after_attack, printed_name: null, printed_order: null, evidence_status: semantics_identified_printed_identity_unverified, active_effect: After Rosie attacks, she may draw 1 card.}
persistent_state:
- {key: active_upgrade_count, type: integer, reset: never}
deck:
  manifest: ../../cards/phase-4b/rosie-the-riveter.yaml
  construction: fixed
rulings:
- id: upgrade-activation
  summary: The four upgrades begin inactive. Activation and deactivation follow the ordered token row defined by the Stars and Stripes set rules.
  source: https://restorationgames.com/wp-content/uploads/2025/08/UM-Stars-Stripes_Rulebook-FLAT.pdf
sources:
- {authority: official_component, url: https://restorationgames.com/shop/unmatched-stars-and-stripes/, checked_at: '2026-07-27'}
- {authority: official_set, url: https://restorationgames.com/wp-content/uploads/2025/08/UM-Stars-Stripes_Rulebook-FLAT.pdf, checked_at: '2026-07-27', note: Establishes the ordered-row activation/deactivation procedure and all-inactive setup.}
- {authority: official_component, url: https://restorationgames.com/gameplay-of-unmatched-stars-and-stripes/, checked_at: '2026-07-27', note: Confirms four upgrades, inactive-at-start behavior and additional active abilities.}
- {authority: official_component, url: https://restorationgames.com/wp-content/uploads/2026/05/Rosie-Upgrades-1024x354.png, checked_at: '2026-07-27', note: First-party visual reference; direct token identity/order mapping remains untranscribed.}
- {authority: reference, url: https://www.the-unmatched.club/heroes/rosie-the-riveter, checked_at: '2026-07-27', note: Fighter ability and current rules index.}
normalization_notes:
- Known upgrade semantics are ranged attack type, movement 3, +1 to Rosie's attacks, and optional draw 1 after Rosie attacks.
- Ordered-row activation/deactivation is source-defined gameplay.
- Fighter remains partial because the initial physical token identity/order mapping is not transcribed; without that mapping the row cannot deterministically identify which semantic upgrade becomes active next.
- Semantic ids are descriptive normalization ids, not claimed printed token names.
- active_upgrade_count is retained for count-based card conditions; the ordered token row separately determines which upgrade abilities are active.
