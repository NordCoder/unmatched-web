normalization_notes:
- Initial order and Merlin Engine are publisher-hosted rulebook facts; the other three effect mappings are explicitly retained as transient physical-component transcription, not promoted to rulebook evidence.
- Ordered upgrades are explicit state transitions/queries under D-REQ-012; no source_defined upgrade handler remains.
- Merlin Engine never modifies forced/effect MOVE.