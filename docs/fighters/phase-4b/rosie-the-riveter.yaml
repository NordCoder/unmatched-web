schema_version: 1
id: rosie-the-riveter
display_name: Rosie the Riveter
set_ids: [stars-and-stripes]
status: verified
movement: 2
topology:
  type: hero_with_sidekicks
  loss_rule: primary_hero_defeated
  fighters:
  - {id: rosie-the-riveter, display_name: Rosie the Riveter, role: hero, count: 1, attack_type: melee, starting_health: 15, starts_on_board: true, summonable: false}
  - {id: wendy-the-welder, display_name: Wendy the Welder, role: sidekick, count: 1, attack_type: melee, starting_health: 7, starts_on_board: true, summonable: false}
setup:
  hooks: []
  state_initialization:
  - {key: active_upgrade_count, value: 0}
ability:
  id: freedom-xk-ii-mech-suit
  controller: owner
  effects:
  - id: activate-upgrade
    trigger: start_turn
    operations: [{op: TRIGGER_COMPOSITE, kind: source_defined_activate_next_ordered_upgrade}]
  - id: reset-upgrades
    trigger: end_turn
    condition: {state: active_upgrade_count, equals: 4}
    operations: [{op: TRIGGER_COMPOSITE, kind: source_defined_deactivate_all_upgrades}]
  - id: merlin-engine-maneuver
    trigger: maneuver_movement
    optional: true
    condition: {upgrade_token_active: merlin-engine, mover: rosie-the-riveter}
    operations: [{op: TRIGGER_COMPOSITE, kind: source_defined_additional_maneuver_space, target: rosie-the-riveter, amount: 1}]
  - id: cavity-magnetron-draw
    trigger: after_attack
    optional: true
    condition: {upgrade_token_active: cavity-magnetron, attacker: rosie-the-riveter}
    operations: [{op: DRAW, count: 1}]
  - id: sedgley-fist-gun-attack
    trigger: static
    continuous: true
    condition: {upgrade_token_active: sedgley-fist-gun, attacker: rosie-the-riveter}
    operations: [{op: ADD_VALUE, target: rosie_attack, amount: 1}]
  - id: whizbang-ranged
    trigger: static
    continuous: true
    condition: {upgrade_token_active: whizbang}
    operations: [{op: TRIGGER_COMPOSITE, kind: source_defined_attack_type_modifier, target: rosie-the-riveter, attack_type: ranged}]
resources:
- id: upgrade-tokens
  kind: token_pool
  visibility: public
  initial: 4
  runtime_state:
    kind: ordered_token_row
    initial_active_count: 0
    initial_identity_order: [merlin-engine, cavity-magnetron, sedgley-fist-gun, whizbang]
    activate_rule: leftmost_inactive
    deactivate_rule: leftmost_active_then_move_to_right_end
  definitions:
  - id: merlin-engine
    printed_name: Merlin Engine
    printed_order: 1
    evidence_status: verified_official_set_rules
    active_effect: When Rosie maneuvers, she may move 1 additional space.
  - id: cavity-magnetron
    printed_name: Cavity Magnetron
    printed_order: 2
    evidence_status: verified_physical_component_transcription
    active_effect: After Rosie attacks, she may draw 1 card.
  - id: sedgley-fist-gun
    printed_name: Sedgley Fist Gun
    printed_order: 3
    evidence_status: verified_physical_component_transcription
    active_effect: Rosie's attacks get +1 value.
  - id: whizbang
    printed_name: Whizbang
    printed_order: 4
    evidence_status: verified_physical_component_transcription
    active_effect: Rosie is a ranged fighter.
persistent_state:
- {key: active_upgrade_count, type: integer, reset: never}
deck:
  manifest: ../../cards/phase-4b/rosie-the-riveter.yaml
  construction: fixed
rulings:
- id: upgrade-activation
  summary: The four upgrades begin inactive in the printed order Merlin Engine, Cavity Magnetron, Sedgley Fist Gun, Whizbang. Activation and deactivation follow the ordered token row defined by the Stars and Stripes set rules.
  source: https://restorationgames.com/wp-content/uploads/2025/08/UM-Stars-Stripes_Rulebook-FLAT.pdf
- id: merlin-engine
  summary: While Merlin Engine is active, when Rosie maneuvers she may move 1 additional space; this is maneuver-only and is not a permanent movement-value increase or an effect-movement modifier.
  source: https://restorationgames.com/wp-content/uploads/2025/08/UM-Stars-Stripes_Rulebook-FLAT.pdf
sources:
- {authority: official_component, url: https://restorationgames.com/shop/unmatched-stars-and-stripes/, checked_at: '2026-07-27'}
- {authority: official_set, url: https://restorationgames.com/wp-content/uploads/2025/08/UM-Stars-Stripes_Rulebook-FLAT.pdf, checked_at: '2026-07-27', note: Establishes the exact initial token order, ordered-row procedure, all-inactive setup and Merlin Engine text.}
- {authority: official_component, url: https://restorationgames.com/gameplay-of-unmatched-stars-and-stripes/, checked_at: '2026-07-27', note: Confirms four upgrades, inactive-at-start behavior and additional active abilities.}
- {authority: official_component, url: https://restorationgames.com/wp-content/uploads/2026/05/Rosie-Upgrades-1024x354.png, checked_at: '2026-07-27', note: First-party visual reference for the four physical upgrade components.}
- {authority: reference, url: https://www.the-unmatched.club/heroes/rosie-the-riveter, checked_at: '2026-07-27', note: Fighter ability and current rules index.}
normalization_notes:
- The official rulebook establishes the initial row Merlin Engine, Cavity Magnetron, Sedgley Fist Gun, Whizbang.
- Merlin Engine is not a static movement value of 3. It is an optional +1 space specifically when Rosie maneuvers, so forced/effect movement does not inherit it.
- The project owner directly transcribed the remaining physical upgrade cards from a component photograph during the evidence audit: Cavity Magnetron is the optional post-Rosie-attack draw, Sedgley Fist Gun gives Rosie's attacks +1 value, and Whizbang makes Rosie ranged. Durable artifact capture is intentionally deferred to a later evidence stage.
- active_upgrade_count is retained for count-based card conditions; the ordered token row separately determines which printed upgrades are active.