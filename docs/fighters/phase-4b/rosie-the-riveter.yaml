  url: https://restorationgames.com/shop/unmatched-stars-and-stripes/
  checked_at: '2026-07-27'
  supports: [release_membership]
  durability: durable
- id: rosie-upgrade-image
  authority: official_component_image
  url: https://restorationgames.com/wp-content/uploads/2026/05/Rosie-Upgrades-1024x354.png
  checked_at: '2026-07-27'
  supports: [upgrade_component_identities, physical_component_layout]
  durability: durable
