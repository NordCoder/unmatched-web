schema_version: 1
id: donatello
display_name: Donatello
set_ids:
- tmnt-adventures
status: verified
movement: 2
topology:
  type: hero_with_sidekicks
  loss_rule: primary_hero_defeated
  fighters:
  - id: donatello
    display_name: Donatello
    role: hero
    count: 1
    attack_type: melee
    starting_health: 14
    starts_on_board: true
    summonable: false
  - id: metalhead
    display_name: Metalhead
    role: sidekick
    count: 1
    attack_type: melee
    starting_health: 7
    starts_on_board: true
    summonable: false
setup:
  hooks: []
  state_initialization: []
ability:
  id: inventive
  controller: owner
  effects:
  - id: inventive-maneuver
    trigger: maneuver_draw_replacement
    optional: true
    operations:
    - {op: DRAW, count: 2}
    - {op: MOVE_CARD, from_zone: hand, to_zone: deck, selector: controller_chosen_card, position: bottom}
    note: The second operation is required when the two-card replacement draw is chosen.
  - id: invention-persistence
    trigger: own_invention_played_cleanup
    operations: [{op: MOVE_CARD, from_zone: resolution, to_zone: inventions, selector: played_card}]
resources:
- id: inventions
  kind: card_zone
  visibility: public
  initial: empty
  ownership_rule: card_instance_owner_is_preserved
  use_rule: cards_are_not_in_discard_and_are_not_normally_playable_from_this_zone
  source_lifetime: invention_static_effects_apply_while_source_card_remains_in_zone
persistent_state: []
deck:
  manifest: ../../cards/phase-4b/donatello.yaml
  construction: fixed
rulings:
- id: donatello-canceled-invention
  summary: A played Invention still tucks under Donatello and grants its ongoing bonus even if its played effect is canceled.
  source: https://iellogames.com/wp-content/uploads/2026/01/UMA-TMNT_Set-rules_EN_Light.pdf
- id: donatello-discarded-invention
  summary: An Invention discarded without being played does not tuck; tucked Inventions are not in the discard pile and cannot be retrieved as discarded cards.
  source: https://iellogames.com/wp-content/uploads/2026/01/UMA-TMNT_Set-rules_EN_Light.pdf
sources:
- authority: official_set
  url: https://iellogames.com/wp-content/uploads/2026/01/UMA-TMNT_Set-rules_EN_Light.pdf
  checked_at: '2026-07-26'
  note: Official Inventive rule, 30-card allocation and all three Invention definitions/ongoing bonuses.
- {authority: official_component, url: https://restorationgames.com/shop/unmatched-adventures-teenage-mutant-ninja-turtles/, checked_at: '2026-07-26'}
- authority: reference
  url: https://www.youtube.com/watch?v=fRie8VT5Tp8
  checked_at: '2026-07-26'
  note: Physical component/unboxing cross-check.
- authority: reference
  url: https://www.unmatchedarena.com/heroes/donatello
  checked_at: '2026-07-26'
  note: Complete current action-card transcription cross-checked against official Invention text.
- authority: reference
  url: https://www.the-unmatched.club/tools/tracker?h=donatello
  checked_at: '2026-07-26'
  note: Independent names/quantities cross-check.
normalization_notes:
- Only competitive Donatello/Metalhead behavior is modeled; Adventures enemy/scenario state is excluded.
- Inventions use a first-class public card zone; ordinary card ownership is preserved.
- The inventions zone explicitly owns the lifetime of its static source effects rather than relying on hidden fighter-specific state.
