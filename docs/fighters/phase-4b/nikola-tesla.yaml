schema_version: 1
id: nikola-tesla
display_name: Nikola Tesla
set_ids: [tales-to-amaze]
status: partial
verification:
  evidence: qualified
  semantics: qualified
  integration: requires_shared_extension
  policy: ready
requires: [C-REQ-004, C-REQ-013]
movement: 2

topology:
  type: single_hero
  loss_rule: primary_hero_defeated
  fighters:
    - {id: nikola-tesla, display_name: Nikola Tesla, role: hero, count: 1, attack_type: ranged, starting_health: 14, starts_on_board: true, summonable: false}

setup: {hooks: [], state_initialization: []}

ability:
  id: electrical-overflow
  controller: owner
  effects:
    - id: overflow-start-turn
      trigger: turn_start
      condition: {resource: charged-coils, equals: 2}
      operations:
        - {op: DEAL_EFFECT_DAMAGE, target: each_opposing_fighter_adjacent_to_tesla, amount: 1}
        - {op: MOVE, target: each_surviving_opposing_fighter_adjacent_to_tesla_after_damage, max_distance: 1, optional_per_target: true}
    - id: recharge-end-turn
      trigger: turn_end
      optional: true
      condition: {resource: charged-coils, lt: 2}
      operations: [{op: GAIN_RESOURCE, resource: charged-coils, amount: 1, cap: 2}]

resources:
  - id: charged-coils
    kind: counter
    visibility: public
    initial: 1
    minimum: 0
    maximum: 2
persistent_state: []

deck:
  manifest: ../../cards/phase-4b/nikola-tesla.yaml
  construction: fixed

rulings:
  - id: tesla-permissive-discharge-declaration
    summary: A two-coil discharge option is legal with one or zero charged coils; the selected two-coil branch/tier remains selected and may fizzle if its full declared discharge is required.
    source_refs: [tesla-underfunded-ruling]
  - id: tesla-overflow-move-survives-no-damage
    summary: Electrical Overflow can still move a legal adjacent opposing fighter even when its damage was not actually dealt.
    source_refs: [tesla-rulings]

interpretations:
  - id: tesla-underfunded-two-coil-resource-transition
    affects: [nikola-tesla, charged-coils, coil-discharge-effects]
    status: derived
    confidence: high
    behavior: With exactly one charged coil, a legal declaration to discharge two consumes the available charged coil (1 -> 0), keeps the two-coil branch/tier selected, never falls back to the one-coil tier, and permits a source-dependent effect requiring full discharge to fizzle.
    source_refs: [tta-set-rules-tesla, tesla-underfunded-ruling, worker-c-normalization]
    replacement_condition: Replace this normalization if an exact publisher/designer ruling explicitly defines a different one-charged-plus-declare-two resource transition.

sources:
  - id: tta-set-rules-tesla
    authority: official_set_rules
    url: https://iellogames.com/wp-content/uploads/2024/02/UN-Adventures_Set-rules_EN_Light.pdf
    checked_at: 2026-07-27
    supports: [coil token states, charge and discharge semantics, competitive hero setup]
  - id: tesla-deck-index
    authority: published_deck_index
    url: https://unmatched.cards/umdb/decks/nikola-tesla
    checked_at: 2026-07-27
    supports: [fighter metadata, published deck corpus]
  - id: tesla-underfunded-ruling
    authority: official_ruling
    url: https://www.the-unmatched.club/tools/disputes/a1c7dc96-d154-4253-80f1-d86015292f9e
    checked_at: 2026-07-27
    supports: [legal underfunded two-coil declaration, no tier downgrade, intentional fizzle]
  - id: tesla-rulings
    authority: secondary_crosscheck
    url: https://www.the-unmatched.club/heroes/nikola-tesla
    checked_at: 2026-07-27
    supports: [Electrical Overflow rulings]
  - id: worker-c-normalization
    authority: project_normalization
    url: https://github.com/NordCoder/unmatched-web/blob/phase-4b-worker-c-modern/docs/phase-4b/worker-c-report.md
    checked_at: 2026-07-27
    supports: [selected partial-discharge normalization and evidence qualifier]

validation:
  quantity: {result: pass, available_pool_count: 30, game_deck_count: 30, quantity_sum: 30}
  usable_by: pass
  references: pass
  source_coverage: qualified
  semantic_structure: pass
  integration: requires_shared_extension
  fan_content: pass

normalization_notes:
  - Competitive hero behavior only; no Adventures enemy/scenario state is modeled.
  - charged-coils is the single authoritative runtime resource.
  - End-turn charging is optional, and each legal fighter movement from Electrical Overflow is independently optional.
