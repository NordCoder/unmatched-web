schema_version: 1
id: nikola-tesla
display_name: Nikola Tesla
set_ids: [tales-to-amaze]
status: verified
movement: 2

topology:
  type: single_hero
  loss_rule: primary_hero_defeated
  fighters:
    - {id: nikola-tesla, display_name: Nikola Tesla, role: hero, count: 1, attack_type: ranged, starting_health: 14, starts_on_board: true, summonable: false}

setup: {hooks: [], state_initialization: []}

ability:
  id: electrical-overflow
  controller: owner
  effects:
    - id: overflow-start-turn
      trigger: turn_start
      condition: {resource: charged-coils, equals: 2}
      operations:
        - {op: DEAL_EFFECT_DAMAGE, target: each_opposing_fighter_adjacent_to_tesla, amount: 1}
        - {op: MOVE, target: each_surviving_opposing_fighter_adjacent_to_tesla_after_damage, max_distance: 1, optional_per_target: true}
    - id: recharge-end-turn
      trigger: turn_end
      optional: true
      condition: {resource: charged-coils, lt: 2}
      operations: [{op: GAIN_RESOURCE, resource: charged-coils, amount: 1, cap: 2}]

resources:
  - id: charged-coils
    kind: counter
    visibility: public
    initial: 1
    minimum: 0
    maximum: 2

persistent_state: []

deck:
  manifest: ../../cards/phase-4b/nikola-tesla.yaml
  construction: fixed

rulings:
  - id: tesla-permissive-discharge-declaration
    summary: A two-coil discharge option is legal with one or zero charged coils. The selected tier remains two, is not downgraded to the one-coil tier, and its dependent effect may intentionally fizzle when the declared discharge cannot be fully completed.
    source: https://www.the-unmatched.club/tools/disputes/a1c7dc96-d154-4253-80f1-d86015292f9e
  - id: tesla-overflow-move-survives-no-damage
    summary: The two-coil start-turn ability can still move a legal adjacent opposing fighter even when its damage was not actually dealt.
    source: https://www.the-unmatched.club/heroes/nikola-tesla

sources:
  - {type: official_set_rules, url: https://iellogames.com/wp-content/uploads/2024/02/UN-Adventures_Set-rules_EN_Light.pdf}
  - {type: published_deck_index, url: https://unmatched.cards/umdb/decks/nikola-tesla}
  - {type: current_rulings_index, url: https://www.the-unmatched.club/heroes/nikola-tesla}
  - {type: official_ruling, url: https://www.the-unmatched.club/tools/disputes/a1c7dc96-d154-4253-80f1-d86015292f9e}
  - {type: reference, url: https://how-to-play.s3.us-east-2.amazonaws.com/295564/rules/295564_rules.pdf, note: Unmatched Reference v10 identifies the Rulings Archive as officially recognized by Restoration Games.}
  - {type: official_product, url: https://restorationgames.com/shop/unmatched-adventures-tales-to-amaze/}

normalization_notes:
  - Competitive hero behavior only; no Adventures enemy/scenario state is modeled.
  - charged-coils is the single authoritative runtime resource; no duplicate persistent state mirrors it.
  - End-turn charging is optional, and each legal fighter movement from Electrical Overflow is independently optional.
  - "Recommended integration behavior (high confidence): with 1 charged coil and declared discharge 2, discharge the available coil (1 -> 0), preserve the declared two-coil branch/tier, and allow its dependent effect to fizzle when full discharge was required."
  - "Evidence qualifier: no exact-case publisher ruling for the 1 -> 0 transition was found; the recommendation composes the official charged -> discharged coil rule with the official underfunded-declaration/fizzle ruling."
