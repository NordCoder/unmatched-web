schema_version: 1
id: nikola-tesla
display_name: Nikola Tesla
set_ids: [tales-to-amaze]
status: verified
movement: 2

topology:
  type: single_hero
  loss_rule: primary_hero_defeated
  fighters:
    - {id: nikola-tesla, display_name: Nikola Tesla, role: hero, count: 1, attack_type: ranged, starting_health: 14, starts_on_board: true, summonable: false}

setup:
  hooks:
    - stage: character_configuration
      operations: [{op: SET_STATE, key: charged_coils, value: 1}]
  state_initialization:
    - {key: charged_coils, value: 1}

ability:
  id: electrical-overflow
  controller: owner
  effects:
    - id: overflow-start-turn
      trigger: turn_start
      condition: {charged_coils: 2}
      operations:
        - {op: DEAL_EFFECT_DAMAGE, target: each_opposing_fighter_adjacent_to_tesla, amount: 1}
        - {op: MOVE, target: each_opposing_fighter_adjacent_to_tesla_after_damage, max_distance: 1}
    - id: recharge-end-turn
      trigger: turn_end
      operations: [{op: GAIN_RESOURCE, resource: charged_coils, amount: 1, cap: 2}]

resources:
  - id: charged-coils
    kind: counter
    visibility: public
    initial: 1
    minimum: 0
    maximum: 2

persistent_state:
  - {key: charged_coils, type: integer, reset: never}

deck:
  manifest: ../../cards/phase-4b/nikola-tesla.yaml
  construction: fixed

rulings:
  - id: tesla-permissive-discharge-declaration
    summary: A two-coil discharge option is a legal choice even when only one or zero coils are charged. The selected two-coil tier is not automatically downgraded to the one-coil tier, and its dependent effect may intentionally fizzle when the declared discharge cannot be fully completed.
    source: https://www.the-unmatched.club/tools/disputes/a1c7dc96-d154-4253-80f1-d86015292f9e
  - id: tesla-partial-discharge-normalization
    summary: When exactly one coil is charged and the player declares the legal two-coil option, normalize the resource transition as discharging the one available charged coil (1 -> 0), keep the selected tier at two, and allow the dependent two-coil effect to fizzle. This is a high-confidence composition of the official ruling with the set rule that discharge changes each available coil from charged to discharged; no separate publisher ruling spelling out this exact one-line edge case was located.
    source: https://iellogames.com/wp-content/uploads/2024/02/UN-Adventures_Set-rules_EN_Light.pdf
    evidence_confidence: high
    explicit_exact_case_ruling: not_found
  - id: tesla-overflow-move-survives-no-damage
    summary: The two-coil start-turn ability can still move a legal adjacent opposing fighter even when its damage was not actually dealt.
    source: https://www.the-unmatched.club/heroes/nikola-tesla

sources:
  - {type: official_set_rules, url: https://iellogames.com/wp-content/uploads/2024/02/UN-Adventures_Set-rules_EN_Light.pdf}
  - {type: published_deck_index, url: https://unmatched.cards/umdb/decks/nikola-tesla}
  - {type: current_rulings_index, url: https://www.the-unmatched.club/heroes/nikola-tesla}
  - {type: official_ruling, url: https://www.the-unmatched.club/tools/disputes/a1c7dc96-d154-4253-80f1-d86015292f9e}
  - {type: reference, url: https://how-to-play.s3.us-east-2.amazonaws.com/295564/rules/295564_rules.pdf, note: Unmatched Reference v10 identifies the Rulings Archive as officially recognized by Restoration Games.}
  - {type: official_product, url: https://restorationgames.com/shop/unmatched-adventures-tales-to-amaze/}

normalization_notes:
  - Competitive hero behavior only; no Adventures enemy/scenario state is modeled.
  - Underfunded two-coil declaration legality and dependent-effect fizzle are source-backed. Do not auto-downgrade a declared two-coil tier to the one-coil tier.
  - Canonical Worker C normalization for 1 charged + declare 2 is 1 -> 0 charged, selected tier remains 2, dependent tier effect may fizzle. Confidence is high from composed official semantics; an explicit exact-case one-line publisher ruling was not found.
