schema_version: 1
id: bullseye
display_name: Bullseye
set_ids:
- marvel-hells-kitchen
status: blocked
movement: 2
topology:
  type: single_hero
  loss_rule: primary_hero_defeated
  fighters:
  - id: bullseye
    display_name: Bullseye
    role: hero
    count: 1
    attack_type: ranged
    starting_health: 14
    starts_on_board: true
    summonable: false
setup:
  hooks: []
  state_initialization:
  - key: won_combat_earlier_this_turn
    value: false
ability:
  id: worlds-greatest-assassin
  controller: owner
  effects:
  - id: extended-attack-range
    trigger: static
    continuous: true
    normalization_blocker: Bullseye may attack by graph distance up to 5 while ignoring zones. Phase 4A has no reusable graph-distance attack-legality modifier; the previous structured object stored in enum-typed state had no shared contract.
resources: []
persistent_state:
- key: turn_start_space
  type: space_ref
  reset: turn_start
  note: Required by card conditions that compare Bullseye's current space to the space where he started the turn.
- key: won_combat_earlier_this_turn
  type: boolean
  reset: turn_start
  note: Historical combat-engine snapshot. It becomes true only after a combat has fully resolved and Bullseye is its final winner, including a winner changed by Arrogant But Effective; therefore the current combat cannot satisfy its own "already won" predicate.
deck:
  manifest: ../../cards/phase-4b/bullseye.yaml
  construction: fixed
rulings: []
sources:
- type: official_product
  url: https://restorationgames.com/shop/marvel-hells-kitchen-unmatched/
- type: published_database
  url: https://unmatched.cards/umdb/decks/bullseye
- type: current_rulings_index
  url: https://www.the-unmatched.club/heroes/bullseye
normalization_notes:
- Bullseye's published special ability is only the extended attack range; prior-combat history is engine state required by his deck, not an additional hero ability.
- Audit correction: turn-start position and prior-win history are explicit persistent state instead of being reconstructed from current board/combat state.
blockers:
- id: semantic-extension-spatial-attack-range
  reason: A reusable attack-legality modifier is required for graph-distance attacks that ignore zones. The previous attack_range_rule object was stored in an enum-typed persistent state and was not defined by the shared Phase 4A semantic contract.
