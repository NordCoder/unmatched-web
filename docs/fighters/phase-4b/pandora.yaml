schema_version: 1
id: pandora
display_name: Pandora
set_ids:
- battle-of-legends-vol-3
status: verified
movement: 2
topology:
  type: hero_with_sidekicks
  loss_rule: primary_hero_defeated
  fighters:
  - id: pandora
    display_name: Pandora
    role: hero
    count: 1
    attack_type: melee
    starting_health: 14
    starts_on_board: true
    summonable: false
  - id: kakodaemon
    display_name: Kakodaemon
    role: sidekick
    count: 2
    attack_type: melee
    starting_health: 1
    starts_on_board: false
    summonable: true
    runtime_identity: Each Kakodaemon is a distinct one-health fighter instance.
setup:
  hooks: []
  state_initialization:
  - {key: pandora_attack_bonus_this_turn, value: 0}
ability:
  id: pandoras-box
  controller: owner
  effects:
  - id: open-pandoras-box
    trigger: start_turn
    operations:
    - op: TRIGGER_COMPOSITE
      kind: source_defined_controlled_reveal_loop
      pool: pandora-miseries
      controller_may_stop_between_iterations: true
      forced_stop: {total_feathers_gte: 3}
      after_stop: {damage_pandora_equal_revealed_count: true}
  - id: reset-pandoras-box
    trigger: end_turn
    operations:
    - op: TRIGGER_COMPOSITE
      kind: source_defined_return_and_shuffle_external_definitions
      pool: pandora-miseries
      destination: pandora-box
  - id: pandora-turn-attack-bonus
    trigger: static
    continuous: true
    condition: {attacker: pandora, state: pandora_attack_bonus_this_turn, gt: 0}
    operations: [{op: ADD_VALUE, target: pandora_attack, amount_from_state: pandora_attack_bonus_this_turn}]
resources:
- id: pandora-box
  kind: card_zone
  visibility: private
  initial: seven_misery_definitions_shuffled
- id: pandora-miseries
  kind: external_definition_pool
  visibility: public
  initial: seven_misery_definitions
- id: kakodaemons
  kind: token_pool
  visibility: public
  initial: 2
persistent_state:
- key: pandora_attack_bonus_this_turn
  type: integer
  reset: turn_end
deck:
  manifest: ../../cards/phase-4b/pandora.yaml
  construction: fixed
rulings: []
sources:
- {authority: official_component, url: https://restorationgames.com/shop/unmatched-battle-of-legends-vol-3/, checked_at: '2026-07-26'}
- authority: reference
  url: https://www.youtube.com/watch?v=6fP2amMnphI
  checked_at: '2026-07-26'
  note: Physical 2025 set/deck review used as component cross-check.
- authority: reference
  url: https://www.unmatchedarena.com/heroes/pandora
  checked_at: '2026-07-26'
  note: Current action-card transcription.
- authority: reference
  url: https://www.geektopiagames.com/unmatched/pandora/
  checked_at: '2026-07-26'
  note: Independent action-card and Misery cross-check.
normalization_notes:
- The seven Misery cards are external gameplay definitions and do not inflate the 30-card action deck.
- The Box repeat/stop procedure remains an explicit source-defined composite pending orchestrator promotion of a generic resumable loop primitive.
- No fan-deck namespace is used.
