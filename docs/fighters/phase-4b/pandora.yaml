normalization_notes:
- Seven Miseries are external gameplay definitions and do not inflate the fixed 30-card action deck.
- The reveal/resolve/continue procedure is fully described under D-REQ-002 rather than hidden behind source_defined_controlled_reveal_loop.
- Revealed-Misery count is persisted because later cards inspect it.